version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # 1.x drops the event-loop fixture model this suite uses; migrate deliberately.
      - dependency-name: "pytest-asyncio"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Tailwind 4 changes the config and plugin model; handle it as a migration.
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
