services:
  db:
    image: postgres:16
    container_name: rainbow-leaderboard-db
    environment:
      POSTGRES_USER: rainbow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rainbow}
      POSTGRES_DB: rainbow
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rainbow"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: rainbow-leaderboard-api:latest
    container_name: rainbow-leaderboard-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://rainbow:${POSTGRES_PASSWORD:-rainbow}@db:5432/rainbow
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
