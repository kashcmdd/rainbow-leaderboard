services:
  api:
    build: .
    container_name: rainbow-leaderboard-api
    depends_on:
      db:
        condition: service_healthy
    env_file:
    - .env
    environment:
    - DATABASE_URL=postgresql+asyncpg://rainbow:${POSTGRES_PASSWORD:-rainbow}@db:5432/rainbow
    image: rainbow-leaderboard-api:latest
    labels:
    - homepage.group=Apps
    - homepage.name=Rainbow Leaderboard
    - homepage.icon=mdi-trophy
    - homepage.href=http://217.216.92.83:8082
    - homepage.description=R6 leaderboard
    ports:
    - 8082:8000
    restart: unless-stopped
  db:
    container_name: rainbow-leaderboard-db
    environment:
      POSTGRES_DB: rainbow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rainbow}
      POSTGRES_USER: rainbow
    healthcheck:
      interval: 5s
      retries: 5
      test:
      - CMD-SHELL
      - pg_isready -U rainbow
      timeout: 5s
    image: postgres:16
    restart: unless-stopped
    volumes:
    - pgdata:/var/lib/postgresql/data
volumes:
  pgdata: null
