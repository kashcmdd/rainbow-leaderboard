{% extends "base.html" %}
{% block title %}Create Player — {{ site_name }}{% endblock %}
{% block content %}

<div class="mx-auto max-w-md">
    <div class="page-head">
        <div>
            <p class="eyebrow">Admin</p>
            <h1 class="display text-[32px] leading-none">Create player</h1>
            <p class="micro mt-2">Adds an unranked player</p>
        </div>
    </div>

    <form id="playerForm" class="space-y-4">
        <div>
            <label class="field-label" for="new-username">Username</label>
            <input id="new-username" type="text" name="username" required minlength="2" maxlength="64" class="field">
        </div>
        <button type="submit" class="btn btn-pink w-full py-2.5">Create player</button>
    </form>

    <div id="result" class="mt-6 hidden" role="status" aria-live="polite"></div>
</div>

<script>
document.getElementById('playerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = e.target.username.value;

    const res = await window.apiFetch('/api/players', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username }),
    });

    const result = document.getElementById('result');
    result.classList.remove('hidden');

    if (res.ok) {
        const data = await res.json();
        result.className = 'alert alert-success mt-6';
        result.innerHTML = `Player <strong>${data.username}</strong> created. ID: <code class="num text-[11px]">${data.id}</code>
        <br><a href="/player/${data.id}" class="font-semibold underline">View profile</a>`;
        e.target.reset();
    } else {
        const err = await res.json();
        result.className = 'alert alert-error mt-6';
        result.textContent = err.detail || 'Error creating player';
    }
});
</script>
{% endblock %}
