{% extends "base.html" %}
{% block content %}
<div class="max-w-sm mx-auto">
    <h1 class="text-2xl font-extrabold text-white mb-1">Create Player</h1>
    <p class="text-[10px] text-gray-600 uppercase tracking-widest mb-6">Add a new competitor</p>
    <div class="card p-6">
        <form id="playerForm" class="space-y-4">
            <div>
                <label class="text-[10px] text-gray-600 uppercase tracking-widest font-semibold mb-2 block">Username</label>
                <input type="text" name="username" required minlength="2" maxlength="64"
                       class="w-full bg-transparent border border-white/10 rounded-lg px-4 py-3 text-sm text-white placeholder-gray-600">
            </div>
            <button type="submit" class="btn btn-primary w-full py-3 text-sm">Create Player</button>
        </form>
        <div id="result" class="hidden mt-4 p-4 rounded-lg text-sm"></div>
    </div>
</div>

<script>
document.getElementById('playerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = e.target.username.value;

    const res = await window.apiFetch('/api/players', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({username}),
    });

    const result = document.getElementById('result');
    result.classList.remove('hidden');

    if (res.ok) {
        const data = await res.json();
        result.className = 'toast toast-success';
        result.innerHTML = `Player <strong>${data.username}</strong> created! ID: <code class="text-sm">${data.id}</code>
        <br><a href="/player/${data.id}" class="underline font-medium">View profile</a>`;
        e.target.reset();
    } else {
        const err = await res.json();
        result.className = 'toast toast-error';
        result.textContent = err.detail || 'Error creating player';
    }
});
</script>
{% endblock %}
