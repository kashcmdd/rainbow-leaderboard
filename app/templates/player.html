{% extends "base.html" %}
{% block content %}
<style>
    .noise-overlay::before {
        content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
        opacity: 0.025;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        background-repeat: repeat; background-size: 256px 256px;
    }
    @keyframes pulseGlow {
        0%, 100% { box-shadow: 0 0 18px var(--glow-color), 0 0 40px var(--glow-color-transparent); }
        50% { box-shadow: 0 0 32px var(--glow-color), 0 0 70px var(--glow-color-transparent); }
    }
    @keyframes pulseRing {
        0%, 100% { box-shadow: 0 0 0 0 var(--ring-color); }
        50% { box-shadow: 0 0 0 12px var(--ring-color-transparent); }
    }
    @keyframes countPulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.06); }
        100% { transform: scale(1); }
    }
    @keyframes drawLine {
        0% { stroke-dashoffset: 300; }
        100% { stroke-dashoffset: 0; }
    }
    @keyframes statGlow {
        0%, 100% { box-shadow: 0 0 8px var(--stat-color), inset 0 0 8px var(--stat-color-transparent); }
        50% { box-shadow: 0 0 20px var(--stat-color), inset 0 0 16px var(--stat-color-transparent); }
    }
    @keyframes shimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
    }
    @keyframes spinRing {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
    .animate-pulse-glow { animation: pulseGlow 2.5s ease-in-out infinite; }
    .animate-pulse-ring { animation: pulseRing 2s ease-in-out infinite; }
    .animate-count-pulse { animation: countPulse 0.4s ease-out; }
    .animate-draw-line { animation: drawLine 1.5s ease-out forwards; }
    .animate-stat-glow { animation: statGlow 3s ease-in-out infinite; }
    .sparkline-dot { animation: pulseDot 2s ease-in-out infinite; }
    @keyframes pulseDot { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
    .avatar-ring { background: conic-gradient(var(--ring-color-a), var(--ring-color-b), var(--ring-color-a)); animation: spinRing 3s linear infinite; }
    .card-hover { transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    .card-hover:hover { transform: translateY(-4px) scale(1.01); }
    .match-card { position: relative; overflow: hidden; }
    .match-card::before { content: ''; position: absolute; inset: 0; opacity: 0; transition: opacity 0.3s ease; border-radius: 12px; }
    .match-card:hover::before { opacity: 1; }
    .match-card-win::before { background: linear-gradient(135deg, rgba(0,230,118,0.04), transparent 60%); }
    .match-card-loss::before { background: linear-gradient(135deg, rgba(239,68,68,0.04), transparent 60%); }
    .tier-shield { filter: drop-shadow(0 0 8px var(--glow-color)); }
    .rank-gradient-bg { background: radial-gradient(ellipse 80% 60% at 50% 0%, var(--rank-color-transparent), transparent 70%); }
    .footer-line { background: linear-gradient(90deg, transparent, rgba(232,25,125,0.3), transparent); }
</style>

<div id="playerRoot">
    <div class="card p-8 animate-pulse"><div class="h-6 bg-white/5 rounded w-48 mb-4"></div><div class="grid grid-cols-2 md:grid-cols-4 gap-3"><div class="h-20 bg-white/5 rounded-lg"></div><div class="h-20 bg-white/5 rounded-lg"></div><div class="h-20 bg-white/5 rounded-lg"></div><div class="h-20 bg-white/5 rounded-lg"></div></div></div>
</div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

function isPlayerInTeam(playerName, teamName) {
    if (!teamName) return false;
    return teamName.split(' + ').some(n => n.trim() === playerName);
}

const IS_ADMIN = {% if request.session.get("user") and (request.session.get("user").get("id") in admin_discord_ids or request.session.get("user").get("is_admin")) %}true{% else %}false{% endif %};
const PLAYER_ID = '{{ player_id }}';
{% raw %}
const RANK_MAP = [
    { label: 'Bronze I',   threshold: 0,   color: '#7A4520' },
    { label: 'Bronze II',  threshold: 100,  color: '#96541A' },
    { label: 'Bronze III', threshold: 200, color: '#B8682A' },
    { label: 'Bronze IV',  threshold: 300, color: '#CD7F32' },
    { label: 'Bronze V',   threshold: 400, color: '#E09A50' },
    { label: 'Silver I',   threshold: 500,  color: '#787878' },
    { label: 'Silver II',  threshold: 600,  color: '#909090' },
    { label: 'Silver III', threshold: 700, color: '#A8A8A8' },
    { label: 'Silver IV',  threshold: 800, color: '#C0C0C0' },
    { label: 'Silver V',   threshold: 900, color: '#D8D8D8' },
    { label: 'Gold I',     threshold: 1000, color: '#B8960C' },
    { label: 'Gold II',    threshold: 1100, color: '#CCA800' },
    { label: 'Gold III',   threshold: 1200, color: '#FFD700' },
    { label: 'Gold IV',    threshold: 1300, color: '#FFE033' },
    { label: 'Gold V',     threshold: 1400, color: '#FFEA70' },
    { label: 'Platinum I',   threshold: 1500, color: '#0088AA' },
    { label: 'Platinum II',  threshold: 1600, color: '#00AACC' },
    { label: 'Platinum III', threshold: 1700, color: '#00C8E8' },
    { label: 'Platinum IV',  threshold: 1800, color: '#00E5FF' },
    { label: 'Platinum V',   threshold: 1900, color: '#66F0FF' },
    { label: 'Emerald I',   threshold: 2000, color: '#007A30' },
    { label: 'Emerald II',  threshold: 2100, color: '#009940' },
    { label: 'Emerald III', threshold: 2200, color: '#00BB50' },
    { label: 'Emerald IV',  threshold: 2300, color: '#00E676' },
    { label: 'Emerald V',   threshold: 2400, color: '#33FF8A' },
    { label: 'Diamond I',   threshold: 2500, color: '#6600CC' },
    { label: 'Diamond II',  threshold: 2600, color: '#7B35FF' },
    { label: 'Diamond III', threshold: 2700, color: '#9955FF' },
    { label: 'Diamond IV',  threshold: 2800, color: '#B388FF' },
    { label: 'Diamond V',   threshold: 2900, color: '#CCAAFF' },
    { label: 'Champion', threshold: 3000, color: '#E8197D' },
];

function getRank(elo) {
    let rank = RANK_MAP[0];
    for (const r of RANK_MAP) {
        if (elo >= r.threshold) rank = r;
    }
    return rank;
}

function rankGlow(color) {
    const c = color.replace('#','');
    const r = parseInt(c.slice(0,2),16);
    const g = parseInt(c.slice(2,4),16);
    const b = parseInt(c.slice(4,6),16);
    return `rgba(${r},${g},${b},0.6)`;
}

// ─── COMPONENTS ──────────────────────────────────────────────────────

function ShieldIcon({ rank }) {
    const fill = rank.color;
    const label = rank.label;
    if (label === 'Unranked') return null;
    const filename = label.toLowerCase().replace(/ /g, '_') + '.svg';
    return (
        <img src={`/static/rank-icons/${filename}`} alt={label}
             className="tier-shield"
             style={{ width: 52, height: 64, filter: `drop-shadow(0 0 6px ${fill}60)` }}/>
    );
}

function SvgHelmet({ fill, initial }) {
    return (
        <svg viewBox="0 0 80 80" className="w-full h-full" style={{ filter: `drop-shadow(0 0 6px ${fill}40)` }}>
            <path d="M24 42 Q24 24 40 20 Q56 24 56 42 L56 52 L24 52 Z"
                  fill={`${fill}18`} stroke={fill} strokeWidth="1.5" strokeOpacity="0.4"/>
            <path d="M28 38 Q28 26 40 23 Q52 26 52 38 L52 50 L28 50 Z"
                  fill={`${fill}10`} stroke={fill} strokeWidth="1" strokeOpacity="0.3"/>
            <path d="M30 35 Q30 30 40 28 Q50 30 50 35 L50 42 L30 42 Z"
                  fill={`${fill}30`} stroke={fill} strokeWidth="1"/>
            <circle cx="36" cy="34" r="2" fill={fill} opacity="0.8" className="sparkline-dot"/>
            <text x="40" y="66" textAnchor="middle" fill="#fff" fontSize="18" fontWeight="800"
                  style={{ filter: `drop-shadow(0 0 3px ${fill})` }}>{initial}</text>
            <line x1="52" y1="29" x2="56" y2="27" stroke={fill} strokeWidth="0.8" opacity="0.4"/>
            <line x1="52" y1="29" x2="54" y2="33" stroke={fill} strokeWidth="0.8" opacity="0.4"/>
        </svg>
    );
}

function StyledAvatar({ username, rank, avatarUrl, onAvatarChange }) {
    const initial = username.charAt(0).toUpperCase();
    const fill = rank.color;
    const [showPicker, setShowPicker] = useState(false);
    const inputRef = useRef(null);
    const handleFile = async (e) => {
        const f = e.target.files?.[0];
        if (!f) return;
        const form = new FormData();
        form.append('file', f);
        const res = await fetch(`/api/players/${PLAYER_ID}/avatar`, { method: 'POST', body: form });
        if (res.ok) { const d = await res.json(); onAvatarChange(d.avatar_url); }
        setShowPicker(false);
    };
    const handleUrl = async () => {
        const url = prompt('Enter image URL:');
        if (!url) return;
        const res = await fetch(`/api/players/${PLAYER_ID}/avatar`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({url}) });
        if (res.ok) { const d = await res.json(); onAvatarChange(d.avatar_url); }
        setShowPicker(false);
    };
    const handleRemove = async () => {
        const res = await fetch(`/api/players/${PLAYER_ID}/avatar`, { method: 'DELETE' });
        if (res.ok) onAvatarChange(null);
        setShowPicker(false);
    };
    const [imgErr, setImgErr] = useState(false);
    const showSvg = !avatarUrl || imgErr;
    return (
        <div className="relative shrink-0 group">
            <div className="absolute -inset-1 rounded-full avatar-ring z-0"
                 style={{ '--ring-color-a': `${fill}60`, '--ring-color-b': `${fill}20` }}/>
            <div className="relative z-10 w-24 h-24 rounded-full flex items-center justify-center overflow-hidden"
                 style={{ background: `linear-gradient(135deg, ${fill}25, #141416)` }}>
                {avatarUrl && !imgErr && <img src={avatarUrl} alt={username} className="absolute inset-0 w-full h-full object-cover z-10"
                    onError={() => setImgErr(true)}/>}
                {showSvg && <SvgHelmet fill={fill} initial={initial}/>}
            </div>
            <button onClick={() => setShowPicker(!showPicker)}
                    className="absolute -bottom-1 -right-1 z-20 w-8 h-8 rounded-full flex items-center justify-center text-xs opacity-0 group-hover:opacity-100 transition-opacity"
                    style={{ background: '#e8197d', color: '#fff', boxShadow: '0 0 8px rgba(232,25,125,0.5)' }}>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><path d="M12 5v14M5 12h14"/></svg>
            </button>
            {showPicker && (
                <div className="absolute top-0 left-full ml-3 z-30 rounded-xl p-3 flex flex-col gap-3 min-w-[200px]"
                     style={{ background: '#1c1c1f', border: '1px solid rgba(255,255,255,0.08)', boxShadow: '0 8px 32px rgba(0,0,0,0.6)' }}>
                    <input ref={inputRef} type="file" accept="image/*" onChange={handleFile} className="hidden"/>
                    <button onClick={() => inputRef.current?.click()}
                            className="w-full text-xs font-bold py-2 px-3 rounded-lg text-left transition-all"
                            style={{ background: 'rgba(232,25,125,0.15)', color: '#e8197d' }}>
                        Upload image
                    </button>
                    <button onClick={handleUrl}
                            className="w-full text-xs font-bold py-2 px-3 rounded-lg text-left transition-all"
                            style={{ background: 'rgba(255,255,255,0.05)', color: '#ccc' }}>
                        Set URL
                    </button>
                    {avatarUrl && <button onClick={handleRemove}
                            className="w-full text-xs font-bold py-2 px-3 rounded-lg text-left transition-all"
                            style={{ background: 'rgba(239,68,68,0.15)', color: '#ef4444' }}>
                        Remove avatar
                    </button>}
                </div>
            )}
        </div>
    );
}

function EloCounter({ target, rankColor }) {
    const [display, setDisplay] = useState(0);
    const [pulse, setPulse] = useState(false);
    useEffect(() => {
        let current = 0, steps = 60, inc = target / steps, i = 0;
        const t = setInterval(() => {
            i++; current = Math.min(Math.round(inc * i), target);
            setDisplay(current);
            if (i % 10 === 0) setPulse(true);
            if (current >= target) { clearInterval(t); setDisplay(target); setPulse(true); setTimeout(() => setPulse(false), 400); }
        }, 20);
        return () => clearInterval(t);
    }, [target]);
    useEffect(() => { if (pulse) { const t = setTimeout(() => setPulse(false), 400); return () => clearTimeout(t); } }, [pulse]);
    return <div className={`text-5xl font-extrabold tracking-tight transition-all ${pulse ? 'animate-count-pulse' : ''}`} style={{ color: rankColor }}>{display.toLocaleString()}</div>;
}

function CircularProgress({ percentage, color, value, delay }) {
    const r = 50, circ = 2 * Math.PI * r;
    const [off, setOff] = useState(circ);
    useEffect(() => { const t = setTimeout(() => setOff(circ * (1 - percentage / 100)), delay || 400); return () => clearTimeout(t); }, [percentage, delay]);
    return (
        <div className="flex flex-col items-center gap-2">
            <svg width="130" height="130" viewBox="0 0 130 130">
                <circle cx="65" cy="65" r={r} fill="none" stroke="rgba(255,255,255,0.06)" strokeWidth="8"/>
                <circle cx="65" cy="65" r={r} fill="none" stroke={color} strokeWidth="8" strokeLinecap="round"
                        strokeDasharray={circ} strokeDashoffset={off}
                        style={{ transition: 'stroke-dashoffset 1.5s cubic-bezier(0.4, 0, 0.2, 1)' }}
                        transform="rotate(-90 65 65)"/>
                <text x="65" y="58" textAnchor="middle" fill="#fff" fontSize="28" fontWeight="800">{value}</text>
                <text x="65" y="80" textAnchor="middle" fill="#666" fontSize="11" fontWeight="600">Win Rate</text>
            </svg>
        </div>
    );
}

function AnimatedBar({ value, label, color, max, delay }) {
    const [w, setW] = useState('0%');
    const pct = max > 0 ? (value / max) * 100 : 0;
    useEffect(() => { const t = setTimeout(() => setW(`${Math.min(pct, 100)}%`), delay || 200); return () => clearTimeout(t); }, [pct, delay]);
    return (
        <div className="space-y-1.5">
            <div className="flex items-center justify-between text-xs">
                <span className="text-gray-500 font-semibold uppercase tracking-wider">{label}</span>
                <span className="font-bold" style={{ color }}>{value}</span>
            </div>
            <div className="h-2.5 rounded-full" style={{ background: 'rgba(255,255,255,0.05)' }}>
                <div className="h-full rounded-full transition-all duration-1000 ease-out"
                     style={{ width: w, background: color, boxShadow: `0 0 12px ${color}40` }}/>
            </div>
        </div>
    );
}

function Sparkline({ data, color }) {
    const width = 280, height = 60, pt = 8, pb = 8;
    const chartH = height - pt - pb;
    const min = Math.min(...data), max = Math.max(...data), range = max - min || 1;
    const step = data.length > 1 ? (width) / (data.length - 1) : 0;
    const pts = data.map((v, i) => ({ x: i * step, y: pt + chartH - ((v - min) / range) * chartH }));
    if (pts.length === 0) return null;
    const linePath = pts.map((p, i) => `${i === 0 ? 'M' : 'L'}${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' ');
    const last = pts[pts.length - 1];
    return (
        <svg width="100%" height={height} viewBox={`0 0 ${width} ${height}`} preserveAspectRatio="none" className="overflow-visible">
            <defs><linearGradient id="sf" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={color} stopOpacity="0.15"/><stop offset="100%" stopColor={color} stopOpacity="0"/></linearGradient></defs>
            <path d={`${linePath} L${last.x.toFixed(1)} ${height} L${pts[0].x.toFixed(1)} ${height} Z`} fill="url(#sf)"/>
            <path d={linePath} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" strokeDasharray="300" className="animate-draw-line"/>
            <circle cx={last.x} cy={last.y} r="4" fill={color} className="sparkline-dot" style={{ filter: `drop-shadow(0 0 6px ${color})` }}/>
        </svg>
    );
}

function MatchCard({ match, playerName, index }) {
    const isWin = isPlayerInTeam(playerName, match.winner_name);
    const isA = isPlayerInTeam(playerName, match.team_a_name);
    const opponent = isA ? match.team_b_name : match.team_a_name;
    const delta = isWin
        ? (isA ? (match.elo_delta_a || 0) : (match.elo_delta_b || 0))
        : (isA ? (match.elo_delta_b || 0) : (match.elo_delta_a || 0));
    const borderColor = isWin ? '#00e676' : '#ef4444';
    const delay = 0.08 * (index + 1);
    return (
        <div className={`card card-hover match-card ${isWin ? 'match-card-win' : 'match-card-loss'} animate-slide-up opacity-0`}
             style={{ animationDelay: `${delay}s`, borderLeft: `3px solid ${borderColor}`, boxShadow: `inset 0 0 40px ${isWin ? 'rgba(0,230,118,0.08)' : 'rgba(239,68,68,0.08)'}` }}>
            <div className="relative z-10 p-4 flex items-center justify-between gap-4">
                <div className="flex items-center gap-3 min-w-0">
                    <div className="w-9 h-9 rounded-full flex items-center justify-center text-xs font-extrabold shrink-0"
                         style={{ background: `${borderColor}15`, color: borderColor }}>{opponent.charAt(0)}</div>
                    <div className="min-w-0">
                        <div className="text-sm font-bold text-white truncate">{opponent}</div>
                        <div className="flex items-center gap-2 mt-0.5">
                            <span className="text-[10px] font-semibold uppercase tracking-wider text-gray-600">{match.format}</span>
                            <span className="text-[10px] text-gray-700">·</span>
                            <span className="text-[10px] text-gray-600">{new Date(match.played_at).toLocaleDateString()}</span>
                        </div>
                    </div>
                </div>
                <div className="flex items-center gap-3 shrink-0">
                    <span className={`text-sm font-extrabold ${isWin ? 'text-white' : 'text-gray-400'}`}>{match.score_a}–{match.score_b}</span>
                    <span className={`text-xs font-extrabold px-2 py-0.5 rounded ${isWin ? 'text-white' : 'text-white'}`}
                          style={{ background: isWin ? 'rgba(0,230,118,0.2)' : 'rgba(239,68,68,0.2)', color: borderColor }}>
                        {isWin ? '+' : ''}{delta}
                    </span>
                </div>
            </div>
        </div>
    );
}

function GlowStatCard({ icon, label, value, color, delay }) {
    return (
        <div className="card p-4 text-center animate-slide-up opacity-0 animate-stat-glow"
             style={{ '--stat-color': `${color}40`, '--stat-color-transparent': `${color}10`, border: `1px solid ${color}20`, animationDelay: delay ? `${delay}s` : '0s' }}>
            <div className="text-lg mb-1">{icon}</div>
            <div className="text-2xl font-extrabold text-white">{value}</div>
            <div className="text-[10px] text-gray-600 font-semibold uppercase tracking-wider mt-0.5">{label}</div>
        </div>
    );
}

// ─── MAIN APP ────────────────────────────────────────────────────────

function App() {
    const [player, setPlayer] = useState(null);
    const [matches, setMatches] = useState([]);
    const [eloHistory, setEloHistory] = useState([]);
    const [seasons, setSeasons] = useState([]);
    const [loadState, setLoadState] = useState('loading');
    const chartRef = useRef(null);
    const chartInstance = useRef(null);

    useEffect(() => {
        (async () => {
            const res = await fetch(`/api/players/${PLAYER_ID}`);
            if (!res.ok) { setLoadState('notfound'); return; }
            const data = await res.json();
            setPlayer(data);
            const best = [...data.ratings].sort((a, b) => b.elo - a.elo)[0];
            const rank = best ? { label: best.rank_title, color: best.rank_color, threshold: best.elo } : getRank(best ? best.elo : 0);
            document.documentElement.style.setProperty('--rank-color', rank.color);
            document.documentElement.style.setProperty('--rank-color-transparent', `${rank.color}30`);
            const mr = await fetch('/api/matches?limit=50');
            const allMatches = await mr.json();
            const filtered = allMatches.filter(m => isPlayerInTeam(data.username, m.team_a_name) || isPlayerInTeam(data.username, m.team_b_name));
            setMatches(filtered);

            const [histRes, seasonsRes] = await Promise.all([
                fetch(`/api/players/${PLAYER_ID}/history?limit=200`),
                fetch(`/api/players/${PLAYER_ID}/seasons`),
            ]);
            if (histRes.ok) setEloHistory(await histRes.json());
            if (seasonsRes.ok) setSeasons(await seasonsRes.json());

            setLoadState('loaded');
        })();
    }, []);

    useEffect(() => {
        if (loadState !== 'loaded' || eloHistory.length < 2 || !chartRef.current) return;
        if (chartInstance.current) chartInstance.current.destroy();
        const ctx = chartRef.current.getContext('2d');
        const labels = eloHistory.map(e => new Date(e.timestamp).toLocaleDateString());
        const data = eloHistory.map(e => e.elo_after);
        const gradient = ctx.createLinearGradient(0, 0, 0, 220);
        gradient.addColorStop(0, 'rgba(232,25,125,0.2)');
        gradient.addColorStop(1, 'rgba(232,25,125,0)');
        chartInstance.current = new Chart(ctx, {
            type: 'line',
            data: {
                labels,
                datasets: [{
                    label: 'ELO',
                    data,
                    borderColor: '#e8197d',
                    backgroundColor: gradient,
                    borderWidth: 2,
                    pointRadius: 2,
                    pointHoverRadius: 5,
                    pointBackgroundColor: '#e8197d',
                    fill: true,
                    tension: 0.3,
                }],
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: { ticks: { color: '#666', maxTicksLimit: 8, font: { size: 10 } }, grid: { color: 'rgba(255,255,255,0.03)' } },
                    y: { ticks: { color: '#666', font: { size: 10 } }, grid: { color: 'rgba(255,255,255,0.05)' } },
                },
                interaction: { intersect: false, mode: 'index' },
            },
        });
    }, [eloHistory, loadState]);

    if (loadState === 'notfound') {
        return <div className="card p-12 text-center"><p className="text-sm text-gray-500">Player not found.</p><a href="/leaderboard" className="btn btn-pink mt-4 inline-block text-sm">Back</a></div>;
    }
    if (loadState === 'loading' || !player) {
        return <div className="card p-8 animate-pulse"><div className="h-6 bg-white/5 rounded w-48 mb-4"></div><div className="grid grid-cols-2 md:grid-cols-4 gap-3">{Array(4).fill(0).map((_,i) => <div key={i} className="h-20 bg-white/5 rounded-lg"></div>)}</div></div>;
    }

    const best = [...player.ratings].sort((a, b) => b.elo - a.elo)[0];
    const rank = best ? { label: best.rank_title, color: best.rank_color, threshold: best.elo } : RANK_MAP[0];
    const totWins = player.ratings.reduce((s, r) => s + r.wins, 0);
    const totLosses = player.ratings.reduce((s, r) => s + r.losses, 0);
    const totPlayed = totWins + totLosses;
    const wr = totPlayed > 0 ? (totWins / totPlayed) * 100 : 0;
    const rankColorStyle = { '--rank-color': rank.color, '--rank-color-transparent': `${rank.color}25` };

    // Sparkline: reconstruct ELO history from match deltas
    let sparkData = [];
    if (matches.length > 0) {
        const reversed = [...matches].reverse();
        let elo = best ? best.elo : 0;
        const hist = [];
        for (const m of reversed) {
            const isWin = isPlayerInTeam(player.username, m.winner_name);
            const isA = isPlayerInTeam(player.username, m.team_a_name);
            const delta = isA ? (m.elo_delta_a || 0) : (m.elo_delta_b || 0);
            hist.push(elo);
            elo += isWin ? -delta : delta;
        }
        hist.reverse();
        sparkData = hist.slice(-20);
    }

    return (
        <div className="relative" style={{ background: '#0d0d0f' }}>
            <div className="noise-overlay"/>
            <div className="fixed top-0 left-0 right-0 h-96 pointer-events-none z-[1] rank-gradient-bg" style={rankColorStyle}/>

            <div className="relative z-10">
                {/* ─── HEADER ──────────────────────────────── */}
                <div className="card p-6 sm:p-8 mb-6 animate-slide-up opacity-0 stagger-1" style={{ background: '#141416' }}>
                    <div className="flex flex-col md:flex-row items-center gap-6">
                        <StyledAvatar username={player.username} rank={rank} avatarUrl={player.avatar_url} onAvatarChange={(url) => setPlayer({...player, avatar_url: url})}/>
                        <div className="flex-1 text-center md:text-left">
                            <h1 className="text-3xl font-extrabold text-white mb-1">{player.username}</h1>
                            <div className="flex flex-wrap items-center justify-center md:justify-start gap-2">
                                <div className="flex items-center gap-2 px-3 py-1 rounded-full animate-pulse-glow"
                                     style={{ '--glow-color': `${rank.color}50`, '--glow-color-transparent': `${rank.color}15`, background: `${rank.color}15`, border: `1px solid ${rank.color}30` }}>
                                    <div className="w-4 h-4 rounded-full" style={{ background: rank.color }}/>
                                    <span className="text-xs font-extrabold uppercase tracking-wider" style={{ color: rank.color }}>{rank.label}</span>
                                </div>
                                <span className="text-xs text-gray-600">·</span>
                                <span className="text-xs text-gray-600">{totPlayed.toLocaleString()} matches</span>
                                <span className="text-xs text-gray-600">·</span>
                                <span className="text-xs" style={{ color: '#00e676' }}>{wr.toFixed(0)}% WR</span>
                            </div>
                        </div>
                        <div className="flex flex-col items-center gap-1 shrink-0">
                            <ShieldIcon rank={rank}/>
                            <EloCounter target={best ? best.elo : 0} rankColor={rank.color}/>
                            <span className="text-[10px] text-gray-600 font-semibold uppercase tracking-widest">ELO Rating</span>
                        </div>
                    </div>
                </div>

                {/* ─── STATS ────────────────────────────────── */}
                <div className="grid grid-cols-1 lg:grid-cols-12 gap-4 mb-6">
                    <div className="lg:col-span-4 card p-5 animate-slide-up opacity-0 stagger-2 flex flex-col items-center justify-center" style={{ background: '#141416' }}>
                        <h3 className="text-[10px] text-gray-600 font-semibold uppercase tracking-widest mb-3">Win Rate</h3>
                        <CircularProgress percentage={wr} color={rank.color} value={`${wr.toFixed(0)}%`} delay={300}/>
                        <div className="flex items-center gap-4 mt-4 text-xs">
                            <span style={{ color: '#00e676' }}>{totWins}W</span>
                            <span className="text-gray-700">·</span>
                            <span style={{ color: '#ef4444' }}>{totLosses}L</span>
                            {best && best.streak ? <span className="font-bold" style={{ color: best.streak > 0 ? '#00e676' : '#ef4444' }}>{best.streak > 0 ? '🔥' : ''}{best.streak > 0 ? '+' : ''}{best.streak}</span> : null}
                        </div>
                    </div>

                    <div className="lg:col-span-5 card p-5 animate-slide-up opacity-0 stagger-2 space-y-4" style={{ background: '#141416' }}>
                        <h3 className="text-[10px] text-gray-600 font-semibold uppercase tracking-widest">Performance</h3>
                        <AnimatedBar value={totWins} label="Wins" color="#00e676" max={totPlayed} delay={400}/>
                        <AnimatedBar value={totLosses} label="Losses" color="#ef4444" max={totPlayed} delay={600}/>
                        <AnimatedBar value={Math.round(wr)} label="Win Rate" color={rank.color} max={100} delay={800}/>
                        {sparkData.length > 1 && (
                            <div className="pt-2">
                                <div className="flex items-center justify-between text-[10px] text-gray-600 font-semibold uppercase tracking-widest mb-2">
                                    <span>ELO Trend</span>
                                    <span style={{ color: rank.color }}>+{Math.round(sparkData[sparkData.length-1] - sparkData[0])}</span>
                                </div>
                                <Sparkline data={sparkData} color={rank.color}/>
                            </div>
                        )}
                    </div>

                    <div className="lg:col-span-3 animate-slide-up opacity-0 stagger-2 grid grid-cols-2 gap-3 content-start">
                        <GlowStatCard icon="⚔️" label="Total Matches" value={totPlayed} color="#888" delay={0.3}/>
                        <GlowStatCard icon="🔥" label="Best ELO" value={best ? best.elo : 0} color="#00e676" delay={0.35}/>
                        <GlowStatCard icon="🏆" label="Best Rank" value={best ? best.rank_title : '—'} color={rank.color} delay={0.4}/>
                        <GlowStatCard icon="📈" label="Discord" value={player.discord_id ? 'Linked' : '—'} color={player.discord_id ? '#e8197d' : '#555'} delay={0.45}/>
                    </div>
                </div>



                {/* ─── ELO TREND CHART ──────────────────────── */}
                {eloHistory.length >= 2 && (
                    <div className="card p-5 mb-6 animate-slide-up opacity-0 stagger-3" style={{ background: '#141416' }}>
                        <h3 className="text-[10px] text-gray-600 font-semibold uppercase tracking-widest mb-4">ELO Trend</h3>
                        <div ref={chartRef} style={{ height: 220, width: '100%' }}/>
                    </div>
                )}

                {/* ─── SEASON HISTORY ─────────────────────────── */}
                {seasons.length > 0 && (
                    <div className="mb-6 animate-slide-up opacity-0 stagger-4">
                        <div className="flex items-center justify-between mb-4">
                            <h2 className="text-sm font-bold text-white uppercase tracking-widest">Season History</h2>
                        </div>
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                            {seasons.map((s, i) => (
                                <div key={s.season_id} className="card p-4 animate-slide-up opacity-0" style={{ background: '#141416', animationDelay: `${0.05 * i}s` }}>
                                    <div className="flex items-center justify-between mb-2">
                                        <span className="text-xs font-bold text-white">{s.season_name}</span>
                                        <span className="text-[10px] text-gray-600 font-semibold">#{s.position}</span>
                                    </div>
                                    <div className="flex items-center gap-2 mb-2">
                                        <div className="w-2.5 h-2.5 rounded-full" style={{ background: s.rank_color }}/>
                                        <span className="text-xs font-bold" style={{ color: s.rank_color }}>{s.rank_title}</span>
                                        <span className="text-xs text-gray-600 ml-auto">ELO {s.elo}</span>
                                    </div>
                                    <div className="flex items-center gap-3 text-[10px] text-gray-600 font-semibold">
                                        <span style={{ color: '#00e676' }}>{s.wins}W</span>
                                        <span className="text-gray-700">·</span>
                                        <span style={{ color: '#ef4444' }}>{s.losses}L</span>
                                        {s.season_end && <span className="ml-auto">{new Date(s.season_end).toLocaleDateString()}</span>}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                )}

                {/* ─── MATCH HISTORY ─────────────────────────── */}
                <div className="animate-slide-up opacity-0 stagger-5">
                    <div className="flex items-center justify-between mb-4">
                        <h2 className="text-sm font-bold text-white uppercase tracking-widest">Recent Matches</h2>
                        <div className="flex items-center gap-3 text-xs">
                            <span className="flex items-center gap-1 text-gray-600"><span className="w-2 h-2 rounded-full" style={{ background: '#00e676' }}/>Win</span>
                            <span className="flex items-center gap-1 text-gray-600"><span className="w-2 h-2 rounded-full" style={{ background: '#ef4444' }}/>Loss</span>
                        </div>
                    </div>
                    <div className="space-y-2.5">
                        {matches.length === 0
                            ? <div className="card p-8 text-center"><div className="text-sm text-gray-500">No matches yet.</div></div>
                            : matches.slice(0, 15).map((m, i) => <MatchCard key={m.id} match={m} playerName={player.username} index={i}/>)
                        }
                    </div>
                </div>

                {/* ─── FOOTER ─────────────────────────────────── */}
                <div className="mt-10 text-center animate-slide-up opacity-0 stagger-6">
                    <div className="footer-line h-px max-w-xs mx-auto mb-4"/>
                    <p className="text-xs text-gray-600 font-semibold uppercase tracking-widest">
                        Powered by <span className="font-extrabold" style={{ color: '#e8197d' }}>clukzers</span><span className="text-white font-extrabold">LB</span>
                    </p>
                    {IS_ADMIN && <a href={`/player/${PLAYER_ID}/edit`} className="btn text-xs mt-3 inline-block">Edit Player</a>}
                </div>
            </div>
        </div>
    );
}

ReactDOM.createRoot(document.getElementById('playerRoot')).render(<App/>);
{% endraw %}
</script>
{% endblock %}
