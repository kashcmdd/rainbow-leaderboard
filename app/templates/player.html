{% extends "base.html" %}
{% block title %}Player — {{ site_name }}{% endblock %}
{% block content %}

<div id="playerRoot">
    <div class="panel p-6">
        <div class="skeleton mb-4 h-8 w-56"></div>
        <div class="grid grid-cols-2 gap-3 md:grid-cols-4">
            <div class="skeleton h-20"></div>
            <div class="skeleton h-20"></div>
            <div class="skeleton h-20"></div>
            <div class="skeleton h-20"></div>
        </div>
    </div>
</div>

<script>
var IS_ADMIN = {% if request.session.get("user") and request.session.get("user").get("is_admin") %}true{% else %}false{% endif %};
var PLAYER_ID = '{{ player_id }}';

var RANK_MAP = [
    { label: 'Bronze I',   threshold: 0,   color: '#7A4520' },
    { label: 'Bronze II',  threshold: 100,  color: '#96541A' },
    { label: 'Bronze III', threshold: 200, color: '#B8682A' },
    { label: 'Bronze IV',  threshold: 300, color: '#CD7F32' },
    { label: 'Bronze V',   threshold: 400, color: '#E09A50' },
    { label: 'Silver I',   threshold: 500,  color: '#787878' },
    { label: 'Silver II',  threshold: 600,  color: '#909090' },
    { label: 'Silver III', threshold: 700, color: '#A8A8A8' },
    { label: 'Silver IV',  threshold: 800, color: '#C0C0C0' },
    { label: 'Silver V',   threshold: 900, color: '#D8D8D8' },
    { label: 'Gold I',     threshold: 1000, color: '#B8960C' },
    { label: 'Gold II',    threshold: 1100, color: '#CCA800' },
    { label: 'Gold III',   threshold: 1200, color: '#FFD700' },
    { label: 'Gold IV',    threshold: 1300, color: '#FFE033' },
    { label: 'Gold V',     threshold: 1400, color: '#FFEA70' },
    { label: 'Platinum I',   threshold: 1500, color: '#0088AA' },
    { label: 'Platinum II',  threshold: 1600, color: '#00AACC' },
    { label: 'Platinum III', threshold: 1700, color: '#00C8E8' },
    { label: 'Platinum IV',  threshold: 1800, color: '#00E5FF' },
    { label: 'Platinum V',   threshold: 1900, color: '#66F0FF' },
    { label: 'Emerald I',   threshold: 2000, color: '#007A30' },
    { label: 'Emerald II',  threshold: 2100, color: '#009940' },
    { label: 'Emerald III', threshold: 2200, color: '#00BB50' },
    { label: 'Emerald IV',  threshold: 2300, color: '#00E676' },
    { label: 'Emerald V',   threshold: 2400, color: '#33FF8A' },
    { label: 'Diamond I',   threshold: 2500, color: '#6600CC' },
    { label: 'Diamond II',  threshold: 2600, color: '#7B35FF' },
    { label: 'Diamond III', threshold: 2700, color: '#9955FF' },
    { label: 'Diamond IV',  threshold: 2800, color: '#B388FF' },
    { label: 'Diamond V',   threshold: 2900, color: '#CCAAFF' },
    { label: 'Champion', threshold: 3000, color: '#E8197D' },
];

function getRank(elo) {
    var rank = RANK_MAP[0];
    for (var i = 0; i < RANK_MAP.length; i++) {
        if (elo >= RANK_MAP[i].threshold) rank = RANK_MAP[i];
    }
    return rank;
}

function isPlayerInTeam(playerName, teamName) {
    if (!teamName) return false;
    return teamName.split(' + ').some(function(n) { return n.trim() === playerName; });
}

function esc(s) {
    var d = document.createElement('div');
    d.textContent = s == null ? '' : String(s);
    return d.innerHTML;
}

function cssVar(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

function hexToRgba(hex, alpha) {
    var c = (hex || '#e8197d').replace('#', '');
    if (c.length === 3) c = c.split('').map(function(x) { return x + x; }).join('');
    var r = parseInt(c.slice(0, 2), 16);
    var g = parseInt(c.slice(2, 4), 16);
    var b = parseInt(c.slice(4, 6), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
}

function pad2(n) {
    return String(n).padStart(2, '0');
}

// ─── COUNTER ─────────────────────────────────────────────

function animateCounter(el, target, duration) {
    duration = duration || 900;
    var steps = 40, i = 0;
    var interval = duration / steps;
    function tick() {
        i++;
        var current = Math.min(Math.round((target / steps) * i), target);
        el.textContent = current.toLocaleString();
        if (current >= target) {
            clearInterval(t);
            el.textContent = target.toLocaleString();
        }
    }
    var t = setInterval(tick, interval);
}

function animateWinRate(el, target) {
    var r = 50, circ = 2 * Math.PI * r;
    var circle = el.querySelector('.wr-circle-fill');
    if (!circle) return;
    setTimeout(function() {
        circle.style.strokeDashoffset = circ * (1 - target / 100);
    }, 300);
}

// ─── ELO CHART (theme-aware) ─────────────────────────────

function drawEloChart(canvas, history) {
    if (!canvas || history.length < 2) return;
    var ctx = canvas.getContext('2d');
    var W = canvas.width, H = canvas.height;
    var pad = { top: 16, bottom: 22, left: 48, right: 44 };
    var chartW = W - pad.left - pad.right;
    var chartH = H - pad.top - pad.bottom;

    var data = history.map(function(e) { return e.elo_after; });
    var labels = history.map(function(e) { return new Date(e.timestamp).toLocaleDateString(); });
    var min = Math.min.apply(null, data);
    var max = Math.max.apply(null, data);
    var range = max - min || 1;
    var padding = range * 0.1;
    min -= padding;
    max += padding;

    function x(i) { return pad.left + (i / (data.length - 1)) * chartW; }
    function y(v) { return pad.top + chartH - ((v - min) / (max - min)) * chartH; }

    var lineColor = cssVar('--signal') || '#e8197d';
    var gridColor = cssVar('--line') || 'rgba(255,255,255,0.08)';
    var labelColor = cssVar('--ink-3') || '#6f7a7f';

    ctx.clearRect(0, 0, W, H);

    // Grid
    ctx.strokeStyle = gridColor;
    ctx.lineWidth = 1;
    var lines = 4;
    ctx.font = '10px "JetBrains Mono", monospace';
    for (var i = 0; i <= lines; i++) {
        var yPos = pad.top + (i / lines) * chartH;
        ctx.beginPath();
        ctx.moveTo(pad.left, yPos);
        ctx.lineTo(W - pad.right, yPos);
        ctx.stroke();
        var val = Math.round(max - (i / lines) * (max - min));
        ctx.fillStyle = labelColor;
        ctx.textAlign = 'right';
        ctx.fillText(val, pad.left - 8, yPos + 3);
    }

    // X labels
    ctx.fillStyle = labelColor;
    ctx.font = '10px "JetBrains Mono", monospace';
    ctx.textAlign = 'center';
    var maxLabels = W < 420 ? 3 : 6;
    var labelStep = Math.max(1, Math.ceil(labels.length / maxLabels));
    for (var i = 0; i < labels.length; i += labelStep) {
        var lx = Math.min(Math.max(x(i), pad.left + 22), W - pad.right + 16);
        ctx.fillText(labels[i], lx, H - 5);
    }

    // Area fill
    var gradient = ctx.createLinearGradient(0, pad.top, 0, pad.top + chartH);
    gradient.addColorStop(0, hexToRgba(lineColor, 0.14));
    gradient.addColorStop(1, hexToRgba(lineColor, 0));
    ctx.beginPath();
    ctx.moveTo(x(0), pad.top + chartH);
    for (var i = 0; i < data.length; i++) {
        ctx.lineTo(x(i), y(data[i]));
    }
    ctx.lineTo(x(data.length - 1), pad.top + chartH);
    ctx.closePath();
    ctx.fillStyle = gradient;
    ctx.fill();

    // Line
    ctx.beginPath();
    for (var i = 0; i < data.length; i++) {
        if (i === 0) ctx.moveTo(x(i), y(data[i]));
        else ctx.lineTo(x(i), y(data[i]));
    }
    ctx.strokeStyle = lineColor;
    ctx.lineWidth = 1.6;
    ctx.lineJoin = 'round';
    ctx.stroke();

    // Last point marker
    var lastX = x(data.length - 1), lastY = y(data[data.length - 1]);
    ctx.beginPath();
    ctx.arc(lastX, lastY, 3, 0, Math.PI * 2);
    ctx.fillStyle = lineColor;
    ctx.fill();
}

// ─── PROFILE ─────────────────────────────────────────────

function renderProfile(root, state) {
    var p = state.player;
    if (!p) { return; }

    var best = p.ratings.slice().sort(function(a, b) { return b.elo - a.elo; })[0];
    var rank = best ? { label: best.rank_title, color: best.rank_color } : RANK_MAP[0];
    var totWins = 0, totLosses = 0;
    for (var i = 0; i < p.ratings.length; i++) { totWins += p.ratings[i].wins; totLosses += p.ratings[i].losses; }
    var totPlayed = totWins + totLosses;
    var wr = totPlayed > 0 ? (totWins / totPlayed) * 100 : 0;

    var sparkData = [];
    if (state.matches.length > 0) {
        var reversed = state.matches.slice().reverse();
        var elo2 = best ? best.elo : 0;
        var hist = [];
        for (var i = 0; i < reversed.length; i++) {
            var m = reversed[i];
            var isW = isPlayerInTeam(p.username, m.winner_name);
            var isA = isPlayerInTeam(p.username, m.team_a_name);
            var d = isA ? (m.elo_delta_a || 0) : (m.elo_delta_b || 0);
            hist.push(elo2);
            elo2 += isW ? -d : d;
        }
        hist.reverse();
        sparkData = hist.slice(-20);
    }

    var initial = p.username.charAt(0).toUpperCase();
    var rankFilename = rank.label.toLowerCase().replace(/ /g, '_') + '.svg';
    var elo = best ? best.elo : 0;

    // Last five results, newest first.
    var form = state.matches.slice(0, 5).map(function (m) {
        return isPlayerInTeam(p.username, m.winner_name) ? 'W' : 'L';
    });

    // ELO change from matches in the last 7 days.
    var weekAgo = Date.now() - 7 * 24 * 60 * 60 * 1000;
    var movement = state.eloHistory.reduce(function (sum, e) {
        return new Date(e.timestamp).getTime() >= weekAgo ? sum + (e.elo_after - e.elo_before) : sum;
    }, 0);

    var currentRank = getRank(elo);
    var nextRank = RANK_MAP.find(function (r) { return r.threshold > elo; });
    var progressPct = 0, toNext = 0, nextLabel = '';
    if (nextRank) {
        var span = nextRank.threshold - currentRank.threshold;
        progressPct = span > 0 ? Math.min(100, Math.max(0, ((elo - currentRank.threshold) / span) * 100)) : 0;
        toNext = nextRank.threshold - elo;
        nextLabel = nextRank.label;
    }

    var formTicks = form.map(function (r) {
        var color = r === 'W' ? 'var(--win)' : 'var(--loss)';
        return '<span class="num flex h-4 w-4 items-center justify-center border text-[9px] font-semibold" style="border-color:' + color + ';color:' + color + '">' + r + '</span>';
    }).join('');

    var progressBlock = nextRank
        ? '<div class="w-32 sm:w-48"><div class="micro flex items-center justify-between"><span>' + nextLabel + '</span><span>' + toNext + ' ELO</span></div>' +
          '<div class="meter mt-1.5"><span style="width:' + progressPct + '%;background:var(--signal)"></span></div></div>'
        : '<div class="micro text-right">' + (best && best.top_position ? 'Top ' + best.top_position : 'Champion') + '</div>';

    var header = '<div class="panel mb-3 overflow-hidden sm:mb-4">' +
        '<div class="p-4 sm:p-6">' +
        '<div class="flex items-center gap-4 sm:gap-6">' +
        renderAvatar(p, rank, initial) +
        '<div class="min-w-0 flex-1">' +
        '<p class="eyebrow">Player dossier</p>' +
        '<h1 class="display truncate text-[30px] leading-none sm:text-[42px]">' + esc(p.username) + '</h1>' +
        '<div class="mt-2 flex flex-wrap items-center gap-2 sm:mt-3">' +
        '<span class="rank-chip" style="--rank-color:' + rank.color + '">' +
        '<img src="/static/rank-icons/' + rankFilename + '" alt="" class="h-3.5 w-3.5">' + esc(rank.label) + '</span>' +
        '<span class="micro">' + totPlayed.toLocaleString() + ' matches</span>' +
        '<span class="micro" style="color:var(--ink-2)">' + wr.toFixed(0) + '% WR</span>' +
        (best && best.streak ? '<span class="badge ' + (best.streak > 0 ? 'badge-win' : 'badge-loss') + '">' + (best.streak > 0 ? '+' : '') + best.streak + '</span>' : '') +
        (IS_ADMIN ? '<a href="/player/' + PLAYER_ID + '/edit" class="btn btn-sm">Edit</a>' : '') +
        '</div>' +
        (form.length ? '<div class="mt-2 flex items-center gap-1.5"><span class="micro mr-1">Form</span>' + formTicks + '</div>' : '') +
        '</div></div>' +
        '<div class="mt-4 flex items-end justify-between gap-4 sm:mt-5">' +
        '<div class="flex items-center gap-3">' +
        '<img src="/static/rank-icons/' + rankFilename + '" alt="" class="h-10 w-auto sm:h-12">' +
        '<div>' +
        '<div id="eloCounter" class="num rank-elo text-[32px] font-semibold leading-none sm:text-[44px]" style="--rank-color:' + rank.color + '">0</div>' +
        '<div class="micro mt-1">ELO · <span style="color:' + (movement > 0 ? 'var(--win)' : movement < 0 ? 'var(--loss)' : 'var(--ink-3)') + '">' + (movement > 0 ? '+' : '') + movement + ' 7d</span></div>' +
        '</div></div>' +
        progressBlock +
        '</div></div>' +
        // stat strip
        '<div class="grid grid-cols-2 gap-px border-t sm:grid-cols-4" style="border-color:var(--line);background:var(--line)">' +
        renderStatCell('Matches', totPlayed.toLocaleString()) +
        renderStatCell('Best ELO', elo.toLocaleString()) +
        renderStatCell('Best rank', best ? best.rank_title : '—') +
        renderStatCell('Discord', p.discord_id ? 'Linked' : '—') +
        '</div></div>';

    var body = '<div class="mb-3 grid grid-cols-1 gap-3 sm:mb-4 sm:gap-4 lg:grid-cols-12">' +
        '<div class="panel hidden flex-col items-center justify-center p-5 lg:col-span-4 lg:flex">' +
        '<h3 class="stat-label mb-3">Win rate</h3>' +
        renderWinRateCircle(wr, rank.color) +
        '<div class="num mt-4 flex items-center gap-3 text-[12px]">' +
        '<span style="color:var(--win)">' + totWins + 'W</span>' +
        '<span class="text-ink3">/</span>' +
        '<span style="color:var(--loss)">' + totLosses + 'L</span></div>' +
        '</div>' +
        '<div class="panel space-y-4 p-4 sm:p-5 lg:col-span-8">' +
        '<h3 class="stat-label">Performance</h3>' +
        renderBar('Wins', totWins, totPlayed, 'var(--win)', 200) +
        renderBar('Losses', totLosses, totPlayed, 'var(--loss)', 320) +
        renderBar('Win rate', Math.round(wr), 100, 'var(--signal)', 440) +
        (sparkData.length > 1 ? renderSparkline(sparkData, cssVar('--signal') || '#e8197d') : '') +
        '</div></div>' +
        renderMatchHistory(state, p) +
        (state.eloHistory.length >= 2
            ? '<div class="panel mb-3 mt-3 p-4 sm:mb-4 sm:mt-4 sm:p-5"><div class="section-head mb-3 sm:mb-4"><h3 class="stat-label mb-0">ELO trend</h3><span class="micro">' + state.eloHistory.length + ' changes</span></div><canvas id="eloChart" height="200" style="width:100%;height:200px"></canvas></div>'
            : '') +
        (state.seasons.length > 0 ? renderSeasons(state.seasons) : '');

    root.innerHTML = header + body;

    setTimeout(function() {
        var el = document.getElementById('eloCounter');
        if (el) animateCounter(el, best ? best.elo : 0, 900);
    }, 80);
    setTimeout(function() {
        animateWinRate(document.querySelector('.wr-container'), wr);
    }, 160);

    if (state.eloHistory.length >= 2) {
        var cvs = document.getElementById('eloChart');
        if (cvs) {
            cvs.width = cvs.parentElement.offsetWidth || 600;
            cvs.height = 220;
            drawEloChart(cvs, state.eloHistory);
            window.addEventListener('themechange', function() {
                var c = document.getElementById('eloChart');
                if (c) drawEloChart(c, state.eloHistory);
            });
        }
    }

    wireAvatarPicker(root, state, rank, initial);
    wireMatchFilters(state, p);
}

function renderStatCell(label, value) {
    return '<div class="bg-panel px-4 py-3">' +
        '<div class="stat-label">' + label + '</div>' +
        '<div class="num mt-1 truncate text-[15px] font-semibold text-ink">' + esc(value) + '</div></div>';
}

function renderAvatar(p, rank, initial) {
    var avatarHtml;
    if (!p.avatar_url) {
        avatarHtml = renderSvgHelmet(rank.color, initial);
    } else {
        avatarHtml = '<img src="' + esc(p.avatar_url) + '" alt="' + esc(p.username) + '" class="absolute inset-0 h-full w-full object-cover" id="profileAvatarImg">';
    }
    return '<div class="relative shrink-0 self-center md:self-auto" id="avatarWrap">' +
        '<div class="relative flex h-20 w-20 items-center justify-center overflow-hidden border sm:h-24 sm:w-24" style="border-color:var(--line-strong);background:var(--panel-2)">' +
        '<div id="avatarContent" class="flex h-full w-full items-center justify-center">' + avatarHtml + '</div></div>' +
        (IS_ADMIN
            ? '<button id="avatarPickerBtn" class="absolute -bottom-1 -right-1 flex h-7 w-7 items-center justify-center border" style="background:var(--signal);border-color:var(--signal);color:#fff" aria-label="Change avatar">' +
              '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>' +
              '<div id="avatarPicker" class="panel absolute left-0 top-full z-30 mt-2 hidden w-52 p-2">' +
              '<input id="avatarFileInput" type="file" accept="image/*" class="hidden">' +
              '<button id="avatarUploadBtn" class="w-full px-3 py-2 text-left text-xs font-semibold text-signal hover:bg-panel2">Upload image</button>' +
              '<button id="avatarUrlBtn" class="w-full px-3 py-2 text-left text-xs font-semibold text-ink2 hover:bg-panel2">Set URL</button>' +
              '<div id="avatarUrlForm" class="mt-1 gap-1" style="display:none">' +
              '<input id="avatarUrlInput" class="field !py-1 text-[11px]" placeholder="https://…" aria-label="Avatar image URL">' +
              '<button id="avatarUrlSave" class="btn btn-sm">Save</button>' +
              '</div>' +
              (p.avatar_url ? '<button id="avatarRemoveBtn" class="w-full px-3 py-2 text-left text-xs font-semibold" style="color:var(--loss)">Remove avatar</button>' : '') +
              '</div>'
            : '') +
        '</div>';
}

function renderSvgHelmet(fill, initial) {
    return '<svg viewBox="0 0 80 80" class="h-full w-full" aria-hidden="true">' +
        '<path d="M24 44 Q24 24 40 19 Q56 24 56 44 L56 54 L24 54 Z" fill="' + fill + '14" stroke="' + fill + '66" stroke-width="1.2"/>' +
        '<path d="M29 40 Q29 27 40 24 Q51 27 51 40 L51 48 L29 48 Z" fill="none" stroke="' + fill + '55" stroke-width="1"/>' +
        '<text x="40" y="43" text-anchor="middle" fill="var(--ink)" font-size="17" font-weight="600" font-family="Barlow Condensed, sans-serif">' + initial + '</text>' +
        '</svg>';
}

function renderWinRateCircle(percentage, color) {
    var r = 50, circ = 2 * Math.PI * r;
    var val = percentage.toFixed(0) + '%';
    return '<div class="wr-container rank-elo flex flex-col items-center" style="--rank-color:' + color + '">' +
        '<svg width="132" height="132" viewBox="0 0 130 130" role="img" aria-label="Win rate ' + val + '">' +
        '<circle class="wr-track" cx="65" cy="65" r="' + r + '" fill="none" stroke-width="7"/>' +
        '<circle class="wr-circle-fill" cx="65" cy="65" r="' + r + '" fill="none" stroke="var(--rank-ink)" stroke-width="7" stroke-linecap="butt" stroke-dasharray="' + circ + '" stroke-dashoffset="' + circ + '" style="transition:stroke-dashoffset 1.1s cubic-bezier(0.22, 1, 0.36, 1)" transform="rotate(-90 65 65)"/>' +
        '<text x="65" y="73" text-anchor="middle" class="wr-value">' + val + '</text>' +
        '</svg></div>';
}

function renderBar(label, value, max, color, delay) {
    var pct = max > 0 ? Math.min((value / max) * 100, 100) : 0;
    return '<div class="animate-bar" data-delay="' + delay + '" data-pct="' + pct + '">' +
        '<div class="mb-1.5 flex items-center justify-between">' +
        '<span class="micro">' + label + '</span>' +
        '<span class="num text-[12px] font-medium text-ink">' + value + '</span></div>' +
        '<div class="meter"><span data-bar style="width:0%;background:' + color + '"></span></div></div>';
}

function renderSparkline(data, color) {
    var width = 280, height = 54, pt = 6, pb = 6;
    var chartH = height - pt - pb;
    var min = Math.min.apply(null, data);
    var max = Math.max.apply(null, data);
    var range = max - min || 1;
    var step = data.length > 1 ? width / (data.length - 1) : 0;
    var pts = data.map(function(v, i) { return { x: i * step, y: pt + chartH - ((v - min) / range) * chartH }; });
    if (pts.length === 0) return '';
    var linePath = pts.map(function(p, i) { return (i === 0 ? 'M' : 'L') + p.x.toFixed(1) + ' ' + p.y.toFixed(1); }).join(' ');
    var last = pts[pts.length - 1];
    var gradientId = 'sparkGrad_' + Math.random().toString(36).slice(2, 8);
    var net = Math.round(data[data.length - 1] - data[0]);
    return '<div class="border-t pt-3" style="border-color:var(--line)">' +
        '<div class="mb-2 flex items-center justify-between">' +
        '<span class="micro">Recent ELO</span>' +
        '<span class="num text-[11px]" style="color:' + (net >= 0 ? 'var(--win)' : 'var(--loss)') + '">' + (net >= 0 ? '+' : '') + net + '</span></div>' +
        '<svg width="100%" height="' + height + '" viewBox="0 0 ' + width + ' ' + height + '" preserveAspectRatio="none" class="overflow-visible" aria-hidden="true">' +
        '<defs><linearGradient id="' + gradientId + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="' + color + '" stop-opacity="0.12"/><stop offset="100%" stop-color="' + color + '" stop-opacity="0"/></linearGradient></defs>' +
        '<path d="' + linePath + ' L' + last.x.toFixed(1) + ' ' + height + ' L' + pts[0].x.toFixed(1) + ' ' + height + ' Z" fill="url(#' + gradientId + ')"/>' +
        '<path d="' + linePath + '" fill="none" stroke="' + color + '" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>' +
        '</svg></div>';
}

function renderMatchRows(matches, playerName, expanded) {
    if (matches.length === 0) {
        return '<div class="px-4 py-10 text-center text-xs text-ink3">No matches yet.</div>';
    }
    var limit = expanded ? matches.length : 10;
    var html = matches.slice(0, limit).map(function (m) { return renderMatchRow(m, playerName); }).join('');
    if (!expanded && matches.length > 10) {
        html += '<button id="matchesMore" type="button" class="micro w-full py-3 hover:text-ink">Show all ' + matches.length + '</button>';
    }
    return html;
}

function renderMatchHistory(state, p) {
    return '<div class="panel mb-3 sm:mb-4">' +
        '<div class="flex flex-wrap items-center justify-between gap-2 border-b px-4 py-3" style="border-color:var(--line)">' +
        '<h2 class="display text-[18px] leading-none">Recent matches</h2>' +
        '<button id="filterToggle" type="button" class="btn btn-sm lg:hidden" aria-expanded="false" aria-controls="matchFilters">Filters</button>' +
        '<div id="matchFilters" class="match-filters w-full flex-wrap items-center gap-2 lg:w-auto">' +
        '<select id="formatFilter" class="field !w-auto !py-1.5 text-xs" aria-label="Filter by format">' +
        '<option value="">All formats</option>' +
        '<option value="1v1">1v1</option><option value="2v2">2v2</option><option value="3v3">3v3</option>' +
        '<option value="4v4">4v4</option><option value="5v5">5v5</option></select>' +
        '<input type="date" id="dateFrom" class="field !w-auto !py-1.5 text-xs" aria-label="From date">' +
        '<input type="date" id="dateTo" class="field !w-auto !py-1.5 text-xs" aria-label="To date">' +
        '</div></div>' +
        '<div id="matchHistoryContainer">' + renderMatchRows(state.matches, p.username, false) + '</div></div>';
}

function renderMatchRow(match, playerName) {
    var isWin = isPlayerInTeam(playerName, match.winner_name);
    var isA = isPlayerInTeam(playerName, match.team_a_name);
    var opponent = isA ? match.team_b_name : match.team_a_name;
    var delta = isWin
        ? (isA ? (match.elo_delta_a || 0) : (match.elo_delta_b || 0))
        : (isA ? (match.elo_delta_b || 0) : (match.elo_delta_a || 0));
    var dateStr = new Date(match.played_at).toLocaleDateString();
    return '<a href="/match/' + match.id + '" class="flex items-center justify-between gap-3 border-b px-4 py-3 last:border-b-0 hover:bg-panel2" style="border-color:var(--line)">' +
        '<div class="flex min-w-0 items-center gap-3">' +
        '<span class="badge ' + (isWin ? 'badge-win' : 'badge-loss') + '">' + (isWin ? 'W' : 'L') + '</span>' +
        '<div class="min-w-0">' +
        '<div class="truncate text-[13px] font-semibold text-ink">' + esc(opponent) + '</div>' +
        '<div class="micro mt-0.5">' + esc(match.format) + ' · ' + dateStr + '</div>' +
        '</div></div>' +
        '<div class="flex shrink-0 items-center gap-3">' +
        '<span class="num text-[14px] font-semibold text-ink">' + match.score_a + '–' + match.score_b + '</span>' +
        (delta ? '<span class="num text-[11px] font-medium" style="color:' + (isWin ? 'var(--win)' : 'var(--loss)') + '">' + (isWin ? '+' : '') + delta + '</span>' : '') +
        '</div></a>';
}

function renderSeasons(seasons) {
    var html = '<div class="mb-4">' +
        '<div class="section-head"><h2 class="display text-[18px] leading-none">Season history</h2><span class="micro">' + seasons.length + (seasons.length === 1 ? ' season' : ' seasons') + '</span></div>' +
        '<div class="grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-3">';
    for (var i = 0; i < seasons.length; i++) {
        var s = seasons[i];
        var dateStr = s.season_end ? new Date(s.season_end).toLocaleDateString() : '';
        html += '<div class="panel p-4">' +
            '<div class="flex items-center justify-between gap-2">' +
            '<span class="text-[12px] font-semibold text-ink">' + esc(s.season_name) + '</span>' +
            '<span class="micro">#' + (s.position || '—') + '</span></div>' +
            '<div class="mt-3 flex items-center justify-between gap-2">' +
            '<span class="rank-chip" style="--rank-color:' + s.rank_color + '"><span class="tick" style="color:' + s.rank_color + '"></span>' + esc(s.rank_title) + '</span>' +
            '<span class="num rank-elo text-[15px] font-semibold" style="--rank-color:' + s.rank_color + '">' + s.elo + '</span></div>' +
            '<div class="num mt-3 flex items-center gap-3 text-[11px]">' +
            '<span style="color:var(--win)">' + s.wins + 'W</span>' +
            '<span style="color:var(--loss)">' + s.losses + 'L</span>' +
            (dateStr ? '<span class="ml-auto text-ink3">' + dateStr + '</span>' : '') +
            '</div></div>';
    }
    html += '</div></div>';
    return html;
}

function wireMatchFilters(state, p) {
    var container = document.getElementById('matchHistoryContainer');
    function bindMore() {
        var more = document.getElementById('matchesMore');
        if (more && container) {
            more.addEventListener('click', function () {
                container.innerHTML = renderMatchRows(state.matches, p.username, true);
                bindMore();
            });
        }
    }
    bindMore();

    var toggle = document.getElementById('filterToggle');
    var filters = document.getElementById('matchFilters');
    if (toggle && filters) {
        toggle.addEventListener('click', function () {
            var open = filters.classList.toggle('is-open');
            toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
        });
    }

    var fmt = document.getElementById('formatFilter');
    var df = document.getElementById('dateFrom');
    var dt = document.getElementById('dateTo');
    if (!fmt) return;
    var handler = async function() {
        var url = '/api/matches?player_id=' + PLAYER_ID + '&limit=50';
        if (fmt.value) url += '&format=' + fmt.value;
        if (df.value) url += '&date_from=' + df.value;
        if (dt.value) url += '&date_to=' + dt.value;
        var mr = await fetch(url);
        if (mr.ok) {
            state.matches = await mr.json();
            if (container) {
                container.innerHTML = renderMatchRows(state.matches, p.username, false);
                bindMore();
            }
        }
    };
    fmt.addEventListener('change', handler);
    df.addEventListener('change', handler);
    dt.addEventListener('change', handler);
}

async function loadData() {
    var root = document.getElementById('playerRoot');
    try {
        var [pd, matchesRes, seasonsRes, eloHist] = await Promise.all([
            fetch('/api/players/' + PLAYER_ID).then(r => r.json()),
            fetch('/api/matches?player_id=' + PLAYER_ID + '&limit=50').then(r => r.json()),
            fetch('/api/players/' + PLAYER_ID + '/seasons').then(r => r.json()).catch(() => []),
            fetch('/api/players/' + PLAYER_ID + '/history').then(r => r.json()).catch(() => []),
        ]);
        renderProfile(root, { player: pd, matches: matchesRes, seasons: seasonsRes, eloHistory: eloHist });
    } catch (e) {
        root.innerHTML = '<div class="panel p-12 text-center"><div class="mb-4 text-sm" style="color:var(--loss)">Failed to load player.</div><a href="/" class="btn">Go Home</a></div>';
    }
}

// ─── AVATAR PICKER ───────────────────────────────────────

function wireAvatarPicker(root, state, rank, initial) {
    var btn = document.getElementById('avatarPickerBtn');
    var picker = document.getElementById('avatarPicker');
    var fileInput = document.getElementById('avatarFileInput');
    var uploadBtn = document.getElementById('avatarUploadBtn');
    var urlBtn = document.getElementById('avatarUrlBtn');
    var removeBtn = document.getElementById('avatarRemoveBtn');

    if (btn && picker) {
        btn.addEventListener('click', function(e) {
            e.stopPropagation();
            picker.classList.toggle('hidden');
        });
        document.addEventListener('click', function(e) {
            if (!e.target.closest('#avatarWrap')) picker.classList.add('hidden');
        });
    }

    function onAvatarChange(newUrl) {
        state.player.avatar_url = newUrl;
        var content = document.getElementById('avatarContent');
        if (content) {
            if (newUrl) {
                content.innerHTML = '<img src="' + esc(newUrl) + '" alt="' + esc(state.player.username) + '" class="absolute inset-0 h-full w-full object-cover">';
            } else {
                content.innerHTML = renderSvgHelmet(rank.color, initial);
            }
        }
        if (picker) picker.classList.add('hidden');
    }

    if (fileInput) {
        fileInput.addEventListener('change', async function(e) {
            var f = e.target.files[0];
            if (!f) return;
            var form = new FormData();
            form.append('file', f);
            var res = await window.apiFetch('/api/players/' + PLAYER_ID + '/avatar', { method: 'POST', body: form });
            if (res.ok) { var d = await res.json(); onAvatarChange(d.avatar_url); }
        });
    }

    if (uploadBtn) {
        uploadBtn.addEventListener('click', function() { fileInput.click(); });
    }

    if (urlBtn) {
        urlBtn.addEventListener('click', function() {
            var form = document.getElementById('avatarUrlForm');
            if (!form) return;
            form.style.display = form.style.display === 'none' ? 'flex' : 'none';
            if (form.style.display === 'flex') {
                var input = document.getElementById('avatarUrlInput');
                if (input) input.focus();
            }
        });
    }

    var urlSave = document.getElementById('avatarUrlSave');
    if (urlSave) {
        urlSave.addEventListener('click', async function() {
            var input = document.getElementById('avatarUrlInput');
            var url = input && input.value.trim();
            if (!url) return;
            var res = await window.apiFetch('/api/players/' + PLAYER_ID + '/avatar', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({url: url}) });
            if (res.ok) {
                var d = await res.json();
                onAvatarChange(d.avatar_url);
                var form = document.getElementById('avatarUrlForm');
                if (form) form.style.display = 'none';
            }
        });
    }

    if (removeBtn) {
        removeBtn.addEventListener('click', async function() {
            var res = await window.apiFetch('/api/players/' + PLAYER_ID + '/avatar', { method: 'DELETE' });
            if (res.ok) onAvatarChange(null);
        });
    }
}

// ─── BARS ────────────────────────────────────────────────

function animateBars() {
    document.querySelectorAll('.animate-bar').forEach(function(el) {
        var delay = parseInt(el.dataset.delay) || 200;
        var pct = parseFloat(el.dataset.pct) || 0;
        setTimeout(function() {
            var bar = el.querySelector('[data-bar]');
            if (bar) bar.style.width = pct + '%';
        }, delay);
    });
}

// ─── BOOT ────────────────────────────────────────────────

(function() {
    var root = document.getElementById('playerRoot');
    var state = {
        player: null,
        matches: [],
        eloHistory: [],
        seasons: [],
        loadState: 'loading',
    };

    (async function() {
        var res = await fetch('/api/players/' + PLAYER_ID);
        if (!res.ok) {
            root.innerHTML = '<div class="panel p-12 text-center"><p class="mb-4 text-sm text-ink3">Player not found.</p><a href="/leaderboard" class="btn btn-pink">Back to leaderboard</a></div>';
            return;
        }
        var data = await res.json();
        state.player = data;
        var best = data.ratings.slice().sort(function(a, b) { return b.elo - a.elo; })[0];
        var rank = best ? { label: best.rank_title, color: best.rank_color } : getRank(best ? best.elo : 0);
        document.documentElement.style.setProperty('--rank-color', rank.color);

        var mr = await fetch('/api/matches?player_id=' + PLAYER_ID + '&limit=50');
        if (mr.ok) state.matches = await mr.json();

        var [histRes, seasonsRes] = await Promise.all([
            fetch('/api/players/' + PLAYER_ID + '/history?limit=200'),
            fetch('/api/players/' + PLAYER_ID + '/seasons'),
        ]);
        if (histRes.ok) state.eloHistory = await histRes.json();
        if (seasonsRes.ok) state.seasons = await seasonsRes.json();

        state.loadState = 'loaded';
        renderProfile(root, state);
        setTimeout(animateBars, 30);
    })();
})();
</script>
{% endblock %}
