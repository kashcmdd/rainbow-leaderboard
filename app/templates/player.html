{% extends "base.html" %}
{% block content %}
<div id="playerRoot">
    <div class="card p-8 animate-shimmer"><div class="h-6 bg-white/5 rounded w-48 mb-4"></div><div class="stats-grid"><div class="h-20 card"></div><div class="h-20 card"></div><div class="h-20 card"></div><div class="h-20 card"></div></div></div>
</div>

<script>
var IS_ADMIN = {% if request.session.get("user") and request.session.get("user").get("is_admin") %}true{% else %}false{% endif %};
var PLAYER_ID = '{{ player_id }}';

var RANK_MAP = [
    { label: 'Bronze I',   threshold: 0,   color: '#7A4520' },
    { label: 'Bronze II',  threshold: 100,  color: '#96541A' },
    { label: 'Bronze III', threshold: 200, color: '#B8682A' },
    { label: 'Bronze IV',  threshold: 300, color: '#CD7F32' },
    { label: 'Bronze V',   threshold: 400, color: '#E09A50' },
    { label: 'Silver I',   threshold: 500,  color: '#787878' },
    { label: 'Silver II',  threshold: 600,  color: '#909090' },
    { label: 'Silver III', threshold: 700, color: '#A8A8A8' },
    { label: 'Silver IV',  threshold: 800, color: '#C0C0C0' },
    { label: 'Silver V',   threshold: 900, color: '#D8D8D8' },
    { label: 'Gold I',     threshold: 1000, color: '#B8960C' },
    { label: 'Gold II',    threshold: 1100, color: '#CCA800' },
    { label: 'Gold III',   threshold: 1200, color: '#FFD700' },
    { label: 'Gold IV',    threshold: 1300, color: '#FFE033' },
    { label: 'Gold V',     threshold: 1400, color: '#FFEA70' },
    { label: 'Platinum I',   threshold: 1500, color: '#0088AA' },
    { label: 'Platinum II',  threshold: 1600, color: '#00AACC' },
    { label: 'Platinum III', threshold: 1700, color: '#00C8E8' },
    { label: 'Platinum IV',  threshold: 1800, color: '#00E5FF' },
    { label: 'Platinum V',   threshold: 1900, color: '#66F0FF' },
    { label: 'Emerald I',   threshold: 2000, color: '#007A30' },
    { label: 'Emerald II',  threshold: 2100, color: '#009940' },
    { label: 'Emerald III', threshold: 2200, color: '#00BB50' },
    { label: 'Emerald IV',  threshold: 2300, color: '#00E676' },
    { label: 'Emerald V',   threshold: 2400, color: '#33FF8A' },
    { label: 'Diamond I',   threshold: 2500, color: '#6600CC' },
    { label: 'Diamond II',  threshold: 2600, color: '#7B35FF' },
    { label: 'Diamond III', threshold: 2700, color: '#9955FF' },
    { label: 'Diamond IV',  threshold: 2800, color: '#B388FF' },
    { label: 'Diamond V',   threshold: 2900, color: '#CCAAFF' },
    { label: 'Champion', threshold: 3000, color: '#E8197D' },
];

function getRank(elo) {
    var rank = RANK_MAP[0];
    for (var i = 0; i < RANK_MAP.length; i++) {
        if (elo >= RANK_MAP[i].threshold) rank = RANK_MAP[i];
    }
    return rank;
}

function rankGlow(color) {
    var c = color.replace('#','');
    var r = parseInt(c.slice(0,2),16);
    var g = parseInt(c.slice(2,4),16);
    var b = parseInt(c.slice(4,6),16);
    return 'rgba(' + r + ',' + g + ',' + b + ',0.6)';
}

function isPlayerInTeam(playerName, teamName) {
    if (!teamName) return false;
    return teamName.split(' + ').some(function(n) { return n.trim() === playerName; });
}

function esc(s) {
    var d = document.createElement('div');
    d.textContent = s == null ? '' : String(s);
    return d.innerHTML;
}

function animateCounter(el, target, color, duration) {
    duration = duration || 1200;
    var start = 0, steps = 60, inc = target / steps, i = 0;
    var t = setInterval(function() {
        i++;
        var current = Math.min(Math.round(inc * i), target);
        el.textContent = current.toLocaleString();
        el.style.color = color;
        if (current >= target) { clearInterval(t); if (target > 0) el.textContent = target.toLocaleString(); }
    }, duration / steps);
}

function drawEloChart(canvas, history, rankColor) {
    if (!canvas || history.length < 2) return;
    var ctx = canvas.getContext('2d');
    var W = canvas.width, H = canvas.height;
    var pad = { top: 15, bottom: 20, left: 45, right: 15 };
    var chartW = W - pad.left - pad.right;
    var chartH = H - pad.top - pad.bottom;
    var data = history.map(function(e) { return e.elo_after; });
    var labels = history.map(function(e) { return new Date(e.timestamp).toLocaleDateString(); });
    var min = Math.min.apply(null, data);
    var max = Math.max.apply(null, data);
    var range = max - min || 1;
    var padding = range * 0.1;
    min -= padding;
    max += padding;
    function x(i) { return pad.left + (i / (data.length - 1)) * chartW; }
    function y(v) { return pad.top + chartH - ((v - min) / (max - min)) * chartH; }
    ctx.strokeStyle = 'rgba(255,255,255,0.03)'; ctx.lineWidth = 1;
    var lines = 5;
    for (var i = 0; i <= lines; i++) {
        var yPos = pad.top + (i / lines) * chartH;
        ctx.beginPath(); ctx.moveTo(pad.left, yPos); ctx.lineTo(W - pad.right, yPos); ctx.stroke();
        var val = Math.round(max - (i / lines) * (max - min));
        ctx.fillStyle = '#666'; ctx.font = '10px Inter, sans-serif'; ctx.textAlign = 'right';
        ctx.fillText(val, pad.left - 8, yPos + 3);
    }
    ctx.fillStyle = '#666'; ctx.font = '10px Inter, sans-serif'; ctx.textAlign = 'center';
    var labelStep = Math.max(1, Math.floor(labels.length / 8));
    for (var i = 0; i < labels.length; i += labelStep) ctx.fillText(labels[i], x(i), H - 4);
    var gradient = ctx.createLinearGradient(0, pad.top, 0, pad.top + chartH);
    gradient.addColorStop(0, rankColor + '33'); gradient.addColorStop(1, rankColor + '00');
    ctx.beginPath(); ctx.moveTo(x(0), pad.top + chartH);
    for (var i = 0; i < data.length; i++) ctx.lineTo(x(i), y(data[i]));
    ctx.lineTo(x(data.length - 1), pad.top + chartH); ctx.closePath();
    ctx.fillStyle = gradient; ctx.fill();
    ctx.beginPath();
    for (var i = 0; i < data.length; i++) { if (i === 0) ctx.moveTo(x(i), y(data[i])); else ctx.lineTo(x(i), y(data[i])); }
    ctx.strokeStyle = rankColor; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.stroke();
    for (var i = 0; i < data.length; i++) { ctx.beginPath(); ctx.arc(x(i), y(data[i]), 2, 0, Math.PI * 2); ctx.fillStyle = rankColor; ctx.fill(); }
}

function renderProfile(root, state) {
    var p = state.player;
    if (!p) return;
    var best = p.ratings.slice().sort(function(a, b) { return b.elo - a.elo; })[0];
    var rank = best ? { label: best.rank_title, color: best.rank_color } : RANK_MAP[0];
    var totWins = 0, totLosses = 0;
    for (var i = 0; i < p.ratings.length; i++) { totWins += p.ratings[i].wins; totLosses += p.ratings[i].losses; }
    var totPlayed = totWins + totLosses;
    var wr = totPlayed > 0 ? (totWins / totPlayed) * 100 : 0;
    var initial = p.username.charAt(0).toUpperCase();
    var rankFilename = rank.label.toLowerCase().replace(/ /g, '_') + '.svg';

    var sparkData = [];
    if (state.matches.length > 0) {
        var reversed = state.matches.slice().reverse();
        var elo2 = best ? best.elo : 0;
        var hist = [];
        for (var i = 0; i < reversed.length; i++) {
            var m = reversed[i];
            var isW = isPlayerInTeam(p.username, m.winner_name);
            var isA = isPlayerInTeam(p.username, m.team_a_name);
            var d = isA ? (m.elo_delta_a || 0) : (m.elo_delta_b || 0);
            hist.push(elo2);
            elo2 += isW ? -d : d;
        }
        hist.reverse();
        sparkData = hist.slice(-20);
    }

    var html =
        '<div class="profile-header animate-slide-up opacity-0 stagger-1">' +
            '<div class="profile-avatar-wrap">' +
                '<div class="profile-avatar-ring" style="--ring-color-a:' + rank.color + '60;--ring-color-b:' + rank.color + '20"></div>' +
                '<div class="profile-avatar" style="background:linear-gradient(135deg,' + rank.color + '25,#141416)">' +
                    '<span class="profile-rank-icon">' +
                        '<img src="/static/rank-icons/' + rankFilename + '" alt="' + esc(rank.label) + '" style="width:56px;height:68px;filter:drop-shadow(0 0 8px ' + rank.color + '60)">' +
                    '</span>' +
                '</div>' +
            '</div>' +
            '<div class="flex-1">' +
                '<h1 class="text-3xl font-extrabold text-white mb-1">' + esc(p.username) + '</h1>' +
                '<div class="flex flex-wrap items-center justify-center md:justify-start gap-2">' +
                    '<span class="badge badge-pink inline-flex items-center gap-2" style="background:' + rank.color + '15;color:' + rank.color + ';border:1px solid ' + rank.color + '30">' +
                        '<span class="w-3 h-3 rounded-full" style="background:' + rank.color + '"></span>' +
                        esc(rank.label) +
                    '</span>' +
                    '<span class="text-xs text-gray-600">·</span>' +
                    '<span class="text-xs text-gray-600">' + totPlayed.toLocaleString() + ' matches</span>' +
                    '<span class="text-xs text-gray-600">·</span>' +
                    '<span class="text-xs" style="color:#00e676">' + wr.toFixed(0) + '% WR</span>' +
                '</div>' +
            '</div>' +
            '<div class="flex flex-col items-center gap-1">' +
                '<div class="podium-elo" style="color:' + rank.color + ';font-size:42px;" id="eloCounter">0</div>' +
                '<span class="text-[10px] text-gray-600 font-semibold uppercase tracking-widest">ELO Rating</span>' +
            '</div>' +
        '</div>' +

        '<div class="stats-grid mb-6">' +
            '<div class="stat-card text-center animate-slide-up opacity-0 stagger-2" style="--stat-color:#00e676;">' +
                '<div class="stat-value" style="color:#00e676" id="statWins">0</div>' +
                '<div class="stat-label">Wins</div>' +
            '</div>' +
            '<div class="stat-card text-center animate-slide-up opacity-0 stagger-2" style="--stat-color:#ef4444;">' +
                '<div class="stat-value" style="color:#ef4444" id="statLosses">0</div>' +
                '<div class="stat-label">Losses</div>' +
            '</div>' +
            '<div class="stat-card text-center animate-slide-up opacity-0 stagger-2" style="--stat-color:' + rank.color + ';">' +
                '<div class="stat-value" style="color:' + rank.color + '" id="statWR">0%</div>' +
                '<div class="stat-label">Win Rate</div>' +
            '</div>' +
            '<div class="stat-card text-center animate-slide-up opacity-0 stagger-2" style="--stat-color:#ffd700;">' +
                '<div class="stat-value" style="color:#ffd700" id="statStreak">0</div>' +
                '<div class="stat-label">Streak</div>' +
            '</div>' +
        '</div>' +

        (state.eloHistory.length >= 2 ? '<div class="card p-5 mb-6 animate-slide-up opacity-0 stagger-3"><h3 class="section-title">ELO Trend</h3><canvas id="eloChart" height="220" style="width:100%;height:220px"></canvas></div>' : '') +

        (state.seasons.length > 0 ? renderSeasons(state.seasons) : '') +

        '<div class="animate-slide-up opacity-0 stagger-5">' +
            '<div class="flex items-center justify-between mb-4">' +
                '<h2 class="text-sm font-bold text-white">Recent Matches</h2>' +
                '<div class="tabs">' +
                    '<select id="formatFilter" class="tab" style="border-radius:999px;padding:4px 12px;font-size:11px;">' +
                        '<option value="">All</option>' +
                        '<option value="1v1">1v1</option>' +
                        '<option value="2v2">2v2</option>' +
                        '<option value="3v3">3v3</option>' +
                        '<option value="4v4">4v4</option>' +
                        '<option value="5v5">5v5</option>' +
                    '</select>' +
                    '<input type="date" id="dateFrom" class="tab" style="border-radius:999px;padding:4px 12px;font-size:11px;color-scheme:dark">' +
                    '<input type="date" id="dateTo" class="tab" style="border-radius:999px;padding:4px 12px;font-size:11px;color-scheme:dark">' +
                    '<span class="flex items-center gap-1 text-xs text-gray-600"><span class="badge-green" style="padding:2px 6px;">Win</span></span>' +
                    '<span class="flex items-center gap-1 text-xs text-gray-600"><span class="badge-red" style="padding:2px 6px;">Loss</span></span>' +
                '</div>' +
            '</div>' +
            '<div id="matchHistoryContainer" class="space-y-2.5">' +
                (state.matches.length === 0
                    ? '<div class="card p-8 text-center"><div class="text-sm text-gray-500">No matches yet.</div></div>'
                    : state.matches.slice(0, 15).map(function(m, i) { return renderMatchCard(m, p.username, i); }).join('')) +
            '</div>' +
        '</div>' +

        '<div class="mt-10 text-center animate-slide-up opacity-0 stagger-6">' +
            '<div class="footer-line h-px max-w-xs mx-auto mb-4"></div>' +
            '<p class="text-xs text-gray-600 font-semibold uppercase tracking-widest">Powered by <span class="font-extrabold" style="color:#e8197d">clukzers</span><span class="text-white font-extrabold">LB</span></p>' +
            (IS_ADMIN ? '<a href="/player/' + PLAYER_ID + '/edit" class="btn text-xs mt-3 inline-block">Edit Player</a>' : '') +
        '</div>';

    root.innerHTML = html;

    // Animate stat counters
    setTimeout(function() {
        var el = document.getElementById('eloCounter');
        if (el) animateCounter(el, best ? best.elo : 0, rank.color, 1200);
        var w = document.getElementById('statWins');
        if (w) animateCounter(w, totWins, '#00e676', 800);
        var l = document.getElementById('statLosses');
        if (l) animateCounter(l, totLosses, '#ef4444', 800);
        var wrEl = document.getElementById('statWR');
        if (wrEl) { wrEl.textContent = wr.toFixed(0) + '%'; }
        var sEl = document.getElementById('statStreak');
        if (sEl) sEl.textContent = (best && best.streak) ? (best.streak > 0 ? '+' + best.streak : best.streak) : '0';
    }, 100);

    // Draw ELO chart
    if (state.eloHistory.length >= 2) {
        var cvs = document.getElementById('eloChart');
        if (cvs) { cvs.width = cvs.parentElement.offsetWidth || 600; cvs.height = 220; drawEloChart(cvs, state.eloHistory, rank.color); }
    }

    // Wire filter changes
    var fmt = document.getElementById('formatFilter');
    var df = document.getElementById('dateFrom');
    var dt = document.getElementById('dateTo');
    if (fmt) {
        var handler = async function() {
            var f = document.getElementById('formatFilter').value;
            var d1 = document.getElementById('dateFrom').value;
            var d2 = document.getElementById('dateTo').value;
            var url = '/api/matches?player_id=' + PLAYER_ID + '&limit=50';
            if (f) url += '&format=' + f;
            if (d1) url += '&date_from=' + d1;
            if (d2) url += '&date_to=' + d2;
            var mr = await fetch(url);
            if (mr.ok) {
                state.matches = await mr.json();
                var container = document.getElementById('matchHistoryContainer');
                if (container && state.player) {
                    container.innerHTML = state.matches.length === 0
                        ? '<div class="card p-8 text-center"><div class="text-sm text-gray-500">No matches yet.</div></div>'
                        : state.matches.slice(0, 15).map(function(m, i) { return renderMatchCard(m, state.player.username, i); }).join('');
                }
            }
        };
        fmt.addEventListener('change', handler);
        df.addEventListener('change', handler);
        dt.addEventListener('change', handler);
    }
}

function renderMatchCard(match, playerName, index) {
    var isWin = isPlayerInTeam(playerName, match.winner_name);
    var isA = isPlayerInTeam(playerName, match.team_a_name);
    var opponent = isA ? match.team_b_name : match.team_a_name;
    var delta = isWin ? (isA ? (match.elo_delta_a || 0) : (match.elo_delta_b || 0)) : (isA ? (match.elo_delta_b || 0) : (match.elo_delta_a || 0));
    var dateStr = new Date(match.played_at).toLocaleDateString();
    return '<div class="match-card ' + (isWin ? 'match-card-win' : 'match-card-loss') + ' animate-slide-up opacity-0" style="animation-delay:' + (0.08 * (index + 1)) + 's">' +
        '<div class="flex items-center justify-between gap-4" style="position:relative;z-index:1;">' +
            '<div class="flex items-center gap-3 min-w-0">' +
                '<div class="w-9 h-9 rounded-full flex items-center justify-center text-xs font-extrabold shrink-0" style="background:' + (isWin ? 'rgba(0,230,118,0.15)' : 'rgba(239,68,68,0.15)') + ';color:' + (isWin ? '#00e676' : '#ef4444') + '">' + esc(opponent.charAt(0)) + '</div>' +
                '<div class="min-w-0">' +
                    '<div class="text-sm font-bold text-white truncate">' + esc(opponent) + '</div>' +
                    '<div class="flex items-center gap-2 mt-0.5">' +
                        '<span class="text-[10px] font-semibold uppercase tracking-wider text-gray-600">' + esc(match.format) + '</span>' +
                        '<span class="text-[10px] text-gray-700">·</span>' +
                        '<span class="text-[10px] text-gray-600">' + dateStr + '</span>' +
                    '</div>' +
                '</div>' +
            '</div>' +
            '<div class="flex items-center gap-3 shrink-0">' +
                '<span class="text-sm font-extrabold text-white">' + match.score_a + '–' + match.score_b + '</span>' +
                '<span class="badge ' + (isWin ? 'badge-green' : 'badge-red') + '">' + (isWin ? '+' : '') + delta + '</span>' +
            '</div>' +
        '</div>' +
    '</div>';
}

function renderSeasons(seasons) {
    var html = '<div class="mb-6 animate-slide-up opacity-0 stagger-4"><div class="flex items-center justify-between mb-4"><h2 class="text-sm font-bold text-white">Season History</h2></div><div class="stats-grid">';
    for (var i = 0; i < seasons.length; i++) {
        var s = seasons[i];
        html += '<div class="stat-card animate-slide-up opacity-0" style="--stat-color:' + s.rank_color + ';animation-delay:' + (0.05 * i) + 's">' +
            '<div class="flex items-center justify-between mb-2"><span class="text-xs font-bold text-white">' + esc(s.season_name) + '</span><span class="text-[10px] text-gray-600">#' + (s.position || '') + '</span></div>' +
            '<div class="flex items-center gap-2 mb-2"><span class="w-2.5 h-2.5 rounded-full" style="background:' + s.rank_color + '"></span><span class="text-xs font-bold" style="color:' + s.rank_color + '">' + esc(s.rank_title) + '</span><span class="text-xs text-gray-600 ml-auto">ELO ' + s.elo + '</span></div>' +
            '<div class="w-full bg-white/5 rounded-full h-1.5"><div class="h-full rounded-full" style="width:' + Math.min(s.win_rate * 100, 100) + '%;background:' + s.rank_color + '"></div></div>' +
        '</div>';
    }
    html += '</div></div>';
    return html;
}

async function loadData() {
    var root = document.getElementById('playerRoot');
    try {
        var [pd, matchesRes, seasonsRes, eloHist] = await Promise.all([
            fetch('/api/players/' + PLAYER_ID).then(r => r.json()),
            fetch('/api/matches?player_id=' + PLAYER_ID + '&limit=50').then(r => r.json()),
            fetch('/api/players/' + PLAYER_ID + '/seasons').then(r => r.json()).catch(() => []),
            fetch('/api/players/' + PLAYER_ID + '/elo-history').then(r => r.json()).catch(() => []),
        ]);
        renderProfile(root, { player: pd, matches: matchesRes, seasons: seasonsRes, eloHistory: eloHist });
    } catch (e) {
        root.innerHTML = '<div class="card p-12 text-center"><div class="text-lg text-red-400 mb-2">Failed to load player.</div><a href="/" class="btn text-sm">Go Home</a></div>';
    }
}
loadData();
</script>
{% endblock %}
