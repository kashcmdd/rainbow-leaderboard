{% extends "base.html" %}
{% block content %}
<style>
    .noise-overlay::before {
        content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
        opacity: 0.025;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        background-repeat: repeat; background-size: 256px 256px;
    }
    @keyframes pulseGlow {
        0%, 100% { box-shadow: 0 0 18px var(--glow-color), 0 0 40px var(--glow-color-transparent); }
        50% { box-shadow: 0 0 32px var(--glow-color), 0 0 70px var(--glow-color-transparent); }
    }
    @keyframes pulseRing {
        0%, 100% { box-shadow: 0 0 0 0 var(--ring-color); }
        50% { box-shadow: 0 0 0 12px var(--ring-color-transparent); }
    }
    @keyframes countPulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.06); }
        100% { transform: scale(1); }
    }
    @keyframes drawLine {
        0% { stroke-dashoffset: 300; }
        100% { stroke-dashoffset: 0; }
    }
    @keyframes statGlow {
        0%, 100% { box-shadow: 0 0 8px var(--stat-color), inset 0 0 8px var(--stat-color-transparent); }
        50% { box-shadow: 0 0 20px var(--stat-color), inset 0 0 16px var(--stat-color-transparent); }
    }
    @keyframes shimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
    }
    @keyframes spinRing {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
    .animate-pulse-glow { animation: pulseGlow 2.5s ease-in-out infinite; }
    .animate-pulse-ring { animation: pulseRing 2s ease-in-out infinite; }
    .animate-count-pulse { animation: countPulse 0.4s ease-out; }
    .animate-draw-line { animation: drawLine 1.5s ease-out forwards; }
    .animate-stat-glow { animation: statGlow 3s ease-in-out infinite; }
    .sparkline-dot { animation: pulseDot 2s ease-in-out infinite; }
    @keyframes pulseDot { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
    .avatar-ring { background: conic-gradient(var(--ring-color-a), var(--ring-color-b), var(--ring-color-a)); animation: spinRing 3s linear infinite; }
    .card-hover { transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    .card-hover:hover { transform: translateY(-4px) scale(1.01); }
    .match-card { position: relative; overflow: hidden; }
    .match-card::before { content: ''; position: absolute; inset: 0; opacity: 0; transition: opacity 0.3s ease; border-radius: 12px; }
    .match-card:hover::before { opacity: 1; }
    .match-card-win::before { background: linear-gradient(135deg, rgba(0,230,118,0.04), transparent 60%); }
    .match-card-loss::before { background: linear-gradient(135deg, rgba(239,68,68,0.04), transparent 60%); }
    .tier-shield { filter: drop-shadow(0 0 8px var(--glow-color)); }
    .rank-gradient-bg { background: radial-gradient(ellipse 80% 60% at 50% 0%, var(--rank-color-transparent), transparent 70%); }
    .footer-line { background: linear-gradient(90deg, transparent, rgba(232,25,125,0.3), transparent); }
</style>

<div id="playerRoot">
    <div class="card p-8 animate-pulse"><div class="h-6 bg-white/5 rounded w-48 mb-4"></div><div class="grid grid-cols-2 md:grid-cols-4 gap-3"><div class="h-20 bg-white/5 rounded-lg"></div><div class="h-20 bg-white/5 rounded-lg"></div><div class="h-20 bg-white/5 rounded-lg"></div><div class="h-20 bg-white/5 rounded-lg"></div></div></div>
</div>

<script>
var IS_ADMIN = {% if request.session.get("user") and request.session.get("user").get("is_admin") %}true{% else %}false{% endif %};
var PLAYER_ID = '{{ player_id }}';

var RANK_MAP = [
    { label: 'Bronze I',   threshold: 0,   color: '#7A4520' },
    { label: 'Bronze II',  threshold: 100,  color: '#96541A' },
    { label: 'Bronze III', threshold: 200, color: '#B8682A' },
    { label: 'Bronze IV',  threshold: 300, color: '#CD7F32' },
    { label: 'Bronze V',   threshold: 400, color: '#E09A50' },
    { label: 'Silver I',   threshold: 500,  color: '#787878' },
    { label: 'Silver II',  threshold: 600,  color: '#909090' },
    { label: 'Silver III', threshold: 700, color: '#A8A8A8' },
    { label: 'Silver IV',  threshold: 800, color: '#C0C0C0' },
    { label: 'Silver V',   threshold: 900, color: '#D8D8D8' },
    { label: 'Gold I',     threshold: 1000, color: '#B8960C' },
    { label: 'Gold II',    threshold: 1100, color: '#CCA800' },
    { label: 'Gold III',   threshold: 1200, color: '#FFD700' },
    { label: 'Gold IV',    threshold: 1300, color: '#FFE033' },
    { label: 'Gold V',     threshold: 1400, color: '#FFEA70' },
    { label: 'Platinum I',   threshold: 1500, color: '#0088AA' },
    { label: 'Platinum II',  threshold: 1600, color: '#00AACC' },
    { label: 'Platinum III', threshold: 1700, color: '#00C8E8' },
    { label: 'Platinum IV',  threshold: 1800, color: '#00E5FF' },
    { label: 'Platinum V',   threshold: 1900, color: '#66F0FF' },
    { label: 'Emerald I',   threshold: 2000, color: '#007A30' },
    { label: 'Emerald II',  threshold: 2100, color: '#009940' },
    { label: 'Emerald III', threshold: 2200, color: '#00BB50' },
    { label: 'Emerald IV',  threshold: 2300, color: '#00E676' },
    { label: 'Emerald V',   threshold: 2400, color: '#33FF8A' },
    { label: 'Diamond I',   threshold: 2500, color: '#6600CC' },
    { label: 'Diamond II',  threshold: 2600, color: '#7B35FF' },
    { label: 'Diamond III', threshold: 2700, color: '#9955FF' },
    { label: 'Diamond IV',  threshold: 2800, color: '#B388FF' },
    { label: 'Diamond V',   threshold: 2900, color: '#CCAAFF' },
    { label: 'Champion', threshold: 3000, color: '#E8197D' },
];

function getRank(elo) {
    var rank = RANK_MAP[0];
    for (var i = 0; i < RANK_MAP.length; i++) {
        if (elo >= RANK_MAP[i].threshold) rank = RANK_MAP[i];
    }
    return rank;
}

function rankGlow(color) {
    var c = color.replace('#','');
    var r = parseInt(c.slice(0,2),16);
    var g = parseInt(c.slice(2,4),16);
    var b = parseInt(c.slice(4,6),16);
    return 'rgba(' + r + ',' + g + ',' + b + ',0.6)';
}

function isPlayerInTeam(playerName, teamName) {
    if (!teamName) return false;
    return teamName.split(' + ').some(function(n) { return n.trim() === playerName; });
}

function esc(s) {
    var d = document.createElement('div');
    d.textContent = s == null ? '' : String(s);
    return d.innerHTML;
}

// ─── ELASPED COUNTER ANIMATION ───────────────────────────

function animateCounter(el, target, color, duration) {
    duration = duration || 1200;
    var start = 0, steps = 60, inc = target / steps, i = 0;
    var interval = duration / steps;
    function tick() {
        i++;
        var current = Math.min(Math.round(inc * i), target);
        el.textContent = current.toLocaleString();
        el.style.color = color;
        if (i % 10 === 0) { el.classList.add('animate-count-pulse'); setTimeout(function() { el.classList.remove('animate-count-pulse'); }, 400); }
        if (current >= target) { clearInterval(t); if (target > 0) el.textContent = target.toLocaleString(); }
    }
    var t = setInterval(tick, interval);
}

function animateWinRate(el, target, color) {
    var r = 50, circ = 2 * Math.PI * r;
    var circle = el.querySelector('.wr-circle-fill');
    var text = el.querySelector('.wr-text');
    if (!circle) return;
    setTimeout(function() {
        circle.style.strokeDashoffset = circ * (1 - target / 100);
    }, 400);
}

// ─── DRAW ELO CHART ──────────────────────────────────────

function drawEloChart(canvas, history, rankColor) {
    if (!canvas || history.length < 2) return;
    var ctx = canvas.getContext('2d');
    var W = canvas.width, H = canvas.height;
    var pad = { top: 15, bottom: 20, left: 45, right: 15 };
    var chartW = W - pad.left - pad.right;
    var chartH = H - pad.top - pad.bottom;

    var data = history.map(function(e) { return e.elo_after; });
    var labels = history.map(function(e) { return new Date(e.timestamp).toLocaleDateString(); });
    var min = Math.min.apply(null, data);
    var max = Math.max.apply(null, data);
    var range = max - min || 1;
    var padding = range * 0.1;
    min -= padding;
    max += padding;

    function x(i) { return pad.left + (i / (data.length - 1)) * chartW; }
    function y(v) { return pad.top + chartH - ((v - min) / (max - min)) * chartH; }

    // Grid lines
    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    ctx.lineWidth = 1;
    var lines = 5;
    for (var i = 0; i <= lines; i++) {
        var yPos = pad.top + (i / lines) * chartH;
        ctx.beginPath();
        ctx.moveTo(pad.left, yPos);
        ctx.lineTo(W - pad.right, yPos);
        ctx.stroke();
        var val = Math.round(max - (i / lines) * (max - min));
        ctx.fillStyle = '#666';
        ctx.font = '10px Inter, sans-serif';
        ctx.textAlign = 'right';
        ctx.fillText(val, pad.left - 8, yPos + 3);
    }

    // X labels
    ctx.fillStyle = '#666';
    ctx.font = '10px Inter, sans-serif';
    ctx.textAlign = 'center';
    var labelStep = Math.max(1, Math.floor(labels.length / 8));
    for (var i = 0; i < labels.length; i += labelStep) {
        ctx.fillText(labels[i], x(i), H - 4);
    }

    // Gradient fill
    var gradient = ctx.createLinearGradient(0, pad.top, 0, pad.top + chartH);
    gradient.addColorStop(0, rankColor + '33');
    gradient.addColorStop(1, rankColor + '00');
    ctx.beginPath();
    ctx.moveTo(x(0), pad.top + chartH);
    for (var i = 0; i < data.length; i++) {
        ctx.lineTo(x(i), y(data[i]));
    }
    ctx.lineTo(x(data.length - 1), pad.top + chartH);
    ctx.closePath();
    ctx.fillStyle = gradient;
    ctx.fill();

    // Line
    ctx.beginPath();
    for (var i = 0; i < data.length; i++) {
        if (i === 0) ctx.moveTo(x(i), y(data[i]));
        else ctx.lineTo(x(i), y(data[i]));
    }
    ctx.strokeStyle = rankColor;
    ctx.lineWidth = 2;
    ctx.lineJoin = 'round';
    ctx.stroke();

    // Points
    for (var i = 0; i < data.length; i++) {
        ctx.beginPath();
        ctx.arc(x(i), y(data[i]), 2, 0, Math.PI * 2);
        ctx.fillStyle = rankColor;
        ctx.fill();
    }
}

// ─── BUILD PROFILE HTML ──────────────────────────────────

function renderProfile(root, state) {
    var p = state.player;
    if (!p) { return; }

    var best = p.ratings.slice().sort(function(a, b) { return b.elo - a.elo; })[0];
    var rank = best ? { label: best.rank_title, color: best.rank_color } : RANK_MAP[0];
    var totWins = 0, totLosses = 0;
    for (var i = 0; i < p.ratings.length; i++) { totWins += p.ratings[i].wins; totLosses += p.ratings[i].losses; }
    var totPlayed = totWins + totLosses;
    var wr = totPlayed > 0 ? (totWins / totPlayed) * 100 : 0;
    var rankColorStyle = '--rank-color:' + rank.color + ';--rank-color-transparent:' + rank.color + '25';

    // Sparkline data
    var sparkData = [];
    if (state.matches.length > 0) {
        var reversed = state.matches.slice().reverse();
        var elo2 = best ? best.elo : 0;
        var hist = [];
        for (var i = 0; i < reversed.length; i++) {
            var m = reversed[i];
            var isW = isPlayerInTeam(p.username, m.winner_name);
            var isA = isPlayerInTeam(p.username, m.team_a_name);
            var d = isA ? (m.elo_delta_a || 0) : (m.elo_delta_b || 0);
            hist.push(elo2);
            elo2 += isW ? -d : d;
        }
        hist.reverse();
        sparkData = hist.slice(-20);
    }

    var initial = p.username.charAt(0).toUpperCase();
    var rankFilename = rank.label.toLowerCase().replace(/ /g, '_') + '.svg';

    var html = '<div class="relative" style="background:#0d0d0f">' +
        '<div class="noise-overlay"></div>' +
        '<div class="fixed top-0 left-0 right-0 h-96 pointer-events-none z-[1] rank-gradient-bg" style="' + rankColorStyle + '"></div>' +
        '<div class="relative z-10">' +
        // HEADER
        '<div class="card p-6 sm:p-8 mb-6 animate-slide-up opacity-0 stagger-1" id="profileHeader" style="background:#141416">' +
        '<div class="flex flex-col md:flex-row items-center gap-6">' +
        renderAvatar(p, rank, initial) +
        '<div class="flex-1 text-center md:text-left">' +
        '<h1 class="text-3xl font-extrabold text-white mb-1">' + esc(p.username) + '</h1>' +
        '<div class="flex flex-wrap items-center justify-center md:justify-start gap-2">' +
        '<div class="flex items-center gap-2 px-3 py-1 rounded-full animate-pulse-glow" style="--glow-color:' + rank.color + '50;--glow-color-transparent:' + rank.color + '15;background:' + rank.color + '15;border:1px solid ' + rank.color + '30">' +
        '<div class="w-4 h-4 rounded-full" style="background:' + rank.color + '"></div>' +
        '<span class="text-xs font-extrabold uppercase tracking-wider" style="color:' + rank.color + '">' + esc(rank.label) + '</span></div>' +
        '<span class="text-xs text-gray-600">·</span>' +
        '<span class="text-xs text-gray-600">' + totPlayed.toLocaleString() + ' matches</span>' +
        '<span class="text-xs text-gray-600">·</span>' +
        '<span class="text-xs" style="color:#00e676">' + wr.toFixed(0) + '% WR</span></div></div>' +
        '<div class="flex flex-col items-center gap-1 shrink-0">' +
        '<img src="/static/rank-icons/' + rankFilename + '" alt="' + esc(rank.label) + '" class="tier-shield" style="width:52px;height:64px;filter:drop-shadow(0 0 6px ' + rank.color + '60)">' +
        '<div class="text-5xl font-extrabold tracking-tight" id="eloCounter" style="color:' + rank.color + '">0</div>' +
        '<span class="text-[10px] text-gray-600 font-semibold uppercase tracking-widest">ELO Rating</span></div></div></div>' +

        // STATS
        '<div class="grid grid-cols-1 lg:grid-cols-12 gap-4 mb-6">' +
        '<div class="lg:col-span-4 card p-5 animate-slide-up opacity-0 stagger-2 flex flex-col items-center justify-center" style="background:#141416">' +
        '<h3 class="text-[10px] text-gray-600 font-semibold uppercase tracking-widest mb-3">Win Rate</h3>' +
        renderWinRateCircle(wr, rank.color) +
        '<div class="flex items-center gap-4 mt-4 text-xs"><span style="color:#00e676">' + totWins + 'W</span>' +
        '<span class="text-gray-700">·</span><span style="color:#ef4444">' + totLosses + 'L</span>' +
        (best && best.streak ? '<span class="font-bold" style="color:' + (best.streak > 0 ? '#00e676' : '#ef4444') + '">' + (best.streak > 0 ? '\ud83d\udd25' : '') + (best.streak > 0 ? '+' : '') + best.streak + '</span>' : '') +
        '</div></div>' +

        '<div class="lg:col-span-5 card p-5 animate-slide-up opacity-0 stagger-2 space-y-4" style="background:#141416">' +
        '<h3 class="text-[10px] text-gray-600 font-semibold uppercase tracking-widest">Performance</h3>' +
        renderBar('Wins', totWins, totPlayed, '#00e676', 400) +
        renderBar('Losses', totLosses, totPlayed, '#ef4444', 600) +
        renderBar('Win Rate', Math.round(wr), 100, rank.color, 800) +
        (sparkData.length > 1 ? renderSparkline(sparkData, rank.color) : '') +
        '</div>' +

        '<div class="lg:col-span-3 animate-slide-up opacity-0 stagger-2 grid grid-cols-2 gap-3 content-start">' +
        renderGlowCard('\u2694\ufe0f', 'Total Matches', totPlayed, '#888', 0.3) +
        renderGlowCard('\ud83d\udd25', 'Best ELO', best ? best.elo : 0, '#00e676', 0.35) +
        renderGlowCard('\ud83c\udfc6', 'Best Rank', best ? best.rank_title : '\u2014', rank.color, 0.4) +
        renderGlowCard('\ud83d\udcc8', 'Discord', p.discord_id ? 'Linked' : '\u2014', p.discord_id ? '#e8197d' : '#555', 0.45) +
        '</div></div>' +

        // ELO CHART
        (state.eloHistory.length >= 2 ? '<div class="card p-5 mb-6 animate-slide-up opacity-0 stagger-3" style="background:#141416"><h3 class="text-[10px] text-gray-600 font-semibold uppercase tracking-widest mb-4">ELO Trend</h3><canvas id="eloChart" height="220" style="width:100%;height:220px"></canvas></div>' : '') +

        // SEASON HISTORY
        (state.seasons.length > 0 ? renderSeasons(state.seasons) : '') +

        // MATCH HISTORY
        '<div class="animate-slide-up opacity-0 stagger-5">' +
        '<div class="flex items-center justify-between mb-4"><h2 class="text-sm font-bold text-white uppercase tracking-widest">Recent Matches</h2>' +
        '<div class="flex items-center gap-2 text-xs">' +
        '<select id="formatFilter" class="bg-transparent border border-white/10 rounded-lg px-2 py-1 text-xs text-white">' +
        '<option value="">All</option>' +
        '<option value="1v1">1v1</option>' +
        '<option value="2v2">2v2</option>' +
        '<option value="3v3">3v3</option>' +
        '<option value="4v4">4v4</option>' +
        '<option value="5v5">5v5</option>' +
        '</select>' +
        '<input type="date" id="dateFrom" class="bg-transparent border border-white/10 rounded-lg px-2 py-1 text-xs text-white" style="color-scheme:dark">' +
        '<input type="date" id="dateTo" class="bg-transparent border border-white/10 rounded-lg px-2 py-1 text-xs text-white" style="color-scheme:dark">' +
        '<span class="flex items-center gap-1 text-gray-600"><span class="w-2 h-2 rounded-full" style="background:#00e676"></span>Win</span>' +
        '<span class="flex items-center gap-1 text-gray-600"><span class="w-2 h-2 rounded-full" style="background:#ef4444"></span>Loss</span></div></div>' +
        '<div id="matchHistoryContainer" class="space-y-2.5">' +
        (state.matches.length === 0
            ? '<div class="card p-8 text-center"><div class="text-sm text-gray-500">No matches yet.</div></div>'
            : state.matches.slice(0, 15).map(function(m, i) { return renderMatchCard(m, p.username, i); }).join('')) +
        '</div></div>' +

        // FOOTER
        '<div class="mt-10 text-center animate-slide-up opacity-0 stagger-6">' +
        '<div class="footer-line h-px max-w-xs mx-auto mb-4"></div>' +
        '<p class="text-xs text-gray-600 font-semibold uppercase tracking-widest">Powered by <span class="font-extrabold" style="color:#e8197d">clukzers</span><span class="text-white font-extrabold">LB</span></p>' +
        (IS_ADMIN ? '<a href="/player/' + PLAYER_ID + '/edit" class="btn text-xs mt-3 inline-block">Edit Player</a>' : '') +
        '</div></div></div>';

    root.innerHTML = html;

    // Start counter animation after render
    setTimeout(function() {
        var el = document.getElementById('eloCounter');
        if (el) animateCounter(el, best ? best.elo : 0, rank.color, 1200);
    }, 100);
    setTimeout(function() {
        animateWinRate(document.querySelector('.wr-container'), wr, rank.color);
    }, 200);

    // Draw ELO chart
    if (state.eloHistory.length >= 2) {
        var cvs = document.getElementById('eloChart');
        if (cvs) {
            cvs.width = cvs.parentElement.offsetWidth || 600;
            cvs.height = 220;
            drawEloChart(cvs, state.eloHistory, rank.color);
        }
    }

    wireAvatarPicker(root, state, rank, initial);

    // Wire match filter changes
    var fmt = document.getElementById('formatFilter');
    var df = document.getElementById('dateFrom');
    var dt = document.getElementById('dateTo');
    if (fmt) {
        var handler = async function() {
            var fmt = document.getElementById('formatFilter').value;
            var df = document.getElementById('dateFrom').value;
            var dt = document.getElementById('dateTo').value;
            var url = '/api/matches?player_id=' + PLAYER_ID + '&limit=50';
            if (fmt) url += '&format=' + fmt;
            if (df) url += '&date_from=' + df;
            if (dt) url += '&date_to=' + dt;
            var mr = await fetch(url);
            if (mr.ok) {
                state.matches = await mr.json();
                var container = document.getElementById('matchHistoryContainer');
                if (container && state.player) {
                    container.innerHTML = state.matches.length === 0
                        ? '<div class="card p-8 text-center"><div class="text-sm text-gray-500">No matches yet.</div></div>'
                        : state.matches.slice(0, 15).map(function(m, i) { return renderMatchCard(m, state.player.username, i); }).join('');
                }
            }
        };
        fmt.addEventListener('change', handler);
        df.addEventListener('change', handler);
        dt.addEventListener('change', handler);
    }
}

function renderAvatar(p, rank, initial) {
    var showSvg = !p.avatar_url;
    var avatarHtml;
    if (showSvg) {
        avatarHtml = renderSvgHelmet(rank.color, initial);
    } else {
        avatarHtml = '<img src="' + esc(p.avatar_url) + '" alt="' + esc(p.username) + '" class="absolute inset-0 w-full h-full object-cover z-10" id="profileAvatarImg">';
    }
    return '<div class="relative shrink-0 group" id="avatarWrap">' +
        '<div class="absolute -inset-1 rounded-full avatar-ring z-0" style="--ring-color-a:' + rank.color + '60;--ring-color-b:' + rank.color + '20"></div>' +
        '<div class="relative z-10 w-24 h-24 rounded-full flex items-center justify-center overflow-hidden" style="background:linear-gradient(135deg,' + rank.color + '25,#141416)">' +
        '<div id="avatarContent" class="w-full h-full flex items-center justify-center">' + avatarHtml + '</div></div>' +
        '<button id="avatarPickerBtn" class="absolute -bottom-1 -right-1 z-20 w-8 h-8 rounded-full flex items-center justify-center text-xs opacity-0 group-hover:opacity-100 transition-opacity" style="background:#e8197d;color:#fff;box-shadow:0 0 8px rgba(232,25,125,0.5)">' +
        '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>' +
        '<div id="avatarPicker" class="hidden absolute top-0 left-full ml-3 z-30 rounded-xl p-3 flex flex-col gap-3 min-w-[200px]" style="background:#1c1c1f;border:1px solid rgba(255,255,255,0.08);box-shadow:0 8px 32px rgba(0,0,0,0.6)">' +
        '<input id="avatarFileInput" type="file" accept="image/*" class="hidden">' +
        '<button id="avatarUploadBtn" class="w-full text-xs font-bold py-2 px-3 rounded-lg text-left transition-all" style="background:rgba(232,25,125,0.15);color:#e8197d">Upload image</button>' +
        '<button id="avatarUrlBtn" class="w-full text-xs font-bold py-2 px-3 rounded-lg text-left transition-all" style="background:rgba(255,255,255,0.05);color:#ccc">Set URL</button>' +
        (p.avatar_url ? '<button id="avatarRemoveBtn" class="w-full text-xs font-bold py-2 px-3 rounded-lg text-left transition-all" style="background:rgba(239,68,68,0.15);color:#ef4444">Remove avatar</button>' : '') +
        '</div></div>';
}

function renderSvgHelmet(fill, initial) {
    return '<svg viewBox="0 0 80 80" class="w-full h-full" style="filter:drop-shadow(0 0 6px ' + fill + '40)">' +
        '<path d="M24 42 Q24 24 40 20 Q56 24 56 42 L56 52 L24 52 Z" fill="' + fill + '18" stroke="' + fill + '" stroke-width="1.5" stroke-opacity="0.4"/>' +
        '<path d="M28 38 Q28 26 40 23 Q52 26 52 38 L52 50 L28 50 Z" fill="' + fill + '10" stroke="' + fill + '" stroke-width="1" stroke-opacity="0.3"/>' +
        '<path d="M30 35 Q30 30 40 28 Q50 30 50 35 L50 42 L30 42 Z" fill="' + fill + '30" stroke="' + fill + '" stroke-width="1"/>' +
        '<circle cx="36" cy="34" r="2" fill="' + fill + '" opacity="0.8" class="sparkline-dot"/>' +
        '<text x="40" y="66" text-anchor="middle" fill="#fff" font-size="18" font-weight="800" style="filter:drop-shadow(0 0 3px ' + fill + ')">' + initial + '</text>' +
        '<line x1="52" y1="29" x2="56" y2="27" stroke="' + fill + '" stroke-width="0.8" opacity="0.4"/>' +
        '<line x1="52" y1="29" x2="54" y2="33" stroke="' + fill + '" stroke-width="0.8" opacity="0.4"/>' +
        '</svg>';
}

function renderWinRateCircle(percentage, color) {
    var r = 50, circ = 2 * Math.PI * r;
    var val = percentage.toFixed(0) + '%';
    return '<div class="flex flex-col items-center gap-2 wr-container">' +
        '<svg width="130" height="130" viewBox="0 0 130 130">' +
        '<circle cx="65" cy="65" r="' + r + '" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="8"/>' +
        '<circle class="wr-circle-fill" cx="65" cy="65" r="' + r + '" fill="none" stroke="' + color + '" stroke-width="8" stroke-linecap="round" stroke-dasharray="' + circ + '" stroke-dashoffset="' + circ + '" style="transition:stroke-dashoffset 1.5s cubic-bezier(0.4, 0, 0.2, 1)" transform="rotate(-90 65 65)"/>' +
        '<text x="65" y="58" text-anchor="middle" fill="#fff" font-size="28" font-weight="800" class="wr-text">' + val + '</text>' +
        '<text x="65" y="80" text-anchor="middle" fill="#666" font-size="11" font-weight="600">Win Rate</text>' +
        '</svg></div>';
}

function renderBar(label, value, max, color, delay) {
    var pct = max > 0 ? Math.min((value / max) * 100, 100) : 0;
    return '<div class="space-y-1.5 animate-bar" data-delay="' + delay + '" data-pct="' + pct + '">' +
        '<div class="flex items-center justify-between text-xs">' +
        '<span class="text-gray-500 font-semibold uppercase tracking-wider">' + label + '</span>' +
        '<span class="font-bold" style="color:' + color + '">' + value + '</span></div>' +
        '<div class="h-2.5 rounded-full" style="background:rgba(255,255,255,0.05)">' +
        '<div class="h-full rounded-full transition-all duration-1000 ease-out" style="width:0%;background:' + color + ';box-shadow:0 0 12px ' + color + '40"></div></div></div>';
}

function renderSparkline(data, color) {
    var width = 280, height = 60, pt = 8, pb = 8;
    var chartH = height - pt - pb;
    var min = Math.min.apply(null, data);
    var max = Math.max.apply(null, data);
    var range = max - min || 1;
    var step = data.length > 1 ? width / (data.length - 1) : 0;
    var pts = data.map(function(v, i) { return { x: i * step, y: pt + chartH - ((v - min) / range) * chartH }; });
    if (pts.length === 0) return '';
    var linePath = pts.map(function(p, i) { return (i === 0 ? 'M' : 'L') + p.x.toFixed(1) + ' ' + p.y.toFixed(1); }).join(' ');
    var last = pts[pts.length - 1];
    var gradientId = 'sparkGrad_' + Math.random().toString(36).slice(2, 8);
    return '<div class="pt-2"><div class="flex items-center justify-between text-[10px] text-gray-600 font-semibold uppercase tracking-widest mb-2">' +
        '<span>ELO Trend</span><span style="color:' + color + '">+' + Math.round(data[data.length - 1] - data[0]) + '</span></div>' +
        '<svg width="100%" height="' + height + '" viewBox="0 0 ' + width + ' ' + height + '" preserveAspectRatio="none" class="overflow-visible">' +
        '<defs><linearGradient id="' + gradientId + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="' + color + '" stop-opacity="0.15"/><stop offset="100%" stop-color="' + color + '" stop-opacity="0"/></linearGradient></defs>' +
        '<path d="' + linePath + ' L' + last.x.toFixed(1) + ' ' + height + ' L' + pts[0].x.toFixed(1) + ' ' + height + ' Z" fill="url(#' + gradientId + ')"/>' +
        '<path d="' + linePath + '" fill="none" stroke="' + color + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="300" class="animate-draw-line"/>' +
        '<circle cx="' + last.x + '" cy="' + last.y + '" r="4" fill="' + color + '" class="sparkline-dot" style="filter:drop-shadow(0 0 6px ' + color + ')"/>' +
        '</svg></div>';
}

function renderGlowCard(icon, label, value, color, delay) {
    return '<div class="card p-4 text-center animate-slide-up opacity-0 animate-stat-glow" style="--stat-color:' + color + '40;--stat-color-transparent:' + color + '10;border:1px solid ' + color + '20;animation-delay:' + delay + 's">' +
        '<div class="text-lg mb-1">' + icon + '</div>' +
        '<div class="text-2xl font-extrabold text-white">' + esc(value) + '</div>' +
        '<div class="text-[10px] text-gray-600 font-semibold uppercase tracking-wider mt-0.5">' + label + '</div></div>';
}

function renderMatchCard(match, playerName, index) {
    var isWin = isPlayerInTeam(playerName, match.winner_name);
    var isA = isPlayerInTeam(playerName, match.team_a_name);
    var opponent = isA ? match.team_b_name : match.team_a_name;
    var delta = isWin
        ? (isA ? (match.elo_delta_a || 0) : (match.elo_delta_b || 0))
        : (isA ? (match.elo_delta_b || 0) : (match.elo_delta_a || 0));
    var borderColor = isWin ? '#00e676' : '#ef4444';
    var delay = 0.08 * (index + 1);
    var dateStr = new Date(match.played_at).toLocaleDateString();
    return '<div class="card card-hover match-card ' + (isWin ? 'match-card-win' : 'match-card-loss') + ' animate-slide-up opacity-0" style="animation-delay:' + delay + 's;border-left:3px solid ' + borderColor + ';box-shadow:inset 0 0 40px ' + (isWin ? 'rgba(0,230,118,0.08)' : 'rgba(239,68,68,0.08)') + '">' +
        '<div class="relative z-10 p-4 flex items-center justify-between gap-4">' +
        '<div class="flex items-center gap-3 min-w-0">' +
        '<div class="w-9 h-9 rounded-full flex items-center justify-center text-xs font-extrabold shrink-0" style="background:' + borderColor + '15;color:' + borderColor + '">' + esc(opponent.charAt(0)) + '</div>' +
        '<div class="min-w-0"><div class="text-sm font-bold text-white truncate">' + esc(opponent) + '</div>' +
        '<div class="flex items-center gap-2 mt-0.5"><span class="text-[10px] font-semibold uppercase tracking-wider text-gray-600">' + esc(match.format) + '</span>' +
        '<span class="text-[10px] text-gray-700">\u00b7</span>' +
        '<span class="text-[10px] text-gray-600">' + dateStr + '</span></div></div></div>' +
        '<div class="flex items-center gap-3 shrink-0">' +
        '<span class="text-sm font-extrabold ' + (isWin ? 'text-white' : 'text-gray-400') + '">' + match.score_a + '\u2013' + match.score_b + '</span>' +
        '<span class="text-xs font-extrabold px-2 py-0.5 rounded" style="background:' + (isWin ? 'rgba(0,230,118,0.2)' : 'rgba(239,68,68,0.2)') + ';color:' + borderColor + '">' + (isWin ? '+' : '') + delta + '</span>' +
        '</div></div></div>';
}

function renderSeasons(seasons) {
    var html = '<div class="mb-6 animate-slide-up opacity-0 stagger-4">' +
        '<div class="flex items-center justify-between mb-4"><h2 class="text-sm font-bold text-white uppercase tracking-widest">Season History</h2></div>' +
        '<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">';
    for (var i = 0; i < seasons.length; i++) {
        var s = seasons[i];
        var dateStr = s.season_end ? new Date(s.season_end).toLocaleDateString() : '';
        html += '<div class="card p-4 animate-slide-up opacity-0" style="background:#141416;animation-delay:' + (0.05 * i) + 's">' +
            '<div class="flex items-center justify-between mb-2"><span class="text-xs font-bold text-white">' + esc(s.season_name) + '</span><span class="text-[10px] text-gray-600 font-semibold">#' + (s.position || '') + '</span></div>' +
            '<div class="flex items-center gap-2 mb-2"><div class="w-2.5 h-2.5 rounded-full" style="background:' + s.rank_color + '"></div>' +
            '<span class="text-xs font-bold" style="color:' + s.rank_color + '">' + esc(s.rank_title) + '</span>' +
            '<span class="text-xs text-gray-600 ml-auto">ELO ' + s.elo + '</span></div>' +
            '<div class="flex items-center gap-3 text-[10px] text-gray-600 font-semibold">' +
            '<span style="color:#00e676">' + s.wins + 'W</span><span class="text-gray-700">\u00b7</span><span style="color:#ef4444">' + s.losses + 'L</span>' +
            (dateStr ? '<span class="ml-auto">' + dateStr + '</span>' : '') +
            '</div></div>';
    }
    html += '</div></div>';
    return html;
}

async function loadData() {
    var root = document.getElementById('playerRoot');
    try {
        var [pd, matchesRes, seasonsRes, eloHist] = await Promise.all([
            fetch('/api/players/' + PLAYER_ID).then(r => r.json()),
            fetch('/api/matches?player_id=' + PLAYER_ID + '&limit=50').then(r => r.json()),
            fetch('/api/players/' + PLAYER_ID + '/seasons').then(r => r.json()).catch(() => []),
            fetch('/api/players/' + PLAYER_ID + '/history').then(r => r.json()).catch(() => []),
        ]);
        renderProfile(root, { player: pd, matches: matchesRes, seasons: seasonsRes, eloHistory: eloHist });
    } catch (e) {
        root.innerHTML = '<div class="card p-12 text-center"><div class="text-lg text-red-400 mb-2">Failed to load player.</div><a href="/" class="btn text-sm">Go Home</a></div>';
    }
}

// ─── AVATAR PICKER WIRING ────────────────────────────────

function wireAvatarPicker(root, state, rank, initial) {
    var btn = document.getElementById('avatarPickerBtn');
    var picker = document.getElementById('avatarPicker');
    var fileInput = document.getElementById('avatarFileInput');
    var uploadBtn = document.getElementById('avatarUploadBtn');
    var urlBtn = document.getElementById('avatarUrlBtn');
    var removeBtn = document.getElementById('avatarRemoveBtn');

    if (btn && picker) {
        btn.addEventListener('click', function(e) {
            e.stopPropagation();
            picker.classList.toggle('hidden');
        });
        document.addEventListener('click', function(e) {
            if (!e.target.closest('#avatarWrap')) picker.classList.add('hidden');
        });
    }

    function onAvatarChange(newUrl) {
        state.player.avatar_url = newUrl;
        var content = document.getElementById('avatarContent');
        if (content) {
            if (newUrl) {
                content.innerHTML = '<img src="' + esc(newUrl) + '" alt="' + esc(state.player.username) + '" class="absolute inset-0 w-full h-full object-cover z-10">';
            } else {
                content.innerHTML = renderSvgHelmet(rank.color, initial);
            }
        }
        picker.classList.add('hidden');
    }

    if (fileInput) {
        fileInput.addEventListener('change', async function(e) {
            var f = e.target.files[0];
            if (!f) return;
            var form = new FormData();
            form.append('file', f);
            var res = await window.apiFetch('/api/players/' + PLAYER_ID + '/avatar', { method: 'POST', body: form });
            if (res.ok) { var d = await res.json(); onAvatarChange(d.avatar_url); }
        });
    }

    if (uploadBtn) {
        uploadBtn.addEventListener('click', function() { fileInput.click(); });
    }

    if (urlBtn) {
        urlBtn.addEventListener('click', async function() {
            var url = prompt('Enter image URL:');
            if (!url) return;
            var res = await window.apiFetch('/api/players/' + PLAYER_ID + '/avatar', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({url: url}) });
            if (res.ok) { var d = await res.json(); onAvatarChange(d.avatar_url); }
        });
    }

    if (removeBtn) {
        removeBtn.addEventListener('click', async function() {
            var res = await window.apiFetch('/api/players/' + PLAYER_ID + '/avatar', { method: 'DELETE' });
            if (res.ok) onAvatarChange(null);
        });
    }
}

// ─── ANIMATE BARS ON LOAD ────────────────────────────────

function animateBars() {
    var bars = document.querySelectorAll('.animate-bar');
    bars.forEach(function(el) {
        var delay = parseInt(el.dataset.delay) || 200;
        var pct = parseFloat(el.dataset.pct) || 0;
        setTimeout(function() {
            var bar = el.querySelector('.h-full');
            if (bar) bar.style.width = pct + '%';
        }, delay);
    });
}

// ─── LOAD DATA AND RENDER ────────────────────────────────

(function() {
    var root = document.getElementById('playerRoot');
    var state = {
        player: null,
        matches: [],
        eloHistory: [],
        seasons: [],
        loadState: 'loading',
    };

    (async function() {
        var res = await fetch('/api/players/' + PLAYER_ID);
        if (!res.ok) {
            root.innerHTML = '<div class="card p-12 text-center"><p class="text-sm text-gray-500">Player not found.</p><a href="/leaderboard" class="btn btn-pink mt-4 inline-block text-sm">Back</a></div>';
            return;
        }
        var data = await res.json();
        state.player = data;
        var best = data.ratings.slice().sort(function(a, b) { return b.elo - a.elo; })[0];
        var rank = best ? { label: best.rank_title, color: best.rank_color } : getRank(best ? best.elo : 0);
        document.documentElement.style.setProperty('--rank-color', rank.color);
        document.documentElement.style.setProperty('--rank-color-transparent', rank.color + '30');

        var mr = await fetch('/api/matches?player_id=' + PLAYER_ID + '&limit=50');
        if (mr.ok) state.matches = await mr.json();

        var [histRes, seasonsRes] = await Promise.all([
            fetch('/api/players/' + PLAYER_ID + '/history?limit=200'),
            fetch('/api/players/' + PLAYER_ID + '/seasons'),
        ]);
        if (histRes.ok) state.eloHistory = await histRes.json();
        if (seasonsRes.ok) state.seasons = await seasonsRes.json();

        state.loadState = 'loaded';
        renderProfile(root, state);
        setTimeout(animateBars, 50);
    })();
})();
</script>
{% endblock %}
