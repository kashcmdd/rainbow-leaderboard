{% extends "base.html" %}
{% block content %}
<div class="flex items-center justify-between mb-6">
    <h1 class="text-2xl font-bold text-amber-400">Players</h1>
    <a href="/players/new" class="bg-amber-500 hover:bg-amber-600 text-black font-bold px-5 py-2.5 rounded-lg text-sm transition">+ New Player</a>
</div>

<div id="playerList">
    <div class="text-center py-8 text-gray-500">Loading...</div>
</div>

<script>
async function loadPlayers() {
    const res = await fetch('/api/players');
    const data = await res.json();
    const container = document.getElementById('playerList');
    if (data.length === 0) {
        container.innerHTML = '<div class="text-center py-8 text-gray-500">No players yet. <a href="/players/new" class="text-amber-400 underline">Create one!</a></div>';
        return;
    }
    let html = '<div class="grid grid-cols-2 md:grid-cols-4 gap-4">';
    for (const p of data) {
        html += `<a href="/player/${p.id}" class="bg-gray-900 hover:bg-gray-800 border border-gray-800 rounded-lg p-4 transition">
            <div class="font-bold">${p.username}</div>
            <div class="text-sm text-gray-500">${p.id.slice(0, 8)}...</div>
        </a>`;
    }
    html += '</div>';
    container.innerHTML = html;
}
loadPlayers();
</script>
{% endblock %}
