{% extends "base.html" %}
{% block title %}Edit Player — {{ site_name }}{% endblock %}
{% block content %}

<div class="mx-auto max-w-md">
    <div class="page-head">
        <div>
            <p class="eyebrow">Admin</p>
            <h1 class="display text-[32px] leading-none" id="playerName">Loading…</h1>
            <p class="micro mt-2">Edit player stats · 1v1</p>
        </div>
    </div>
    <div class="panel p-5 sm:p-6">
        <form id="editForm" class="space-y-4">
            <div><label class="field-label" for="edit-username">Username</label><input id="edit-username" type="text" name="username" class="field"></div>
            <div><label class="field-label" for="edit-elo">ELO</label><input id="edit-elo" type="number" name="elo" class="field"></div>
            <div><label class="field-label" for="edit-wins">Wins</label><input id="edit-wins" type="number" name="wins" min="0" class="field"></div>
            <div><label class="field-label" for="edit-losses">Losses</label><input id="edit-losses" type="number" name="losses" min="0" class="field"></div>
            <button type="submit" class="btn btn-pink w-full py-2.5">Save changes</button>
        </form>
        <div id="result" class="mt-4 hidden" role="status" aria-live="polite"></div>
    </div>
</div>

<script>
async function loadPlayer() {
    const res = await fetch('/api/players/{{ player_id }}');
    const data = await res.json();
    document.getElementById('playerName').textContent = data.username;
    document.querySelector('[name="username"]').value = data.username;
    const r = data.ratings.find(r => r.format === '1v1') || {};
    document.querySelector('[name="elo"]').value = r.elo || 0;
    document.querySelector('[name="wins"]').value = r.wins || 0;
    document.querySelector('[name="losses"]').value = r.losses || 0;
}
document.getElementById('editForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const body = {};
    const username = fd.get('username'); if (username) body.username = username;
    const elo = parseInt(fd.get('elo')); if (!isNaN(elo)) body.elo = elo;
    const wins = parseInt(fd.get('wins')); if (!isNaN(wins)) body.wins = wins;
    const losses = parseInt(fd.get('losses')); if (!isNaN(losses)) body.losses = losses;
    const res = await window.apiFetch('/api/players/{{ player_id }}', { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const result = document.getElementById('result');
    result.classList.remove('hidden');
    if (res.ok) {
        result.className = 'alert alert-success mt-4';
        result.innerHTML = 'Saved. <a href="/player/{{ player_id }}" class="font-semibold underline">View profile</a>';
    } else {
        const err = await res.json();
        result.className = 'alert alert-error mt-4';
        result.textContent = err.detail || 'Error saving';
    }
});
loadPlayer();
</script>
{% endblock %}
