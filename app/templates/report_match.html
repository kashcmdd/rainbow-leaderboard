{% extends "base.html" %}
{% block title %}Report Match — {{ site_name }}{% endblock %}
{% block content %}

<div class="mx-auto max-w-xl">
    <div class="page-head">
        <div>
            <p class="eyebrow">Submit result</p>
            <h1 class="display text-[34px] leading-none sm:text-[40px]">Report match</h1>
            <p class="micro mt-2">Player reports wait for the opponent; admin reports apply immediately</p>
        </div>
    </div>

    <div class="panel p-5 sm:p-6">
        <form id="matchForm" class="space-y-5">
            <div>
                <label class="field-label" for="formatSelect">Format</label>
                <select name="format" class="field" id="formatSelect">
                    <option value="1v1">1v1</option>
                    <option value="2v2">2v2</option>
                    <option value="3v3">3v3</option>
                    <option value="4v4">4v4</option>
                    <option value="5v5">5v5</option>
                </select>
            </div>
            <div class="relative grid grid-cols-1 gap-4 sm:grid-cols-2">
                <div class="relative">
                    <label class="field-label" for="teamAInput">Team A</label>
                    <div class="mb-2 flex flex-wrap gap-1.5" id="teamAPills"></div>
                    <input type="text" id="teamAInput" class="field" placeholder="Search player…" autocomplete="off">
                    <div id="teamASuggestions" class="panel absolute z-20 mt-1 hidden w-full overflow-hidden"></div>
                </div>
                <div class="relative">
                    <label class="field-label" for="teamBInput">Team B</label>
                    <div class="mb-2 flex flex-wrap gap-1.5" id="teamBPills"></div>
                    <input type="text" id="teamBInput" class="field" placeholder="Search player…" autocomplete="off">
                    <div id="teamBSuggestions" class="panel absolute z-20 mt-1 hidden w-full overflow-hidden"></div>
                </div>
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="field-label" for="score_a">Score — A</label>
                    <input type="number" id="score_a" name="score_a" min="0" required class="field">
                </div>
                <div>
                    <label class="field-label" for="score_b">Score — B</label>
                    <input type="number" id="score_b" name="score_b" min="0" required class="field">
                </div>
            </div>
            <div class="grid grid-cols-1 gap-3 sm:grid-cols-3">
                <div>
                    <label class="field-label" for="mapSelect">Map (optional)</label>
                    <select id="mapSelect" class="field">
                        <option value="">—</option>
                        <option>Bank</option><option>Border</option><option>Chalet</option>
                        <option>Clubhouse</option><option>Coastline</option><option>Consulate</option>
                        <option>Emerald Plains</option><option>Kafe</option><option>Lair</option>
                        <option>Nighthaven</option><option>Oregon</option><option>Skyscraper</option>
                        <option>Stadium</option><option>Theme Park</option><option>Villa</option>
                    </select>
                </div>
                <div>
                    <label class="field-label" for="sideSelect">Side A (optional)</label>
                    <select id="sideSelect" class="field">
                        <option value="">—</option>
                        <option value="attack">Attack</option>
                        <option value="defense">Defense</option>
                    </select>
                </div>
                <div>
                    <label class="field-label" for="bansInput">Operator bans (optional)</label>
                    <input id="bansInput" class="field" placeholder="e.g. Thatcher, Mira" autocomplete="off">
                </div>
            </div>
            <div>
                <label class="field-label" for="evidenceInput">Evidence link (optional)</label>
                <input id="evidenceInput" type="url" class="field" placeholder="https://… screenshot or clip" autocomplete="off">
            </div>
            <div class="flex flex-col gap-2 sm:flex-row">
                <button type="button" id="previewBtn" class="btn w-full py-2.5 sm:w-1/2">Preview ELO</button>
                <button type="submit" class="btn btn-pink w-full py-2.5 sm:w-1/2">Submit match</button>
            </div>
        </form>
        <div id="preview" class="mt-4 hidden" role="status" aria-live="polite"></div>
        <div id="result" class="mt-4 hidden" role="status" aria-live="polite"></div>
    </div>
</div>

<script>
let allPlayers = [];

async function loadPlayers() { const res = await fetch('/api/players'); allPlayers = await res.json(); }

function showResult(msg, kind) {
    const el = document.getElementById('result');
    el.className = 'alert mt-4 ' + (kind === 'success' ? 'alert-success' : 'alert-error');
    el.textContent = msg;
    el.classList.remove('hidden');
}

function setupTeam(team) {
    const inputId = `team${team}Input`, suggestId = `team${team}Suggestions`, pillsId = `team${team}Pills`;
    const input = document.getElementById(inputId), suggestions = document.getElementById(suggestId), pillsContainer = document.getElementById(pillsId);
    const selected = [];
    function render() {
        pillsContainer.innerHTML = selected.map((n, i) =>
            `<span class="badge badge-signal">${n}<button type="button" class="ml-1 text-ink3 hover:text-ink" data-idx="${i}" aria-label="Remove ${n}">&times;</button></span>`
        ).join('');
        pillsContainer.querySelectorAll('button').forEach(b => b.addEventListener('click', () => { selected.splice(parseInt(b.dataset.idx), 1); render(); }));
    }
    input.addEventListener('input', () => {
        const val = input.value.toLowerCase().trim();
        if (!val) { suggestions.classList.add('hidden'); return; }
        const matches = allPlayers.filter(p => p.username.toLowerCase().includes(val) && !selected.includes(p.username)).slice(0, 6);
        if (!matches.length) { suggestions.classList.add('hidden'); return; }
        suggestions.innerHTML = matches.map(p =>
            `<div class="cursor-pointer border-b px-3 py-2 text-[13px] text-ink2 last:border-b-0 hover:bg-panel2 hover:text-ink" style="border-color:var(--line)" data-name="${p.username}">${p.username}</div>`
        ).join('');
        suggestions.classList.remove('hidden');
        suggestions.querySelectorAll('div').forEach(el => el.addEventListener('click', () => { selected.push(el.dataset.name); input.value = ''; suggestions.classList.add('hidden'); render(); }));
    });
    input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();
            const v = input.value.trim();
            if (v && !selected.includes(v)) { selected.push(v); input.value = ''; suggestions.classList.add('hidden'); render(); }
        }
    });
    document.addEventListener('click', (e) => { if (!e.target.closest(`#${inputId}, #${suggestId}`)) suggestions.classList.add('hidden'); });
    return { selected };
}

const teamA = setupTeam('A'), teamB = setupTeam('B');

function readScores() {
    return {
        format: document.getElementById('formatSelect').value,
        score_a: parseInt(document.querySelector('[name="score_a"]').value),
        score_b: parseInt(document.querySelector('[name="score_b"]').value),
    };
}

function validationError(score_a, score_b) {
    if (isNaN(score_a) || isNaN(score_b) || score_a < 0 || score_b < 0) return 'Please enter valid scores for both teams.';
    if (score_a === score_b) return 'Scores cannot be tied. There must be a winner.';
    if (!teamA.selected.length || !teamB.selected.length) return 'Each team needs at least one player.';
    return null;
}

function submissionBody(format, score_a, score_b) {
    const bans = document.getElementById('bansInput').value
        .split(',')
        .map((b) => b.trim())
        .filter(Boolean);
    return {
        format,
        team_a_player_names: [...teamA.selected],
        team_b_player_names: [...teamB.selected],
        score_a,
        score_b,
        map_name: document.getElementById('mapSelect').value || null,
        side_a: document.getElementById('sideSelect').value || null,
        operator_bans: bans,
        evidence_url: document.getElementById('evidenceInput').value.trim() || null,
    };
}

document.getElementById('previewBtn').addEventListener('click', async () => {
    const { format, score_a, score_b } = readScores();
    const problem = validationError(score_a, score_b);
    if (problem) { showResult(problem, 'error'); return; }

    const preview = document.getElementById('preview');
    preview.classList.remove('hidden');
    preview.className = 'panel-2 mt-4 p-4';
    preview.innerHTML = '<div class="micro">Calculating…</div>';

    const res = await window.apiFetch('/api/matches/preview', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(submissionBody(format, score_a, score_b)),
    });
    if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        preview.className = 'alert alert-error mt-4';
        preview.textContent = err.detail || 'Could not preview this match.';
        return;
    }
    const d = await res.json();
    if (d.duplicate) {
        preview.className = 'alert alert-error mt-4';
        preview.innerHTML = `This looks like a duplicate. <a class="underline" href="/match/${d.duplicate_match_id}">View the existing match</a>.`;
        return;
    }
    preview.className = 'panel-2 mt-4 p-4';
    preview.innerHTML = `<div class="flex items-center justify-between gap-4">
        <div><div class="micro">Winner</div><div class="mt-1 text-sm font-semibold">${window.esc(d.winner === 'team_a' ? d.team_a : d.team_b)}</div></div>
        <div class="text-right"><div class="micro">ELO swing</div>
        <div class="num mt-1 text-sm"><span style="color:var(--win)">+${d.elo_deltas.winner_delta}</span> <span class="text-ink3">/</span> <span style="color:var(--loss)">${d.elo_deltas.loser_delta}</span></div></div>
    </div>`;
});

document.getElementById('matchForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const { format, score_a, score_b } = readScores();
    const resultDiv = document.getElementById('result');

    const problem = validationError(score_a, score_b);
    if (problem) { showResult(problem, 'error'); return; }

    resultDiv.classList.add('hidden');
    const submitBtn = e.target.querySelector('button[type="submit"]');
    const originalText = submitBtn.textContent;
    submitBtn.disabled = true;
    submitBtn.textContent = 'Submitting…';

    try {
        const res = await window.apiFetch('/api/matches', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(submissionBody(format, score_a, score_b))
        });
        if (res.ok) {
            const d = await res.json();
            window.location.href = d.status === 'pending'
                ? '/match/' + d.match_id
                : (d.winner_player_id ? '/player/' + d.winner_player_id : '/leaderboard?format=' + format);
        } else {
            const err = await res.json();
            showResult(typeof err.detail === 'string' ? err.detail : JSON.stringify(err), 'error');
        }
    } catch (e) {
        showResult('Network error. Please try again.', 'error');
    } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = originalText;
    }
});

loadPlayers();
</script>
{% endblock %}
