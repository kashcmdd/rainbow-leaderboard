{% extends "base.html" %}
{% block title %}Compare — {{ site_name }}{% endblock %}
{% block content %}

<div class="page-head">
    <div>
        <p class="eyebrow">Head to head</p>
        <h1 class="display text-[34px] leading-none sm:text-[40px]">Compare</h1>
        <p class="micro mt-2">Two players · every format</p>
    </div>
</div>

<div class="mx-auto max-w-4xl">
    <div class="panel p-4 sm:p-5">
        <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
            <div class="relative">
                <label class="field-label" for="player1Input">Player 1</label>
                <input type="text" id="player1Input" class="field" placeholder="Search player…" autocomplete="off">
                <div id="player1Suggestions" class="panel absolute z-20 mt-1 hidden w-full overflow-hidden"></div>
            </div>
            <div class="relative">
                <label class="field-label" for="player2Input">Player 2</label>
                <input type="text" id="player2Input" class="field" placeholder="Search player…" autocomplete="off">
                <div id="player2Suggestions" class="panel absolute z-20 mt-1 hidden w-full overflow-hidden"></div>
            </div>
        </div>
        <button id="compareBtn" class="btn btn-pink mt-4 w-full py-2.5" disabled>Compare</button>
    </div>

    <div id="compareResults" class="mt-4 hidden"></div>
</div>

<script>
var allPlayers = [];
var selectedP1 = null, selectedP2 = null;

async function loadPlayers() {
    var res = await fetch('/api/players');
    if (res.ok) allPlayers = await res.json();
}

function setupSearch(inputId, suggestId, onSelect) {
    var input = document.getElementById(inputId);
    var suggestions = document.getElementById(suggestId);

    input.addEventListener('input', function() {
        var val = this.value.toLowerCase().trim();
        if (!val) { suggestions.classList.add('hidden'); return; }
        var matches = allPlayers.filter(function(p) { return p.username.toLowerCase().includes(val); }).slice(0, 8);
        if (!matches.length) { suggestions.classList.add('hidden'); return; }
        suggestions.innerHTML = matches.map(function(p) {
            var initial = p.username.charAt(0).toUpperCase();
            return '<div class="flex cursor-pointer items-center gap-3 border-b px-3 py-2.5 text-[13px] text-ink2 last:border-b-0 hover:bg-panel2 hover:text-ink" style="border-color:var(--line)" data-id="' + p.id + '" data-username="' + window.esc(p.username) + '">' +
                '<span class="flex h-6 w-6 items-center justify-center border text-[10px] font-semibold" style="border-color:var(--line);background:var(--panel-2)">' + initial + '</span>' +
                '<span>' + window.esc(p.username) + '</span></div>';
        }).join('');
        suggestions.classList.remove('hidden');
        suggestions.querySelectorAll('div').forEach(function(el) {
            el.addEventListener('click', function() {
                var selected = { id: this.dataset.id, username: this.dataset.username };
                input.value = this.dataset.username;
                suggestions.classList.add('hidden');
                onSelect(selected);
            });
        });
    });
    input.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') suggestions.classList.add('hidden');
    });
    document.addEventListener('click', function(e) {
        if (!e.target.closest('#' + inputId + ', #' + suggestId)) suggestions.classList.add('hidden');
    });
}

setupSearch('player1Input', 'player1Suggestions', function(s) {
    selectedP1 = s;
    document.getElementById('compareBtn').disabled = !(selectedP1 && selectedP2);
});

setupSearch('player2Input', 'player2Suggestions', function(s) {
    selectedP2 = s;
    document.getElementById('compareBtn').disabled = !(selectedP1 && selectedP2);
});

document.getElementById('compareBtn').addEventListener('click', async function() {
    if (!selectedP1 || !selectedP2) return;
    var btn = this;
    btn.disabled = true;
    btn.textContent = 'Loading…';
    var results = document.getElementById('compareResults');
    results.classList.remove('hidden');
    results.innerHTML = '<div class="panel p-6"><div class="skeleton mb-3 h-5 w-2/3"></div><div class="skeleton h-24"></div></div>';

    try {
        var res = await fetch('/api/players/compare?player1=' + selectedP1.id + '&player2=' + selectedP2.id);
        if (!res.ok) { results.innerHTML = '<div class="panel p-8 text-center text-sm text-ink3">Failed to load comparison.</div>'; return; }
        var data = await res.json();
        renderComparison(results, data);
    } catch (e) {
        results.innerHTML = '<div class="panel p-8 text-center text-sm text-ink3">Error loading data.</div>';
    } finally {
        btn.disabled = false;
        btn.textContent = 'Compare';
    }
});

function pad2(n) { return String(n).padStart(2, '0'); }

function renderComparison(container, data) {
    var p1 = data.player1, p2 = data.player2;
    var h2h = data.head_to_head;

    var p1Best = p1.ratings.slice().sort(function(a, b) { return b.elo - a.elo; })[0] || { elo: 0, rank_title: 'Unranked', rank_color: '#666', wins: 0, losses: 0 };
    var p2Best = p2.ratings.slice().sort(function(a, b) { return b.elo - a.elo; })[0] || { elo: 0, rank_title: 'Unranked', rank_color: '#666', wins: 0, losses: 0 };

    function playerCard(player, best, side) {
        var totWins = 0, totLosses = 0;
        for (var i = 0; i < player.ratings.length; i++) { totWins += player.ratings[i].wins; totLosses += player.ratings[i].losses; }
        var wr = totWins + totLosses > 0 ? (totWins / (totWins + totLosses) * 100).toFixed(0) : 0;
        var initial = player.username.charAt(0).toUpperCase();
        var rankIcon = best.rank_title.toLowerCase().replace(/ /g, '_') + '.svg';
        return '<div class="panel p-5" style="border-top:2px solid ' + (side === 1 ? 'var(--signal)' : 'var(--line-strong)') + '">' +
            '<div class="flex flex-col items-center text-center">' +
            '<div class="flex h-16 w-16 items-center justify-center overflow-hidden border text-lg font-semibold" style="border-color:var(--line);background:var(--panel-2);color:var(--ink-2)">' +
            (player.avatar_url ? '<img src="' + window.esc(player.avatar_url) + '" alt="" class="h-full w-full object-cover">' : initial) +
            '</div>' +
            '<h2 class="display mt-3 text-[24px] leading-none">' + window.esc(player.username) + '</h2>' +
            '<div class="mt-2 flex items-center gap-2">' +
            '<img src="/static/rank-icons/' + rankIcon + '" alt="" class="h-5 w-auto">' +
            '<span class="rank-chip" style="--rank-color:' + best.rank_color + '">' + window.esc(best.rank_title) + '</span></div>' +
            '<div class="num rank-elo mt-3 text-[34px] font-semibold leading-none" style="--rank-color:' + best.rank_color + '">' + best.elo + '</div>' +
            '<div class="num mt-2 flex items-center gap-2 text-[11px]">' +
            '<span style="color:var(--win)">' + totWins + 'W</span>' +
            '<span class="text-ink3">/</span>' +
            '<span style="color:var(--loss)">' + totLosses + 'L</span>' +
            '<span class="text-ink3">/</span>' +
            '<span class="text-ink2">' + wr + '%</span></div>' +
            '</div></div>';
    }

    function h2hCard(h) {
        var wrP1 = h.total_matches > 0 ? (h.player1_wins / h.total_matches * 100).toFixed(0) : 0;
        var wrP2 = h.total_matches > 0 ? (h.player2_wins / h.total_matches * 100).toFixed(0) : 0;
        var p1pct = h.total_matches > 0 ? (h.player1_wins / h.total_matches * 100) : 0;
        return '<div class="panel mt-4 p-5">' +
            '<div class="section-head"><h3 class="stat-label mb-0">Head to head</h3><span class="micro">' + h.total_matches + (h.total_matches === 1 ? ' match' : ' matches') + '</span></div>' +
            '<div class="flex items-center justify-center gap-6 py-2">' +
            '<div class="text-center"><div class="num text-[28px] font-semibold leading-none" style="color:var(--win)">' + h.player1_wins + '</div><div class="micro mt-1 max-w-[120px] truncate">' + window.esc(p1.username) + '</div></div>' +
            '<div class="display text-[20px] text-ink3">VS</div>' +
            '<div class="text-center"><div class="num text-[28px] font-semibold leading-none" style="color:var(--loss)">' + h.player2_wins + '</div><div class="micro mt-1 max-w-[120px] truncate">' + window.esc(p2.username) + '</div></div>' +
            '</div>' +
            '<div class="mt-3 flex h-1 overflow-hidden" style="background:var(--line)">' +
            '<span style="width:' + p1pct + '%;background:var(--win)"></span>' +
            '<span style="width:' + (100 - p1pct) + '%;background:var(--loss)"></span></div>' +
            '<div class="num mt-2 flex items-center justify-between text-[10px] text-ink3">' +
            '<span>' + wrP1 + '%</span><span>' + wrP2 + '%</span></div></div>';
    }

    function matchList(matches) {
        if (matches.length === 0) {
            return '<div class="panel mt-4 px-4 py-10 text-center text-xs text-ink3">No matches between these players.</div>';
        }
        var html = '<div class="mt-4"><div class="section-head"><h3 class="display text-[18px] leading-none">Recent matches</h3><span class="micro">' + matches.length + '</span></div><div class="panel overflow-hidden">';
        for (var i = 0; i < matches.length; i++) {
            var m = matches[i];
            var isWin = m.result === 'win';
            var dateStr = new Date(m.timestamp).toLocaleDateString();
            html += '<div class="flex items-center justify-between gap-3 border-b px-4 py-3 last:border-b-0" style="border-color:var(--line)">' +
                '<div class="flex min-w-0 items-center gap-3">' +
                '<span class="badge ' + (isWin ? 'badge-win' : 'badge-loss') + '">' + (isWin ? 'W' : 'L') + '</span>' +
                '<span class="truncate text-[13px] font-semibold">' + window.esc(m.opponent) + '</span>' +
                '<span class="micro">' + window.esc(m.format) + '</span></div>' +
                '<div class="flex shrink-0 items-center gap-3">' +
                '<span class="num text-[13px] font-semibold">' + m.score_a + '–' + m.score_b + '</span>' +
                '<span class="micro">' + dateStr + '</span></div></div>';
        }
        html += '</div></div>';
        return html;
    }

    container.innerHTML =
        '<div class="grid grid-cols-1 gap-3 md:grid-cols-2">' +
        playerCard(p1, p1Best, 1) +
        playerCard(p2, p2Best, 2) +
        '</div>' +
        h2hCard(h2h) +
        matchList(h2h.matches);
}

loadPlayers();
</script>
{% endblock %}
