{% extends "base.html" %}
{% block content %}
<div class="flex items-center justify-center min-h-[60vh]">
    <div class="card p-10 w-full max-w-sm text-center animate-slide-up opacity-0 stagger-1">
        <h1 class="text-2xl font-extrabold text-white mb-2">clukzers<span style="color:#e8197d">LB</span></h1>
        <p class="text-xs text-gray-500 uppercase tracking-widest mb-8">Sign in to report matches</p>
        <a href="/auth/discord" class="inline-flex items-center justify-center gap-2 w-full py-3 text-sm font-bold rounded-lg transition-all" style="background:#5865F2;color:#fff;">Sign in with Discord</a>
        {% if request.query_params.get("error") %}<p class="text-xs text-red-400 mt-4" style="background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.2);border-radius:8px;padding:8px;">Something went wrong.</p>{% endif %}
    </div>
</div>
{% endblock %}
