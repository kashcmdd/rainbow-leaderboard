{% extends "base.html" %}
{% block content %}
<div class="flex items-center justify-center min-h-[60vh]">
    <div class="card p-10 w-full max-w-sm text-center animate-slide-up opacity-0 stagger-1">
        <h1 class="text-2xl font-extrabold text-white mb-2">clukzers<span class="text-gradient">LB</span></h1>
        <p class="section-title text-center mb-8">Sign in to report matches</p>
        <a href="/auth/discord" class="btn w-full py-3 text-sm font-bold" style="background:#5865F2;border-color:#5865F2;color:#fff;">Sign in with Discord</a>
        {% if request.query_params.get("error") %}<p class="mt-4 p-3 rounded-lg text-xs" style="background:var(--red-glow);border:1px solid rgba(239,68,68,0.2);color:#ef4444;">Something went wrong.</p>{% endif %}
    </div>
</div>
{% endblock %}
