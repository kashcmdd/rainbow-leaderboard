{% extends "base.html" %}
{% block title %}{{ code }} — {{ site_name }}{% endblock %}
{% block content %}

<div class="flex flex-col items-center justify-center py-24 text-center">
    <h1 class="display text-[96px] leading-none" style="color:var(--signal)">{{ code }}</h1>
    <p class="mt-4 text-sm text-ink2">{{ message }}</p>
    <a href="/" class="btn btn-pink mt-8 px-6 py-2.5">Go home</a>
</div>
{% endblock %}
