{% extends "base.html" %}
{% block title %}Seasons — {{ site_name }}{% endblock %}
{% block content %}

<div class="page-head">
    <div>
        <p class="eyebrow">Seasons</p>
        <h1 class="display text-[34px] leading-none sm:text-[40px]">Seasons</h1>
        <p class="micro mt-2">1v1 standings snapshots</p>
    </div>
</div>

<div id="seasonsContent">
    <div class="panel p-6"><div class="skeleton h-6 w-2/3"></div></div>
</div>

<script>
async function loadSeasons() {
  const seasons = await (await fetch('/api/leaderboard/seasons/list')).json();
  let html = '';
  for (const s of seasons) {
    const isActive = s.status === 'active';
    const badge = isActive ? 'badge badge-active' : 'badge badge-completed';
    html += `<div class="season-card cursor-pointer border-b py-4" data-id="${s.id}" style="border-color:var(--line)">
      <div class="flex items-center justify-between gap-3">
        <div class="min-w-0 flex-1">
          <h2 class="truncate text-[14px] font-semibold text-ink">${s.name}</h2>
          <p class="micro mt-1">${new Date(s.start_date).toLocaleDateString()} — ${s.end_date ? new Date(s.end_date).toLocaleDateString() : 'Present'}</p>
        </div>
        <div class="flex shrink-0 items-center gap-3">
          <span class="${badge}">${s.status}</span>
          <span class="expand-icon micro" aria-hidden="true">▶</span>
        </div>
      </div>
      <div class="season-standings pt-3" id="standings-${s.id}" style="display:none;">
        <div class="skeleton h-10 w-full"></div>
      </div>
    </div>`;
  }
  document.getElementById('seasonsContent').innerHTML = html || '<div class="py-10 text-center text-xs text-ink3">No seasons yet.</div>';

  document.querySelectorAll('.season-card').forEach(card => {
    card.addEventListener('click', async function() {
      const id = this.dataset.id;
      const body = this.querySelector('.season-standings');
      const icon = this.querySelector('.expand-icon');
      if (body.style.display === 'none') {
        body.style.display = 'block';
        icon.textContent = '▼';
        if (body.dataset.loaded) return;
        try {
          const snap = await (await fetch(`/api/leaderboard/seasons/${id}`)).json();
          if (!snap.standings || snap.standings.length === 0) {
            body.innerHTML = '<div class="px-4 py-8 text-center text-xs text-ink3">No standings recorded for this season.</div>';
            body.dataset.loaded = '1';
            return;
          }
          let table = '<div class="overflow-x-auto border" style="border-color:var(--line)"><table class="data-table"><thead><tr><th scope="col" class="w-10">#</th><th>Player</th><th scope="col" class="text-right">ELO</th><th>Rank</th><th scope="col" class="hidden text-right sm:table-cell">W</th><th scope="col" class="hidden text-right sm:table-cell">L</th></tr></thead><tbody>';
          for (const p of snap.standings) {
            table += `<tr><td class="num text-[11px] text-ink3">${p.position}</td><td class="text-[13px]">${window.esc(p.player_name)}</td><td class="num text-right text-[13px] rank-elo" style="--rank-color:${p.rank_color}">${p.elo}</td><td><span class="rank-chip" style="--rank-color:${p.rank_color}">${window.esc(p.rank_title)}</span></td><td class="num hidden text-right text-[11px] text-ink2 sm:table-cell">${p.wins}</td><td class="num hidden text-right text-[11px] text-ink2 sm:table-cell">${p.losses}</td></tr>`;
          }
          table += '</tbody></table></div>';
          body.innerHTML = table;
          body.dataset.loaded = '1';
        } catch {
          body.innerHTML = '<div class="alert alert-error">Failed to load standings.</div>';
        }
      } else {
        body.style.display = 'none';
        icon.textContent = '▶';
      }
    });
  });
}

loadSeasons();
</script>
{% endblock %}
