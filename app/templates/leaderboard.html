{% extends "base.html" %}
{% block content %}
<div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 mb-6">
    <h1 class="text-2xl font-extrabold text-white">Leaderboard</h1>
    <div class="tabs">
        {% for f in ["1v1", "2v2", "3v3", "4v4", "5v5"] %}
        <a href="/leaderboard?format={{ f }}" class="tab{% if format == f %} active{% endif %}">{{ f }}</a>
        {% endfor %}
        <a id="tabToggle" href="#" class="tab">Teams</a>
        <a href="/api/leaderboard/{{ format }}/export?type=csv" class="tab" title="Download CSV">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        </a>
    </div>
</div>

<div class="filter-bar">
    <div class="search-wrap">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input id="playerSearch" placeholder="Search player...">
    </div>
    <select id="rankFilter">
        <option value="">All Ranks</option>
        <option value="Bronze">Bronze</option>
        <option value="Silver">Silver</option>
        <option value="Gold">Gold</option>
        <option value="Platinum">Platinum</option>
        <option value="Emerald">Emerald</option>
        <option value="Diamond">Diamond</option>
        <option value="Champion">Champion</option>
    </select>
</div>

<div id="leaderboard">
    <div class="space-y-2">
        {% for i in range(5) %}
        <div class="card p-5 animate-shimmer"><div class="h-4 bg-white/5 rounded w-3/4"></div></div>
        {% endfor %}
    </div>
</div>

<script>
const FORMAT = new URLSearchParams(window.location.search).get('format') || '1v1';
const RANK_FILTER = new URLSearchParams(window.location.search).get('rank') || '';
let TAB = new URLSearchParams(window.location.search).get('tab') || 'players';

function rankGlow(hex) {
    const c = hex.replace('#','');
    const r = parseInt(c.slice(0,2),16);
    const g = parseInt(c.slice(2,4),16);
    const b = parseInt(c.slice(4,6),16);
    return `rgba(${r},${g},${b},0.4)`;
}

async function loadLeaderboard() {
    const scrollY = window.scrollY;
    const url = `/api/leaderboard/${FORMAT}${TAB === 'teams' ? '/team' : ''}${RANK_FILTER ? `?rank=${RANK_FILTER}` : ''}`;
    const res = await fetch(url);
    let data = await res.json();
    data = data.map(e => {
        e._id = TAB === 'teams' ? (e.team_id || e.name) : e.player_id;
        e._linkPrefix = TAB === 'teams' ? '/team/' : '/player/';
        return e;
    });
    const container = document.getElementById('leaderboard');

    if (data.length === 0) {
        container.innerHTML = `<div class="card p-12 text-center animate-slide-up"><p class="text-sm text-gray-500 mb-4">No matches yet.</p><a href="/report" class="btn btn-primary text-sm">Report Match</a></div>`;
        return;
    }

    const top3 = [data[0], data[1], data[2]].filter(Boolean);

    const avatarMap = {};
    for (const e of data) {
        if (e._id) {
            try {
                const r = await fetch(TAB === 'teams' ? `/api/teams/${e._id}` : `/api/players/${e._id}`);
                const pd = await r.json();
                avatarMap[e._id] = (TAB === 'teams' ? pd.logo_url : pd.avatar_url) || null;
            } catch {}
        }
    }

    let html = '';

    // ── PODIUM ──
    if (top3.length > 0) {
        html += `<div class="podium">`;
        const places = [
            { entry: top3[1], cls: 'podium-2', medal: '\u2656', label: '2nd', color: '#a0a0a0', delay: 'stagger-2' },
            { entry: top3[0], cls: 'podium-1', medal: '\u2655', label: '1st', color: '#e8197d', delay: 'stagger-1' },
            { entry: top3[2], cls: 'podium-3', medal: '\u2657', label: '3rd', color: '#cd7f32', delay: 'stagger-3' },
        ];
        for (const p of places) {
            if (!p.entry) continue;
            const e = p.entry;
            const wr = (e.win_rate * 100).toFixed(0);
            const rc = e.rank_color;
            const avatar = avatarMap[e._id];
            const initial = e.name.charAt(0).toUpperCase();
            html += `<div class="${p.cls} animate-slide-up opacity-0 ${p.delay}"><a href="${e._linkPrefix}${e._id}" class="podium-card">
                <div class="flex items-center justify-between mb-3">
                    <div class="flex items-center gap-2">
                        <span class="podium-medal" style="--medal-color:${p.color};color:${p.color}">${p.medal}</span>
                        <span class="podium-rank" style="color:${p.color}">${p.label}</span>
                    </div>
                    <span class="badge badge-pink flex items-center gap-1.5" style="background:${rc}15;color:${rc};">
                        <img src="/static/rank-icons/${e.rank_title.toLowerCase().replace(/ /g, '_')}.svg" alt="${e.rank_title}" class="w-4 h-4" style="filter:drop-shadow(0 0 3px ${rankGlow(rc)});">
                        ${e.rank_title}
                    </span>
                </div>
                <div class="flex items-center gap-3 mb-4">
                    <div class="podium-avatar" style="background:${rc}20;color:${rc};">
                        ${avatar ? `<img src="${avatar}">` : initial}
                    </div>
                    <div>
                        <div class="podium-name">${e.name}</div>
                        <div class="flex items-center gap-2 text-xs text-gray-500">
                            <span style="color:#00e676;">${e.wins}W</span>
                            <span class="text-gray-700">/</span>
                            <span style="color:#ef4444;">${e.losses}L</span>
                            ${e.streak ? `<span class="font-bold" style="color:${e.streak > 0 ? '#00e676' : '#ef4444'}">${e.streak > 0 ? '🔥' : ''}${e.streak > 0 ? '+' : ''}${e.streak}</span>` : ''}
                            <span class="text-gray-700">·</span>
                            <span>${wr}%</span>
                        </div>
                    </div>
                </div>
                <div class="flex items-end justify-between">
                    <div class="podium-elo" style="color:${rc};">${e.elo}</div>
                    <div class="podium-bar">
                        <div class="podium-bar-fill" style="width:${wr}%;background:${rc};box-shadow:0 0 8px ${rankGlow(rc)};"></div>
                    </div>
                </div>
            </a></div>`;
        }
        html += `</div>`;
    }

    // ── TABLE ──
    html += `<div class="table-wrap"><table><thead><tr>
        <th class="w-14">#</th>
        <th>${TAB === 'teams' ? 'Team' : 'Player'}</th>
        <th>Rank</th>
        <th class="text-right">ELO</th>
        <th class="text-right">W</th>
        <th class="text-right">L</th>
        <th class="text-right hidden md:table-cell">WR</th>
    </tr></thead><tbody>`;

    for (const entry of data) {
        const wr = (entry.win_rate * 100).toFixed(0);
        const rc = entry.rank_color;
        const initial = entry.name.charAt(0).toUpperCase();
        html += `<tr class="table-row" style="--row-color:${rc};">
            <td><span class="font-bold text-sm" style="color:${entry.rank <= 3 ? ['#e8197d','#a0a0a0','#cd7f32'][entry.rank-1] : '#555'}">#${entry.rank}</span></td>
            <td>
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold shrink-0 overflow-hidden" style="background:${rc}15;color:${rc};">
                        ${avatarMap[entry._id] ? `<img src="${avatarMap[entry._id]}" class="w-full h-full object-cover">` : initial}
                    </div>
                    <a href="${entry._linkPrefix}${entry._id}" class="text-sm font-semibold text-white hover:text-[#e8197d] transition-colors truncate max-w-[120px]">${entry.name}</a>
                </div>
            </td>
            <td>
                <span class="badge badge-pink inline-flex items-center gap-1" style="background:${rc}12;color:${rc};font-size:10px;">
                    <img src="/static/rank-icons/${entry.rank_title.toLowerCase().replace(/ /g, '_')}.svg" alt="${entry.rank_title}" class="w-3.5 h-3.5" style="filter:drop-shadow(0 0 3px ${rankGlow(rc)});">
                    ${entry.rank_title}
                </span>
            </td>
            <td class="text-right"><span class="font-extrabold" style="color:${rc};">${entry.elo}</span></td>
            <td class="text-right" style="color:#00e676;">${entry.wins}</td>
            <td class="text-right" style="color:#ef4444;">${entry.losses}</td>
            <td class="text-right hidden md:table-cell">
                <div class="flex items-center justify-end gap-2">
                    ${entry.streak ? `<span class="text-xs font-bold" style="color:${entry.streak > 0 ? '#00e676' : '#ef4444'}">${entry.streak > 0 ? '🔥' : ''}${entry.streak > 0 ? '+' : ''}${entry.streak}</span>` : ''}
                    <span class="text-xs font-medium" style="color:${rc};">${wr}%</span>
                    <div class="w-12 h-1 rounded-full overflow-hidden" style="background:rgba(255,255,255,0.06);">
                        <div class="h-full rounded-full" style="width:${wr}%;background:${rc};"></div>
                    </div>
                </div>
            </td>
        </tr>`;
    }

    html += `</tbody></table></div>`;
    container.innerHTML = html;

    // Search
    const searchInput = document.getElementById('playerSearch');
    const applyFilter = () => {
        const q = searchInput.value.toLowerCase();
        container.querySelectorAll('tbody tr, .podium a').forEach(el => {
            el.style.display = el.textContent.toLowerCase().includes(q) ? '' : 'none';
        });
    };
    searchInput.addEventListener('input', applyFilter);
    if (searchInput.value) applyFilter();
    window.scrollTo(0, scrollY);

    // Rank filter
    const rf = document.getElementById('rankFilter');
    if (RANK_FILTER) rf.value = RANK_FILTER;
    rf.addEventListener('change', function() {
        const params = new URLSearchParams(window.location.search);
        if (this.value) params.set('rank', this.value);
        else params.delete('rank');
        window.location.search = params.toString();
    });
}

// Tab toggle
const tabToggle = document.getElementById('tabToggle');
const updateTabStyle = () => {
    const isTeams = TAB === 'teams';
    tabToggle.textContent = isTeams ? 'Players' : 'Teams';
    tabToggle.className = 'tab' + (isTeams ? ' active' : '');
};
updateTabStyle();
tabToggle.addEventListener('click', function(e) {
    e.preventDefault();
    TAB = TAB === 'teams' ? 'players' : 'teams';
    const url = new URL(window.location);
    url.searchParams.set('tab', TAB);
    history.pushState({}, '', url);
    updateTabStyle();
    loadLeaderboard();
});

loadLeaderboard();
setInterval(loadLeaderboard, 10000);
</script>
{% endblock %}
