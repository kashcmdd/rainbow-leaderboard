{% extends "base.html" %}
{% block content %}
<style>
.checkbox { accent-color: var(--signal); width:16px; height:16px; cursor:pointer; }
.rank-dot { width:10px; height:10px; border-radius:50%; display:inline-block; flex-shrink:0; }
.avatar-sm { width:28px; height:28px; border-radius:50%; object-fit:cover; background:var(--panel-2); flex-shrink:0; cursor:pointer; }
.dist-bar { height:6px; border-radius:3px; transition:width 0.6s ease; }
.sort-btn { cursor:pointer; user-select:none; }
.sort-btn:hover { color:var(--signal); }
.banned-row { background:color-mix(in srgb, var(--loss) 6%, transparent); }
.banned-row td input { color:var(--loss) !important; }
.profile-sidepanel { position:fixed; top:0; right:0; bottom:0; width:420px; max-width:100vw; z-index:100; background:var(--panel); border-left:1px solid var(--line); transform:translateX(100%); visibility:hidden; transition:transform 0.3s ease, visibility 0s linear 0.3s; overflow-y:auto; }
.profile-sidepanel.open { transform:translateX(0); visibility:visible; transition:transform 0.3s ease, visibility 0s; }
.profile-backdrop { position:fixed; inset:0; z-index:99; background:var(--scrim); opacity:0; pointer-events:none; visibility:hidden; transition:opacity 0.3s ease, visibility 0s linear 0.3s; }
.profile-backdrop.open { opacity:1; pointer-events:auto; visibility:visible; transition:opacity 0.3s ease, visibility 0s; }
.pagination-btn { min-width:32px; text-align:center; }
</style>

<div class="mb-5 flex flex-wrap items-end justify-between gap-3">
  <div>
    <p class="eyebrow">Admin</p>
    <h1 class="display text-[32px] leading-none sm:text-[38px]">Admin panel</h1>
  </div>
  <div class="flex flex-wrap gap-2">
    <a href="/" class="btn btn-sm">View site</a>
    <a href="/report" class="btn btn-sm">Report match</a>
    <a href="/leaderboard" class="btn btn-sm">Leaderboard</a>
    <a href="/docs" target="_blank" rel="noopener" class="btn btn-sm">API docs</a>
  </div>
</div>

<div class="sticky z-30 mb-4 flex seg" id="adminTabs" style="top:57px;background:var(--bg)" role="tablist" aria-label="Admin sections">
  <button class="seg-item is-active" type="button" data-admin-tab="overview">Overview</button>
  <button class="seg-item" type="button" data-admin-tab="players">Players</button>
  <button class="seg-item" type="button" data-admin-tab="tournaments">Tourneys</button>
  <button class="seg-item" type="button" data-admin-tab="seasons">Seasons</button>
  <button class="seg-item" type="button" data-admin-tab="logs">Logs</button>
</div>

<div id="toast" class="fixed bottom-6 right-6 z-50 hidden card px-5 py-3 text-sm shadow-xl border transition-all" style="border-color:var(--line-strong);"></div>

<div id="confirmModal" class="fixed inset-0 hidden items-center justify-center" style="z-index:120;background:var(--scrim);">
  <div class="card p-8 w-full max-w-sm mx-4">
    <h3 id="modalTitle" class="text-lg font-bold text-ink mb-2"></h3>
    <p id="modalDesc" class="text-xs text-ink3 mb-5"></p>
    <div id="modalDanger" class="hidden mb-4">
      <label class="block text-[10px] font-semibold uppercase tracking-widest mb-2" style="color:var(--loss);">Type <span class="font-bold">CONFIRM</span> to proceed:</label>
      <input id="modalConfirmInput" class="w-full bg-transparent border rounded-lg px-4 py-3 text-sm text-ink" style="border-color:color-mix(in srgb, var(--loss) 35%, transparent);" placeholder="Type CONFIRM">
    </div>
    <div class="flex gap-2 justify-end">
      <button id="modalCancel" class="btn text-xs">Cancel</button>

</div>

<div id="textPromptModal" class="fixed inset-0 hidden items-center justify-center" style="z-index:120;background:var(--scrim);">
  <div class="card mx-4 w-full max-w-md p-6">

      <button id="textPromptOk" class="btn btn-pink text-xs">Add players</button>

<div id="matchEditModal" class="fixed inset-0 hidden items-center justify-center" style="z-index:120;background:var(--scrim);">

<div id="profileBackdrop" class="profile-backdrop"></div>
<div id="profilePanel" class="profile-sidepanel"></div>

<div id="adminContent">
  <div class="card p-8 animate-pulse"><div class="h-5 bg-panel2 rounded w-3/4 mb-3"></div><div class="h-5 bg-panel2 rounded w-1/2"></div></div>
</div>

<script>
let modalResolve, modalReject;
// Cancelling a confirmation aborts the awaited action; that rejection is expected.
window.addEventListener('unhandledrejection', e => { if (e.reason && e.reason.name === 'ModalCancelled') e.preventDefault(); });
function cancelModal() { if (modalReject) modalReject(Object.assign(new Error('cancelled'), { name: 'ModalCancelled' })); }
function toast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.borderColor = type === 'success' ? 'color-mix(in srgb, var(--win) 30%, transparent)' : 'color-mix(in srgb, var(--loss) 35%, transparent)';
  t.style.background = type === 'success' ? 'color-mix(in srgb, var(--win) 8%, transparent)' : 'color-mix(in srgb, var(--loss) 8%, transparent)';
  t.style.color = type === 'success' ? 'var(--win)' : 'var(--loss)';
  t.classList.remove('hidden');
  setTimeout(() => t.classList.add('hidden'), 3500);
}
function showModal(title, desc, dangerous) {
  return new Promise((resolve, reject) => {
    modalResolve = resolve; modalReject = reject;
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalDesc').textContent = desc;
    const dangerDiv = document.getElementById('modalDanger');
    const input = document.getElementById('modalConfirmInput');
    const btn = document.getElementById('modalConfirm');
    if (dangerous) {
      dangerDiv.classList.remove('hidden');
      input.value = ''; btn.disabled = true;
      input.oninput = () => { const ok = input.value.trim().toUpperCase() === 'CONFIRM'; btn.disabled = !ok; btn.style.background = ok ? 'color-mix(in srgb, var(--loss) 15%, transparent)' : 'transparent'; };
    } else { dangerDiv.classList.add('hidden'); btn.disabled = false; }
    document.getElementById('confirmModal').classList.remove('hidden');
    document.getElementById('confirmModal').classList.add('flex');
  });
}
document.getElementById('modalCancel').addEventListener('click', () => { document.getElementById('confirmModal').classList.add('hidden'); document.getElementById('confirmModal').classList.remove('flex'); cancelModal(); });
document.getElementById('modalConfirm').addEventListener('click', () => { document.getElementById('confirmModal').classList.add('hidden'); document.getElementById('confirmModal').classList.remove('flex'); if (modalResolve) modalResolve(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !document.getElementById('confirmModal').classList.contains('hidden')) { document.getElementById('confirmModal').classList.add('hidden'); document.getElementById('confirmModal').classList.remove('flex'); cancelModal(); }});

function showTextPrompt(title) {
  const modal = $('textPromptModal');
  const input = $('textPromptInput');
  $('textPromptTitle').textContent = title;
  input.value = '';
  modal.classList.remove('hidden');
  modal.classList.add('flex');
  return new Promise((resolve) => {
    function close(value) {
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      $('textPromptOk').onclick = null;
      $('textPromptCancel').onclick = null;
      modal.onclick = null;
      document.removeEventListener('keydown', onKey);
      resolve(value);
    }
    function onKey(e) { if (e.key === 'Escape') close(null); }
    $('textPromptOk').onclick = () => close(input.value);
    $('textPromptCancel').onclick = () => close(null);
    modal.onclick = (e) => { if (e.target === modal) close(null); };
    document.addEventListener('keydown', onKey);
    input.focus();
  });
}

const RANKS = [
  ["Bronze I",0,"#7A4520"],["Bronze II",100,"#96541A"],["Bronze III",200,"#B8682A"],["Bronze IV",300,"#CD7F32"],["Bronze V",400,"#E09A50"],
  ["Silver I",500,"#787878"],["Silver II",600,"#909090"],["Silver III",700,"#A8A8A8"],["Silver IV",800,"#C0C0C0"],["Silver V",900,"#D8D8D8"],
  ["Gold I",1000,"#B8960C"],["Gold II",1100,"#CCA800"],["Gold III",1200,"#FFD700"],["Gold IV",1300,"#FFE033"],["Gold V",1400,"#FFEA70"],
  ["Platinum I",1500,"#0088AA"],["Platinum II",1600,"#00AACC"],["Platinum III",1700,"#00C8E8"],["Platinum IV",1800,"#00E5FF"],["Platinum V",1900,"#66F0FF"],
  ["Emerald I",2000,"#007A30"],["Emerald II",2100,"#009940"],["Emerald III",2200,"#00BB50"],["Emerald IV",2300,"#00E676"],["Emerald V",2400,"#33FF8A"],
  ["Diamond I",2500,"#6600CC"],["Diamond II",2600,"#7B35FF"],["Diamond III",2700,"#9955FF"],["Diamond IV",2800,"#B388FF"],["Diamond V",2900,"#CCAAFF"],
  ["Champion",3000,"#E8197D"]
];
function getRank(elo) { for (let i=RANKS.length-1;i>=0;i--) { if (elo>=RANKS[i][1]) return RANKS[i]; } return ["Unranked",0,"var(--ink-3)"]; }

let allPlayers = [], allRatingData = {}, ownerIds = [], currentPage = 1, pageSize = 20, sortField = null, sortDir = 'asc', searchQuery = '', rankFilter = '', bannedFilter = 'all';

const $ = id => document.getElementById(id);

async function loadAdmin() {
  $('adminContent').innerHTML = '';
  let stats = { total_players:0, total_matches:0, active_players:0, total_ratings:0, avg_elo:0, highest_elo:0, distribution:[], owner_ids:[] };
  try { const sr = await fetch('/api/admin/stats'); if (sr.ok) stats = await sr.json(); } catch {}
  ownerIds = stats.owner_ids || [];

  let matches = [];
  try { const mr = await fetch('/api/admin/matches?limit=30'); if (mr.ok) matches = await mr.json(); } catch {}

  let auditLog = [];
  try { const ar = await fetch('/api/admin/audit-log?limit=100'); if (ar.ok) auditLog = await ar.json(); } catch {}

  let integrity = { repeat_pairings: [], lopsided: [], reporter_volume: [] };
  try { const ir = await fetch('/api/admin/integrity'); if (ir.ok) integrity = await ir.json(); } catch {}

  allPlayers = await (await fetch('/api/players')).json();

  allRatingData = {};
  for (const p of allPlayers) {
    try {
      const d = await (await fetch('/api/players/'+p.id)).json();
      const r = d.ratings.find(r=>r.format==='1v1')||{elo:0,wins:0,losses:0,matches_played:0};
      allRatingData[p.id] = r;
    } catch { allRatingData[p.id] = {elo:0,wins:0,losses:0,matches_played:0}; }
  }

  renderStats(stats);
  renderDistribution(stats);
  renderManagement();
  renderIntegrity(integrity);
  renderAddPlayer();
  renderPlayerTable();
  renderAuditLog(auditLog);
  renderMatches(matches);
  wireGlobal();
  setupAdminTabs();
}

function renderStats(s) {
  $('adminContent').insertAdjacentHTML('beforeend', `<div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3 mb-6" id="statsRow">
    <div class="card p-4 text-center animate-slide-up stagger-1"><div class="text-lg font-extrabold text-ink">${s.total_players}</div><div class="text-[10px] text-ink3 uppercase tracking-widest mt-1">Players</div></div>
    <div class="card p-4 text-center animate-slide-up stagger-2"><div class="text-lg font-extrabold text-ink">${s.total_matches}</div><div class="text-[10px] text-ink3 uppercase tracking-widest mt-1">Matches</div></div>
    <div class="card p-4 text-center animate-slide-up stagger-3"><div class="text-lg font-extrabold text-ink">${s.total_ratings}</div><div class="text-[10px] text-ink3 uppercase tracking-widest mt-1">Ratings</div></div>
    <div class="card p-4 text-center animate-slide-up stagger-4"><div class="text-lg font-extrabold text-ink">${s.active_players}</div><div class="text-[10px] text-ink3 uppercase tracking-widest mt-1">Active (7d)</div></div>
    <div class="card p-4 text-center animate-slide-up stagger-5"><div class="text-lg font-extrabold text-ink">${s.avg_elo}</div><div class="text-[10px] text-ink3 uppercase tracking-widest mt-1">Avg ELO</div></div>
    <div class="card p-4 text-center animate-slide-up stagger-5"><div class="text-lg font-extrabold text-ink">${s.highest_elo}</div><div class="text-[10px] text-ink3 uppercase tracking-widest mt-1">Highest ELO</div></div>
  </div>`);
}

function renderDistribution(s) {
  if (!s.distribution || !s.distribution.length) return;
  const total = s.distribution.reduce((sum, d) => sum + d.count, 0) || 1;
  let bar = '';
  for (const d of s.distribution) {
    const pct = (d.count / total * 100);
    bar += `<div style="width:${pct}%;background:${d.color}" title="${d.rank}: ${d.count}"></div>`;
  }

  // Walk the canonical rank list so every tier and every level appears, in order,
  // even when nobody currently holds it.
  const counts = {};
  for (const d of s.distribution) counts[d.rank] = d.count;
  const tiers = [];
  for (const [name, , color] of RANKS) {
    const parts = name.split(' ');
    const tierName = parts[0];
    const level = parts.slice(1).join(' ');
    let tier = tiers.find((t) => t.name === tierName);
    if (!tier) { tier = { name: tierName, color, count: 0, levels: [] }; tiers.push(tier); }
    tier.color = color; // the highest level's swatch is the brightest for the tint
    const count = counts[name] || 0;
    tier.levels.push({ name, level, count });
    tier.count += count;
  }
  let legend = '';
  for (const t of tiers) {
    const pct = total ? Math.round(t.count / total * 100) : 0;
    const levels = t.levels.some((l) => l.level)
      ? `<span class="grid flex-1 grid-cols-5 gap-x-1">` + t.levels.map((l) => {
          const empty = l.count === 0;
          return `<span class="num flex items-baseline gap-1 text-[11px] ${empty ? 'text-ink3' : 'text-ink2'}"${empty ? ' style="opacity:.4"' : ''} title="${l.name}: ${l.count} rating${l.count === 1 ? '' : 's'}"><span class="text-ink3">${l.level}</span><span>${l.count}</span></span>`;
        }).join('') + `</span>`
      : '<span class="flex-1"></span>';
    legend += `<div class="flex flex-wrap items-center gap-x-3 gap-y-1 py-2" style="border-top:1px solid var(--line)">
      <span class="flex w-20 shrink-0 items-center gap-2 sm:w-24"><span class="rank-dot" style="background:${t.color}"></span><span class="text-[12px] font-semibold text-ink">${t.name}</span></span>
      <span class="order-3 w-full sm:order-none sm:w-auto sm:max-w-[360px] sm:flex-1">${levels}</span>
      <span class="order-2 ml-auto shrink-0 sm:order-none"><span class="num text-[11px] text-ink3">${t.count} · ${pct}%</span></span>
    </div>`;
  }

  let html = `<div class="card p-5 mb-5 animate-slide-up" id="distSection">
    <div class="section-head mb-3"><h2 class="text-sm font-bold text-ink">Rating distribution</h2><span class="micro">${total} ratings</span></div>
    <div class="flex h-3 w-full overflow-hidden rounded-sm" style="background:var(--panel-2);">${bar}</div>
    <div class="mt-3">${legend}</div>
  </div>`;
  $('adminContent').insertAdjacentHTML('beforeend', html);
}

function renderIntegrity(data) {
  const repeat = data.repeat_pairings || [];
  const lopsided = data.lopsided || [];
  const volume = data.reporter_volume || [];
  const empty = !repeat.length && !lopsided.length && !volume.length;
  let html = `<div class="card p-5 mb-5 animate-slide-up" id="integritySection">
    <div class="section-head mb-3"><h2 class="text-sm font-bold text-ink">Integrity checks</h2><span class="micro">Last 7 days</span></div>`;
  if (empty) {
    html += '<p class="text-xs text-ink3">No anomalies found. Repeated pairings, one-sided records, and reporter bursts appear here.</p>';
  } else {
    if (repeat.length) {
      html += '<div class="mb-4"><div class="micro mb-2">Repeated pairings · 24h</div><div class="space-y-1">' +
        repeat.map((r) => `<div class="flex items-center justify-between gap-3 border-b py-1.5" style="border-color:var(--line)"><span class="truncate text-[12px] text-ink2">${window.esc(r.pair)}</span><span class="num shrink-0 text-[11px]" style="color:var(--warn)">${r.count} in 24h</span></div>`).join('') +
        '</div></div>';
    }
    if (lopsided.length) {
      html += '<div class="mb-4"><div class="micro mb-2">One-sided records</div><div class="space-y-1">' +
        lopsided.map((r) => `<div class="flex items-center justify-between gap-3 border-b py-1.5" style="border-color:var(--line)"><span class="truncate text-[12px] text-ink2">${window.esc(r.pair)}</span><span class="micro shrink-0">${window.esc(r.winner)} · ${r.matches}</span></div>`).join('') +
        '</div></div>';
    }
    if (volume.length) {
      html += '<div><div class="micro mb-2">Reporter bursts · 1h</div><div class="space-y-1">' +
        volume.map((r) => `<div class="flex items-center justify-between gap-3 border-b py-1.5" style="border-color:var(--line)"><span class="text-[12px] text-ink2">${window.esc(r.reporter)}</span><span class="num text-[11px]" style="color:var(--warn)">${r.count} reports</span></div>`).join('') +
        '</div></div>';
    }
  }
  html += '</div>';
  $('adminContent').insertAdjacentHTML('beforeend', html);
}

function renderManagement() {
  $('adminContent').insertAdjacentHTML('beforeend', `<div class="card p-5 mb-5 animate-slide-up" id="mgmtSection"><h2 class="text-sm font-bold text-ink mb-1">Leaderboard Management</h2><p class="text-[10px] text-ink3 uppercase tracking-widest mb-4">Clear or reset all ratings</p>
    <div class="flex flex-wrap gap-2">
      <button class="btn btn-danger text-xs" data-action="clear-leaderboard">Clear Leaderboard</button>
      <button class="btn text-xs" data-action="reset-leaderboard">Reset Rankings</button>
    </div>
  </div>`);
  $('adminContent').insertAdjacentHTML('beforeend', `<div class="card p-5 mb-5 animate-slide-up" id="tournamentSection"><h2 class="text-sm font-bold text-ink mb-1">Tournament Management</h2><p class="text-[10px] text-ink3 uppercase tracking-widest mb-4">Create and manage tournaments</p>
    <div class="flex flex-wrap gap-2 mb-3">
      <input id="tmtName" class="bg-transparent border border-line rounded-lg px-3 py-2 text-xs text-ink placeholder-gray-600" placeholder="Tournament name..." style="flex:1;min-width:160px;">
      <select id="tmtFormat" class="bg-transparent border border-line rounded-lg px-3 py-2 text-xs text-ink">
        <option value="1v1">1v1</option><option value="2v2">2v2</option>
      </select>
      <button id="createTmtBtn" class="btn btn-pink text-xs">Create</button>
    </div>
    <div id="tmtList" class="space-y-1.5"></div>
  </div>`);
  $('adminContent').insertAdjacentHTML('beforeend', `<div class="card p-5 mb-5 animate-slide-up" id="seasonSection"><h2 class="text-sm font-bold text-ink mb-1">Season Management</h2><p class="text-[10px] text-ink3 uppercase tracking-widest mb-4">Close the 1v1 season to archive its standings and reset 1v1 ELOs. Other formats keep their ratings.</p>
    <div class="flex flex-wrap gap-2">

function renderPlayerTable() {
  // Filter + sort
  let filtered = allPlayers.filter(p => {
    if (searchQuery && !p.username.toLowerCase().includes(searchQuery.toLowerCase())) return false;
    if (rankFilter) {
      const r = allRatingData[p.id];
      const rank = getRank(r ? r.elo : 0);
      if (rank[0] !== rankFilter) return false;
    }
    if (bannedFilter === 'banned' && !p.is_banned) return false;
    if (bannedFilter === 'unbanned' && p.is_banned) return false;
    return true;
  });

  if (sortField) {
    filtered.sort((a, b) => {
      const ra = allRatingData[a.id] || {elo:0,wins:0,losses:0};
      const rb = allRatingData[b.id] || {elo:0,wins:0,losses:0};
      let va, vb;
      if (sortField === 'elo') { va = ra.elo; vb = rb.elo; }
      else if (sortField === 'wins') { va = ra.wins; vb = rb.wins; }
      else if (sortField === 'losses') { va = ra.losses; vb = rb.losses; }
      else if (sortField === 'created_at') { va = new Date(a.created_at); vb = new Date(b.created_at); }
      else { va = a.username; vb = b.username; }
      if (va < vb) return sortDir === 'asc' ? -1 : 1;
      if (va > vb) return sortDir === 'asc' ? 1 : -1;
      return 0;
    });
  }

  const totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));
  if (currentPage > totalPages) currentPage = totalPages;
  const start = (currentPage - 1) * pageSize;
  const pagePlayers = filtered.slice(start, start + pageSize);

  const sortIcon = (f) => sortField === f ? (sortDir === 'asc' ? ' ▲' : ' ▼') : '';

  let html = `<div class="card p-5 animate-slide-up" id="playerTableCard"><h2 class="text-sm font-bold text-ink mb-1">Manage Players</h2><p class="text-[10px] text-ink3 uppercase tracking-widest mb-4">Inline edit player data</p>`;

  // Search / Filter bar
  html += `<div class="flex flex-wrap gap-2 mb-4 items-center">

    <select id="rankFilter" class="bg-transparent border border-line rounded-lg px-3 py-2.5 text-sm text-ink"><option value="">All Ranks</option>${RANKS.map(r => `<option value="${r[0]}" ${rankFilter===r[0]?'selected':''}>${r[0]}</option>`).join('')}</select>
    <select id="bannedFilter" class="bg-transparent border border-line rounded-lg px-3 py-2.5 text-sm text-ink"><option value="all" ${bannedFilter==='all'?'selected':''}>All Players</option><option value="unbanned" ${bannedFilter==='unbanned'?'selected':''}>Active Only</option><option value="banned" ${bannedFilter==='banned'?'selected':''}>Banned Only</option></select>
  </div>`;

  // Sortable column headers
  const sortable = (label, field) => `<th class="py-3 px-2 text-left sort-btn text-[10px] font-semibold text-ink3 uppercase tracking-widest" data-sort="${field}">${label}${sortIcon(field)}</th>`;

  html += `<div class="hidden overflow-x-auto md:block"><table class="w-full"><thead><tr style="border-bottom:1px solid var(--line);">
    <th class="py-3 px-2 w-8 sm:w-10"><input type="checkbox" id="selectAll" class="checkbox"></th>

      <td class="py-2.5 px-2 text-right"><div class="flex items-center justify-end gap-1">

        <button class="delete-btn text-[10px] font-bold w-14 py-1.5 rounded-lg transition-all" style="background:var(--loss);color:#fff;border:none;" data-id="${p.id}">Delete</button>

  html += '</tbody></table></div>';

  // Phone cards: the wide table cannot fit, so show a compact list instead.

  for (const p of pagePlayers) {

    const rank = [r.rank_title || getRank(r.elo)[0], 0, r.rank_color || getRank(r.elo)[2]];
    const isOwner = ownerIds.includes(p.discord_id);
    const banned = p.is_banned;
    const rankIcon = rank[0].toLowerCase().replace(/ /g, '_');
    html += `<div class="border p-3 ${banned?'banned-row':''}" style="border-color:var(--line)" data-id="${p.id}">
      <div class="flex items-start gap-3">

    </tr></thead><tbody>`;
  for (const m of matches) {
    html += `<tr style="border-bottom:1px solid var(--line);">

      <td class="py-2.5 px-3 text-sm text-ink">${m.team_a_name}</td>
      <td class="py-2.5 px-3 text-sm font-bold" style="color:${m.winner_name===m.team_a_name?'var(--win)':'var(--loss)'}">${m.score_a} : ${m.score_b}</td>
      <td class="py-2.5 px-3 text-sm text-ink">${m.team_b_name}</td>
      <td class="py-2.5 px-3 text-[10px] font-semibold" style="color:${m.winner_name==='Draw'?'var(--ink-3)':'var(--win)'}">${m.winner_name||'—'}</td>
      <td class="py-2.5 px-3 text-xs text-ink3 hidden md:table-cell">${new Date(m.played_at).toLocaleDateString()}</td>
      <td class="py-2.5 px-3 text-right"><div class="flex gap-1 justify-end"><button class="match-edit text-xs font-bold px-3 py-2 rounded-lg transition-all" style="background:var(--signal-soft);color:var(--signal);border:none;" data-id="${m.id}" data-score-a="${m.score_a}" data-score-b="${m.score_b}" data-winner="${m.winner_name===m.team_a_name?'a':'b'}" data-teama="${window.esc(m.team_a_name)}" data-teamb="${window.esc(m.team_b_name)}">Edit</button><button class="match-delete text-xs font-bold px-3 py-2 rounded-lg transition-all" style="background:var(--loss);color:#fff;border:none;" data-id="${m.id}">Remove</button></div></td>
    </tr>`;
  }
  html += '</tbody></table></div></div>';
  $('adminContent').insertAdjacentHTML('beforeend', html);
  document.querySelectorAll('.match-delete').forEach(btn => btn.addEventListener('click', async () => {
    await showModal('Delete Match','Remove this match permanently?',true);
    const r = await window.apiFetch('/api/admin/matches/'+btn.dataset.id,{method:'DELETE'});
    if (r.ok) { toast('Match deleted.','success'); location.reload(); } else toast('Failed.','error');
  }));
  wireMatchEdit();
}

function wireMatchEdit() {
  document.querySelectorAll('.match-edit').forEach(btn => btn.addEventListener('click', () => {
    const id = btn.dataset.id;
    $('matchScoreA').value = btn.dataset.scoreA;
    $('matchScoreB').value = btn.dataset.scoreB;
    $('matchWinner').value = btn.dataset.winner;
    $('matchEditInfo').textContent = `${btn.dataset.teama} vs ${btn.dataset.teamb}`;
    $('matchEditModal').classList.remove('hidden');
    $('matchEditModal').classList.add('flex');
    $('matchEditConfirm').onclick = async () => {
      const scoreA = parseInt($('matchScoreA').value);
      const scoreB = parseInt($('matchScoreB').value);
      const winner = $('matchWinner').value;
      if (isNaN(scoreA) || isNaN(scoreB)) { toast('Enter valid scores.','error'); return; }
      const r = await window.apiFetch('/api/admin/matches/'+id, {method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify({score_a:scoreA, score_b:scoreB, winner})});
      if (r.ok) { toast('Match updated.','success'); $('matchEditModal').classList.add('hidden'); $('matchEditModal').classList.remove('flex'); location.reload(); } else { const e = await r.json(); toast(e.detail||'Failed.','error'); }
    };
  }));
  const cancel = $('matchEditCancel');
  if (cancel) cancel.addEventListener('click', () => { $('matchEditModal').classList.add('hidden'); $('matchEditModal').classList.remove('flex'); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { $('matchEditModal').classList.add('hidden'); $('matchEditModal').classList.remove('flex'); }});
}

function renderAuditLog(log) {
  const actions = [...new Set(log.map((e) => e.action))].sort();
  let html = `<div class="card p-5 mt-5 animate-slide-up" id="auditSection"><div class="flex items-center justify-between mb-1">
    <h2 class="text-sm font-bold text-ink">Audit Log</h2>
    <button id="clearAuditBtn" class="btn btn-danger text-xs">Clear Log</button>
  </div><p class="text-[10px] text-ink3 uppercase tracking-widest mb-4">All admin actions recorded</p>`;
  if (log.length) {
    html += `<div class="mb-3 flex flex-col gap-2 sm:flex-row">
      <input id="auditSearch" class="field sm:flex-1" placeholder="Search admin, target or details" aria-label="Search audit log" autocomplete="off">
      <select id="auditAction" class="field sm:w-56" aria-label="Filter by action">
        <option value="">All actions</option>
        ${actions.map((a) => `<option value="${window.esc(a)}">${window.esc(a)}</option>`).join('')}
      </select>
    </div>`;
  }
  html += '<div id="auditList"></div></div>';
  $('adminContent').insertAdjacentHTML('beforeend', html);

  function renderRows() {
    const list = $('auditList');
    if (!list) return;
    if (!log.length) {
      list.innerHTML = '<p class="text-xs text-ink3">No entries yet.</p>';
      return;
    }
    const query = ($('auditSearch')?.value || '').toLowerCase().trim();
    const action = $('auditAction')?.value || '';
    const rows = log.filter((e) => {
      if (action && e.action !== action) return false;
      if (!query) return true;
      return [e.admin_name, e.action, e.target_name, e.details].some((v) => (v || '').toLowerCase().includes(query));
    });
    if (!rows.length) {
      list.innerHTML = '<p class="py-6 text-center text-xs text-ink3">No matching entries.</p>';
      return;
    }
    let table = `<div class="overflow-x-auto max-h-80 overflow-y-auto"><table class="w-full"><thead><tr class="text-[10px] font-semibold text-ink3 uppercase tracking-widest" style="border-bottom:1px solid var(--line);">
      <th class="py-2 px-3 text-left">Time</th><th class="py-2 px-3 text-left">Admin</th><th class="py-2 px-3 text-left">Action</th><th class="py-2 px-3 text-left hidden sm:table-cell">Target</th><th class="py-2 px-3 text-left hidden md:table-cell">Details</th>
    </tr></thead><tbody>`;
    for (const e of rows) {
      const date = new Date(e.created_at);
      const timeStr = date.toLocaleDateString() + ' ' + date.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
      const tone = e.action.includes('banned') || e.action.includes('delete') ? 'var(--loss)' : e.action.includes('granted') ? 'var(--win)' : 'var(--ink-2)';
      table += `<tr style="border-bottom:1px solid var(--line);">
        <td class="py-1.5 px-3 text-[10px] text-ink3 whitespace-nowrap">${timeStr}</td>
        <td class="py-1.5 px-3 text-xs text-ink">${window.esc(e.admin_name)}</td>
        <td class="py-1.5 px-3 text-xs" style="color:${tone}">${window.esc(e.action)}</td>
        <td class="py-1.5 px-3 text-xs text-ink2 hidden sm:table-cell">${window.esc(e.target_name)||'—'}</td>
        <td class="py-1.5 px-3 text-[10px] text-ink3 hidden md:table-cell max-w-[200px] truncate">${window.esc(e.details)||'—'}</td>
      </tr>`;
    }
    table += '</tbody></table></div>';
    list.innerHTML = table;
  }

  if ($('auditSearch')) $('auditSearch').addEventListener('input', renderRows);
  if ($('auditAction')) $('auditAction').addEventListener('change', renderRows);
  renderRows();

  const clearBtn = $('clearAuditBtn');
  if (clearBtn) clearBtn.addEventListener('click', async () => {
    await showModal('Clear Audit Log','Delete all audit log entries permanently?',true);
    const r = await window.apiFetch('/api/admin/clear-audit-log',{method:'POST'});
    if (r.ok) { toast('Audit log cleared.','success'); location.reload(); } else toast('Failed.','error');
  });
}

    else if (a === 'reset-leaderboard') { await showModal('Reset Rankings','Set all ELO/wins/losses to zero.',true); const r = await window.apiFetch('/api/admin/reset-leaderboard',{method:'POST'}); r.ok ? (toast('Rankings reset.','success'),location.reload()) : toast('Failed.','error'); }

  const addInput = $('addPlayerInput'), addBtn = $('addPlayerBtn');
  if (addInput && addBtn) {
    async function add() { const name = addInput.value.trim(); if (!name) return; try { const r = await window.apiFetch('/api/players',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:name})}); if (r.ok) { toast('Player created.','success'); addInput.value = ''; location.reload(); } else { const e = await r.json(); toast(e.detail||'Failed.','error'); } } catch { toast('Error.','error'); } }
    addBtn.addEventListener('click', add);
    addInput.addEventListener('keydown', e => { if (e.key==='Enter') add(); });
  }

  // Tournament management
  const createTmtBtn = $('createTmtBtn');
  if (createTmtBtn) createTmtBtn.addEventListener('click', async () => {
    const name = $('tmtName').value.trim();
    const format = $('tmtFormat').value;
    if (!name) { toast('Enter a name.','error'); return; }
    const r = await window.apiFetch('/api/tournaments', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name,format})});
    if (r.ok) { const d = await r.json(); toast(`Tournament created: ${d.name}`,'success'); loadTmtList(); $('tmtName').value=''; } else { const e=await r.json(); toast(e.detail||'Failed.','error'); }
  });

  async function loadTmtList() {
    const list = await (await fetch('/api/tournaments')).json();
    const el = $('tmtList');
    el.innerHTML = list.slice(0,20).map(t => {
      const canStart = t.status === 'pending';
      const canAdd = t.status === 'pending';
      const canComplete = t.status === 'active';
      return `<div class="flex flex-col gap-2 text-xs card px-3 py-2.5 sm:flex-row sm:items-center sm:justify-between" style="border-color:var(--line);">
          <span class="truncate text-ink sm:min-w-[120px]">${window.esc(t.name)}</span>
        <div class="flex flex-wrap items-center gap-1.5 sm:justify-end">
          <span class="text-ink3">${t.status}</span>
          ${canAdd ? `<button class="btn text-xs px-3 py-2 add-players-btn" data-id="${t.id}" style="color:var(--warn);border-color:color-mix(in srgb, var(--warn) 30%, transparent);">+Players</button>` : ''}
          ${canStart ? `<button class="btn text-xs px-3 py-2 start-tmt-btn" data-id="${t.id}" style="color:var(--win);border-color:color-mix(in srgb, var(--win) 30%, transparent);">Start</button>` : ''}
          ${canComplete ? `<button class="btn text-xs px-3 py-2 complete-tmt-btn" data-id="${t.id}" style="color:var(--signal);border-color:var(--signal-line);">Complete</button>` : ''}
          <a href="/tournament/${t.id}" class="btn text-xs px-3 py-2">View</a>
          <button class="btn text-xs px-3 py-2 delete-tmt-btn" data-id="${t.id}" style="color:var(--loss);border-color:color-mix(in srgb, var(--loss) 35%, transparent);">Delete</button>
        </div>
      </div>`;
    }).join('');
  }
  loadTmtList();

  // Tournament action buttons
  document.addEventListener('click', async (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    const id = btn.dataset.id;
    if (btn.classList.contains('start-tmt-btn')) {
      const r = await window.apiFetch(`/api/tournaments/${id}/start`, {method:'POST'});
      if (r.ok) { toast('Tournament started!','success'); loadTmtList(); } else { const e=await r.json(); toast(e.detail||'Failed.','error'); }
    } else if (btn.classList.contains('complete-tmt-btn')) {
      await showModal('Complete Tournament','Mark tournament as completed?', true);
      const r = await window.apiFetch(`/api/tournaments/${id}/complete`, {method:'POST', headers:{'Content-Type':'application/json'}, body:'{}'});
      if (r.ok) { toast('Tournament completed!','success'); loadTmtList(); } else { const e=await r.json(); toast(e.detail||'Failed.','error'); }
    } else if (btn.classList.contains('delete-tmt-btn')) {
      await showModal('Delete Tournament','Delete this tournament permanently?', true);
      const r = await window.apiFetch(`/api/tournaments/${id}`, {method:'DELETE'});
      if (r.ok) { toast('Deleted.','success'); loadTmtList(); } else { const e=await r.json(); toast(e.detail||'Failed.','error'); }
    } else if (btn.classList.contains('add-players-btn')) {
      const input = await showTextPrompt('Add players to tournament');
      if (!input) return;
      const names = input.split(/[\n,]+/).map(s => s.trim()).filter(Boolean);
      const ids = names.map(n => { const p = allPlayers.find(p => p.username.toLowerCase() === n.toLowerCase()); return p ? p.id : null; }).filter(Boolean);
      if (ids.length === 0) { toast('No matching players found.','error'); return; }
      const r = await window.apiFetch(`/api/tournaments/${id}/add-players`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({player_ids: ids})});
      if (r.ok) { toast(`${ids.length} players added.`,'success'); loadTmtList(); } else { const e=await r.json(); toast(e.detail||'Failed.','error'); }
    }
  });

  // Season management
  const closeSeasonBtn = $('closeSeasonBtn');
  if (closeSeasonBtn) closeSeasonBtn.addEventListener('click', async () => {
    const name = $('seasonName').value.trim() || 'Season';
    await showModal('Close Season',`Archive "${name}" and reset all ELOs?`, true);
    const r = await window.apiFetch('/api/admin/close-season', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name})});
    if (r.ok) { toast('Season closed.','success'); location.reload(); } else { const e=await r.json(); toast(e.detail||'Failed.','error'); }
  });

  // Bulk import
  const importBtn = $('importBtn');
  const importFile = $('importFileInput');
  if (importBtn && importFile) {
    importBtn.addEventListener('click', async () => {
      const file = importFile.files[0];
      if (!file) { toast('Select a .csv file.','error'); return; }
      const fd = new FormData();
      fd.append('file', file);
      const r = await window.apiFetch('/api/admin/players/import', {method:'POST', body:fd});
      if (r.ok) {
        const d = await r.json();
        const results = $('importResults');
        results.classList.remove('hidden');
        results.innerHTML = `<span style="color:var(--win);">Created: ${d.created}</span> · <span style="color:var(--warn);">Skipped: ${d.skipped}</span>${d.errors.length ? ' · <span style="color:var(--loss);">Errors: '+d.errors.join(', ')+'</span>' : ''}`;
        toast(`Import complete: ${d.created} created, ${d.skipped} skipped.`,'success');
        importFile.value = '';
        location.reload();
      } else { const e = await r.json(); toast(e.detail||'Failed.','error'); }
    });
  }
}

function wirePlayerTable() {
  document.querySelectorAll('.delete-btn').forEach(btn => {
    let confirm = false;
    btn.addEventListener('click', async () => {
      if (!confirm) { confirm = true; btn.textContent = 'Confirm?'; btn.style.background = 'var(--loss)'; setTimeout(() => { if (confirm) { confirm = false; btn.textContent = 'Delete'; btn.style.background = 'var(--loss)'; } }, 4000); return; }
      const id = btn.dataset.id;
      const r = await window.apiFetch('/api/players/'+id,{method:'DELETE'});
      if (r.ok) { toast('Deleted.','success'); location.reload(); } else { toast('Failed.','error'); confirm = false; btn.textContent = 'Delete'; btn.style.background = 'var(--loss)'; }
    });
  });
  document.querySelectorAll('.admin-toggle').forEach(btn => btn.addEventListener('click', async () => {
    const id = btn.dataset.id;
    const r = await window.apiFetch(`/api/admin/players/${id}/toggle-admin`, {method:'POST'});
    if (r.ok) { const d = await r.json(); toast(`${d.username} is now ${d.is_admin?'Admin':'User'}`, 'success'); location.reload(); } else { const e = await r.json(); toast(e.detail||'Failed.','error'); }
  }));
}

function wireSort() {
  document.querySelectorAll('[data-sort]').forEach(th => th.addEventListener('click', () => {
    const field = th.dataset.sort;
    if (sortField === field) sortDir = sortDir === 'asc' ? 'desc' : 'asc';
    else { sortField = field; sortDir = 'asc'; }
    currentPage = 1;
    refreshTable();
  }));
}

function wireFilters() {
  const search = $('searchInput');
  const rank = $('rankFilter');
  const banned = $('bannedFilter');
  let debounce;
  if (search) search.addEventListener('input', () => { clearTimeout(debounce); debounce = setTimeout(() => { searchQuery = search.value; currentPage = 1; refreshTable(); }, 200); });
  if (rank) rank.addEventListener('change', () => { rankFilter = rank.value; currentPage = 1; refreshTable(); });
  if (banned) banned.addEventListener('change', () => { bannedFilter = banned.value; currentPage = 1; refreshTable(); });
}

function wirePagination() {
  document.querySelectorAll('.page-btn').forEach(btn => btn.addEventListener('click', () => { currentPage = parseInt(btn.dataset.page); refreshTable(); }));
}

function wireSelectAll() {
  const selAll = $('selectAll');
  if (!selAll) return;
  selAll.addEventListener('change', () => { document.querySelectorAll('.player-checkbox').forEach(cb => cb.checked = selAll.checked); updateBulkBar(); });
  document.addEventListener('change', e => { if (e.target.classList.contains('player-checkbox')) updateBulkBar(); });
}

function updateBulkBar() {
  const checked = document.querySelectorAll('.player-checkbox:checked');
  const bar = $('bulkBar'), count = $('bulkCount');
  if (!bar || !count) return;
  if (checked.length === 0) { bar.classList.add('hidden'); return; }
  bar.classList.remove('hidden');
  count.textContent = checked.length + ' selected';
}

function wireBulkBar() {
  document.querySelectorAll('[data-bulk]').forEach(btn => btn.addEventListener('click', async () => {
    const action = btn.dataset.bulk;
    const ids = Array.from(document.querySelectorAll('.player-checkbox:checked')).map(cb => cb.value);
    if (!ids.length) return;
    let endpoint = '';
    if (action === 'reset') { await showModal('Reset Stats',`Reset stats for ${ids.length} player(s)?`,true); endpoint = '/api/admin/bulk/reset-stats'; }
    else if (action === 'delete') { await showModal('Delete Players',`Delete ${ids.length} player(s) permanently?`,true); endpoint = '/api/admin/bulk/delete'; }
    else if (action === 'clear-avatar') { await showModal('Clear Avatar',`Remove avatar for ${ids.length} player(s)?`,false); endpoint = '/api/admin/bulk/clear-avatar'; }
    if (!endpoint) return;
    try {
      const r = await window.apiFetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({player_ids:ids})});
      if (r.ok) { toast('Done.','success'); location.reload(); } else { try { const errData = await r.json(); toast(errData.detail||'Failed ('+r.status+')','error'); } catch(_) { toast('Failed ('+r.status+')','error'); } }
    } catch(netErr) { toast('Network error: '+netErr.message,'error'); console.error(netErr); }
  }));
}

function wireEloModal() {
  let targetId = null;
  document.querySelectorAll('.elo-adjust').forEach(btn => btn.addEventListener('click', () => {
    targetId = btn.dataset.id;
    $('eloModalTitle').textContent = `Adjust ELO for ${btn.dataset.name}`;
    $('eloModalPlayer').textContent = `Current ELO: ${btn.dataset.elo}`;
    $('eloAmount').value = '';
    $('eloReason').value = '';
    $('eloModal').classList.remove('hidden');
    $('eloModal').classList.add('flex');
  }));
  const cancel = $('eloCancel'), confirm = $('eloConfirm');
  if (cancel) cancel.addEventListener('click', () => { $('eloModal').classList.add('hidden'); $('eloModal').classList.remove('flex'); });
  if (confirm) confirm.addEventListener('click', async () => {
    const amount = parseInt($('eloAmount').value);
    const reason = $('eloReason').value.trim();
    if (isNaN(amount)) { toast('Enter a valid number.','error'); return; }
    if (!reason) { toast('Reason is required.','error'); return; }
    const r = await window.apiFetch(`/api/admin/players/${targetId}/adjust-elo`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({amount, reason})});
    if (r.ok) { toast('ELO adjusted.','success'); $('eloModal').classList.add('hidden'); $('eloModal').classList.remove('flex'); location.reload(); } else { const e = await r.json(); toast(e.detail||'Failed.','error'); }
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { $('eloModal').classList.add('hidden'); $('eloModal').classList.remove('flex'); }});
}

function wireAvatarUpload() {
  let targetId = null;
  document.querySelectorAll('.avatar-upload').forEach(btn => btn.addEventListener('click', () => {
    targetId = btn.dataset.id;
    $('avatarModalTitle').textContent = 'Upload Avatar';
    $('avatarModalPlayer').textContent = `Player ID: ${targetId}`;
    $('avatarFileInput').value = '';
    $('avatarModal').classList.remove('hidden');
    $('avatarModal').classList.add('flex');
  }));
  document.querySelectorAll('.avatar-remove').forEach(btn => btn.addEventListener('click', async () => {
    const id = btn.dataset.id;
    await showModal('Remove Avatar','Remove this player\'s avatar?',false);
    const r = await window.apiFetch(`/api/admin/players/${id}/avatar`, {method:'DELETE'});
    if (r.ok) { toast('Avatar removed.','success'); location.reload(); } else toast('Failed.','error');
  }));
  const cancel = $('avatarCancel'), confirm = $('avatarConfirm');
  if (cancel) cancel.addEventListener('click', () => { $('avatarModal').classList.add('hidden'); $('avatarModal').classList.remove('flex'); });
  if (confirm) confirm.addEventListener('click', async () => {
    const file = $('avatarFileInput').files[0];
    if (!file) { toast('Select a file.','error'); return; }
    const fd = new FormData(); fd.append('file', file);
    const r = await window.apiFetch(`/api/admin/players/${targetId}/avatar`, {method:'POST', body:fd});
    if (r.ok) { toast('Avatar uploaded.','success'); $('avatarModal').classList.add('hidden'); $('avatarModal').classList.remove('flex'); location.reload(); } else { const e = await r.json(); toast(e.detail||'Failed.','error'); }
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { $('avatarModal').classList.add('hidden'); $('avatarModal').classList.remove('flex'); }});
}

function wireBanToggles() {
  document.querySelectorAll('.ban-btn').forEach(btn => btn.addEventListener('click', async () => {
    const id = btn.dataset.id;
    await showModal('Toggle Ban','Change this player\'s ban status?',true);
    const r = await window.apiFetch(`/api/admin/players/${id}/toggle-ban`, {method:'POST'});
    if (r.ok) { const d = await r.json(); toast(`${d.username} ${d.is_banned?'banned':'unbanned'}`, 'success'); location.reload(); } else { const e = await r.json(); toast(e.detail||'Failed.','error'); }
  }));
}

function wireProfileClicks() {
  document.querySelectorAll('.open-profile').forEach(el => el.addEventListener('click', async () => {
    const id = el.dataset.id;
    openProfilePanel(id);
  }));
}

async function openProfilePanel(playerId) {
  const panel = $('profilePanel'), backdrop = $('profileBackdrop');
  panel.innerHTML = '<div class="p-6 text-center text-ink3 text-sm py-20">Loading...</div>';
  panel.classList.add('open'); backdrop.classList.add('open');

  try {
    const [pd, adminPd, matchesRes] = await Promise.all([
      fetch('/api/players/'+playerId).then(r => r.json()),
      fetch('/api/admin/players/'+playerId).then(r => r.json()),
      fetch('/api/matches?limit=50').then(r => r.json()),
    ]);

    const rating = pd.ratings.find(r=>r.format==='1v1')||{elo:0,wins:0,losses:0,matches_played:0};
    const rank = [rating.rank_title || getRank(rating.elo)[0], 0, rating.rank_color || getRank(rating.elo)[2]];
    const winRate = rating.matches_played > 0 ? (rating.wins / rating.matches_played * 100).toFixed(0) : '—';
    const rankIcon = rank[0].toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,'');

    // Find matches this player was in
    function isPlayerInTeam(pn, tn) { return tn ? tn.split(' + ').some(n => n.trim() === pn) : false; }
    const playerMatches = matchesRes.filter(m => isPlayerInTeam(pd.username, m.team_a_name) || isPlayerInTeam(pd.username, m.team_b_name));

    let html = `<div class="p-6" style="border-bottom:1px solid var(--line);">
      <div class="flex items-center gap-4 mb-4">
        ${pd.avatar_url ? `<img src="${window.esc(pd.avatar_url)}" class="w-16 h-16 rounded-full object-cover" style="border:2px solid ${rank[2]}">` : `<div class="w-16 h-16 rounded-full flex items-center justify-center text-xl font-bold" style="background:var(--panel-2);color:var(--ink-3);border:2px solid ${rank[2]};">${window.esc(pd.username[0]).toUpperCase()}</div>`}
        <div><h2 class="text-lg font-bold text-ink">${window.esc(pd.username)}</h2><span class="text-xs font-semibold rank-elo" style="--rank-color:${rank[2]}">${window.esc(rank[0])}</span></div>
      </div>
      <div class="grid grid-cols-3 gap-2 mb-4">
        <div class="card p-3 text-center"><div class="text-sm font-extrabold rank-elo" style="--rank-color:${rank[2]}">${rating.elo}</div><div class="text-[9px] text-ink3 uppercase tracking-widest mt-0.5">ELO</div></div>
        <div class="card p-3 text-center"><div class="text-sm font-extrabold" style="color:var(--win)">${winRate}%</div><div class="text-[9px] text-ink3 uppercase tracking-widest mt-0.5">Win Rate</div></div>
        <div class="card p-3 text-center"><div class="text-sm font-extrabold text-ink">${rating.matches_played}</div><div class="text-[9px] text-ink3 uppercase tracking-widest mt-0.5">Matches</div></div>
      </div>
      <div class="text-[10px] text-ink3">Joined ${new Date(pd.created_at).toLocaleDateString()}</div>
    </div>`;

    if (playerMatches.length) {
      html += `<div class="p-4"><h3 class="text-xs font-bold text-ink mb-3 uppercase tracking-widest">Recent Matches</h3>`;
      for (const m of playerMatches.slice(0, 20)) {
        const isTeamA = isPlayerInTeam(pd.username, m.team_a_name);
        const won = (isTeamA && m.winner_name === m.team_a_name) || (!isTeamA && m.winner_name === m.team_b_name) || isPlayerInTeam(pd.username, m.winner_name);
        const score = isTeamA ? `${m.score_a} : ${m.score_b}` : `${m.score_b} : ${m.score_a}`;
        html += `<div class="flex items-center justify-between py-2" style="border-bottom:1px solid var(--line);">
          <span class="text-xs" style="color:${won?'var(--win)':'var(--loss)'}">${won?'W':'L'}</span>
          <span class="text-xs text-ink2">${m.format}</span>
          <span class="text-xs font-bold text-ink">${score}</span>
          <span class="text-[10px] text-ink3">${new Date(m.played_at).toLocaleDateString()}</span>
        </div>`;
      }
      html += `</div>`;
    } else {
      html += `<div class="p-4 text-center text-xs text-ink3">No matches yet.</div>`;
    }

    const notes = adminPd.notes || '';
    html += `<div class="p-4" style="border-top:1px solid var(--line);"><h3 class="text-xs font-bold text-ink mb-3 uppercase tracking-widest">Admin Notes</h3>
      <textarea id="notesTextarea" class="w-full bg-transparent border rounded-lg px-4 py-3 text-sm text-ink resize-y" style="border-color:var(--line-strong);min-height:80px;" placeholder="Private notes...">${window.esc(notes)}</textarea>
      <button id="saveNotesBtn" class="btn btn-pink text-xs mt-2">Save Notes</button>
    </div>`;

    panel.innerHTML = `<div class="p-4 text-right"><button id="closePanel" class="btn text-xs">Close</button></div>${html}`;
    $('closePanel')?.addEventListener('click', closeProfilePanel);
    $('saveNotesBtn')?.addEventListener('click', async () => {
      const val = $('notesTextarea').value;
      const r = await window.apiFetch('/api/admin/players/'+playerId+'/notes', {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({notes: val})});
      if (r.ok) { toast('Notes saved.','success'); } else { toast('Failed to save notes.','error'); }
    });
  } catch {
    panel.innerHTML = '<div class="p-6 text-center text-loss text-sm">Failed to load.</div>';
  }
}

function closeProfilePanel() {
  $('profilePanel').classList.remove('open');
  $('profileBackdrop').classList.remove('open');
}
$('profileBackdrop').addEventListener('click', closeProfilePanel);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeProfilePanel(); });

function refreshTable() {
  const card = $('playerTableCard');
  if (card) card.remove();
  renderPlayerTable();
}

function setupAdminTabs() {
  const groups = {
    overview: ['statsRow', 'distSection', 'mgmtSection', 'integritySection'],
    players: ['addPlayerSection', 'bulkImportSection', 'playerTableCard', 'matchesSection'],
    tournaments: ['tournamentSection'],
    seasons: ['seasonSection'],
    logs: ['auditSection'],
  };
  const tabs = document.querySelectorAll('[data-admin-tab]');
  function apply(tab) {
    tabs.forEach(t => t.classList.toggle('is-active', t.dataset.adminTab === tab));
    Object.entries(groups).forEach(([group, ids]) => {
      ids.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.style.display = group === tab ? '' : 'none';
      });
    });
  }
  tabs.forEach(t => t.addEventListener('click', () => apply(t.dataset.adminTab)));
  window.addEventListener('resize', () => apply(document.querySelector('[data-admin-tab].is-active')?.dataset.adminTab || 'overview'));
  apply('overview');
}

loadAdmin();
</script>
