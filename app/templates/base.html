<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>clukzersLB</title>
    <link href="/static/css/tailwind.min.css" rel="stylesheet">
    <link href="/static/css/styles.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="nav-inner">
            <a href="/" class="nav-logo">clukzers<span class="rainbow">LB</span></a>
            <button class="mobile-menu-btn" onclick="toggleMobileMenu()" aria-label="Toggle menu">☰</button>
            <div class="nav-links" id="mobileMenu">
                <a href="/leaderboard" class="nav-link{% if request.path == '/leaderboard' %} active{% endif %}">Leaderboard</a>
                <a href="/tournaments" class="nav-link{% if request.path.startswith('/tournament') %} active{% endif %}">Tournaments</a>
                <a href="/seasons" class="nav-link{% if request.path == '/seasons' %} active{% endif %}">Seasons</a>
                <a href="/compare" class="nav-link{% if request.path == '/compare' %} active{% endif %}">Compare</a>
                {% if request.session.get("user") %}
                    <a href="/report" class="nav-link{% if request.path == '/report' %} active{% endif %}">Report</a>
                    {% if request.session.get("user").get("is_admin") %}
                        <a href="/admin" class="nav-link{% if request.path == '/admin' %} active{% endif %}">Admin</a>
                    {% endif %}
                    <div class="nav-divider"></div>
                    <a href="/profile" class="nav-user">
                        <span class="nav-user-name">{{ request.session.get("user").get("username") }}</span>
                    </a>
                    <a href="/auth/logout" class="nav-link" style="color:#ef4444;">Logout</a>
                {% else %}
                    <div class="nav-divider"></div>
                    <a href="/auth/login" class="nav-link" style="color:#e8197d;">Sign In</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="page-wrapper">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </div>

    <script>
    let csrfToken = null;
    (function retryFetchToken() {
        fetch('/api/csrf/token').then(r => r.json()).then(d => {
            csrfToken = d.csrf_token;
        }).catch(() => { setTimeout(retryFetchToken, 2000); });
    })();

    function toggleMobileMenu() {
        document.getElementById('mobileMenu').classList.toggle('open');
    }

    document.addEventListener('click', function(e) {
        var menu = document.getElementById('mobileMenu');
        var btn = document.querySelector('.mobile-menu-btn');
        if (menu.classList.contains('open') && !menu.contains(e.target) && !btn.contains(e.target)) {
            menu.classList.remove('open');
        }
    });

    window.getCsrfToken = function() { return csrfToken; };

    window.esc = function(s) {
        var d = document.createElement('div');
        d.textContent = s == null ? '' : String(s);
        return d.innerHTML;
    };

    window.apiFetch = function(url, opts = {}) {
        const token = csrfToken;
        if (token) {
            if (opts.body instanceof FormData) {
                opts.body.append('csrf_token', token);
            } else {
                opts.headers = opts.headers || {};
                opts.headers['X-CSRF-Token'] = token;
            }
        }
        opts.credentials = 'include';
        return fetch(url, opts).catch(function() {
            return {
                ok: false,
                status: 0,
                json: function() { return Promise.resolve({detail: 'Network error. Check your connection.'}); },
                text: function() { return Promise.resolve('Network error. Check your connection.'); },
            };
        });
    };

    (function() {
        var theme = localStorage.getItem('theme');
        if (theme === 'light') {
            document.documentElement.classList.remove('dark');
        }
    })();
    </script>

</body>
</html>
