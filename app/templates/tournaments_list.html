{% extends "base.html" %}
{% block content %}
<style>
.badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; }
.badge-pending { background:rgba(255,183,0,0.15); color:#ffb700; }
.badge-active { background:rgba(0,230,118,0.15); color:#00e676; }
.badge-completed { background:rgba(100,100,100,0.15); color:#888; }
</style>

<h1 class="text-2xl font-extrabold text-white mb-6">Tournaments</h1>

<div id="tournamentsList">
  <div class="card p-8 animate-pulse"><div class="h-5 bg-white/5 rounded w-3/4 mb-3"></div></div>
</div>

<script>
async function loadTournaments() {
  const list = await (await fetch('/api/tournaments')).json();
  let html = '';
  if (list.length === 0) {
    html = '<div class="card p-8 text-center"><p class="text-xs text-gray-600">No tournaments yet.</p></div>';
  } else {
    for (const t of list) {
      html += `<a href="/tournament/${t.id}" class="card card-hover block p-4 sm:p-5 mb-3" style="background:#141416; border:1px solid rgba(255,255,255,0.05);">
        <div class="flex items-start sm:items-center justify-between gap-2">
          <div class="min-w-0 flex-1">
            <div class="text-sm font-bold text-white mb-1 truncate">${esc(t.name)}</div>
            <div class="flex flex-wrap items-center gap-x-3 gap-y-1 text-[10px] text-gray-600 font-semibold uppercase tracking-widest">
              <span>${t.format}</span>
              <span>·</span>
              <span>${t.player_count} players</span>
              <span>·</span>
              <span>${new Date(t.created_at).toLocaleDateString()}</span>
            </div>
          </div>
          <span class="badge badge-${t.status} shrink-0">${t.status}</span>
        </div>
      </a>`;
    }
  }
  document.getElementById('tournamentsList').innerHTML = html;
}
function esc(s) { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
loadTournaments();
</script>
{% endblock %}
