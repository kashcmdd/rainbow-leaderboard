{% extends "base.html" %}
{% block title %}Tournaments — {{ site_name }}{% endblock %}
{% block content %}

<div class="page-head">
    <div>
        <p class="eyebrow">Competition</p>
        <h1 class="display text-[34px] leading-none sm:text-[40px]">Tournaments</h1>
        <p class="micro mt-2">Brackets &amp; placements</p>
    </div>
</div>

<div id="tournamentsList">
    <div class="panel p-6"><div class="skeleton h-14 w-full"></div></div>
</div>

<script>
async function loadTournaments() {
  const list = await (await fetch('/api/tournaments')).json();
  let html = '';
  if (list.length === 0) {
    html = '<div class="panel px-4 py-10 text-center text-xs text-ink3">No tournaments yet.</div>';
  } else {
    for (const t of list) {
      html += `<a href="/tournament/${t.id}" class="panel card-hover mb-2 flex items-center justify-between gap-3 p-4">
        <div class="min-w-0 flex-1">
          <div class="micro mb-1">${t.format} · ${t.player_count} players · ${new Date(t.created_at).toLocaleDateString()}</div>
          <div class="truncate text-[14px] font-semibold text-ink">${esc(t.name)}</div>
        </div>
        <span class="badge badge-${t.status} shrink-0">${t.status}</span>
      </a>`;
    }
  }
  document.getElementById('tournamentsList').innerHTML = html;
}
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
loadTournaments();
</script>
{% endblock %}
