{% extends "base.html" %}
{% block title %}Tournament — {{ site_name }}{% endblock %}
{% block content %}

<div class="page-head">
    <div>
        <p class="eyebrow">Bracket</p>
        <h1 class="display text-[34px] leading-none sm:text-[40px]" id="tournamentName">Tournament</h1>
        <p class="micro mt-2" id="tournamentMeta"></p>
    </div>
</div>

<div id="tournamentContent">
    <div class="panel p-6"><div class="skeleton h-6 w-3/4 mb-3"></div><div class="skeleton h-32"></div></div>
</div>

<script>
const IS_ADMIN = {% if request.session.get("user") and (request.session.get("user").get("id") in admin_discord_ids or request.session.get("user").get("is_admin")) %}true{% else %}false{% endif %};
const TMT_ID = '{{ tournament_id }}';

async function loadTournament() {
  const t = await (await fetch(`/api/tournaments/${TMT_ID}`)).json();
  document.getElementById('tournamentName').textContent = t.name;
  document.getElementById('tournamentMeta').textContent = `${t.status.toUpperCase()} · ${t.format} · ${t.participants.length} players`;

  let html = `<div class="grid grid-cols-1 gap-4 lg:grid-cols-3">`;

  // Participants
  html += `<div class="panel"><div class="section-head px-4 pt-3 mb-0"><h3 class="stat-label mb-0">Participants</h3><span class="micro">${t.participants.length}</span></div><div class="px-4 py-2">`;
  for (const p of t.participants) {
    html += `<div class="flex items-center justify-between gap-2 border-b py-2 last:border-b-0" style="border-color:var(--line)">
      <span class="truncate text-[13px]"><span class="num mr-2 text-[11px] text-ink3">${String(p.seed).padStart(2, '0')}</span>${p.username}</span>
      <span class="rank-chip shrink-0" style="--rank-color:${p.rank_color}">${p.rank_title}</span>
    </div>`;
  }
  html += `</div></div>`;

  // Bracket
  const maxRound = t.matches.length ? Math.max(...t.matches.map(m => m.round)) : 0;
  const roundNames = ['', 'Quarter-Finals', 'Semi-Finals', 'Final', 'Champion'];
  html += `<div class="panel lg:col-span-2"><div class="section-head px-4 pt-3 mb-0"><h3 class="stat-label mb-0">Bracket</h3></div><div class="p-4">`;
  if (t.status === 'pending') {
    html += `<p class="py-6 text-center text-xs text-ink3">Tournament has not started yet.</p>`;
  } else {
    html += `<div class="flex gap-4 overflow-x-auto pb-2">`;
    for (let r = 1; r <= maxRound; r++) {
      const roundMatches = t.matches.filter(m => m.round === r).sort((a, b) => a.position - b.position);
      const rname = roundNames[r] || `Round ${r}`;
      html += `<div class="bracket-round"><div class="micro mb-2">${rname}</div>`;
      for (const m of roundMatches) {
        const hasPlayers = m.team_a_name !== 'TBD' && m.team_b_name !== 'TBD';
        const wonA = m.winner_name === m.team_a_name;
        const wonB = m.winner_name === m.team_b_name;
        const played = m.played;
        html += `<div class="bracket-match ${played ? (wonA || wonB ? 'won' : 'lost') : ''}">
          <div class="flex items-center justify-between gap-3">
            <span class="truncate text-[12px] ${wonA ? 'font-semibold text-ink' : 'text-ink2'}">${esc(m.team_a_name || 'TBD')}</span>
            ${played ? `<span class="num text-[12px] font-semibold" style="color:${wonA ? 'var(--win)' : 'var(--ink-3)'}">${m.score_a}</span>` : ''}
          </div>
          <div class="mt-1 flex items-center justify-between gap-3">
            <span class="truncate text-[12px] ${wonB ? 'font-semibold text-ink' : 'text-ink2'}">${esc(m.team_b_name || 'TBD')}</span>
            ${played ? `<span class="num text-[12px] font-semibold" style="color:${wonB ? 'var(--win)' : 'var(--ink-3)'}">${m.score_b}</span>` : ''}
          </div>
          ${IS_ADMIN && hasPlayers && !played && t.status === 'active' ? `
            <div class="mt-2 flex items-center gap-1.5 border-t pt-2" style="border-color:var(--line)">
              <input id="sca_${m.id}" type="number" min="0" value="0" class="field !w-12 !px-1 !py-1 text-center text-[11px]" aria-label="Score A">
              <span class="micro">/</span>
              <input id="scb_${m.id}" type="number" min="0" value="0" class="field !w-12 !px-1 !py-1 text-center text-[11px]" aria-label="Score B">
              <button class="report-tmt-match btn btn-pink btn-sm ml-auto px-2 py-1" data-id="${m.id}">Report</button>
            </div>` : ''}
        </div>`;
      }
      html += `</div>`;
    }
    html += `</div>`;
  }
  html += `</div></div></div>`;

  document.getElementById('tournamentContent').innerHTML = html;

  document.querySelectorAll('.report-tmt-match').forEach(btn => btn.addEventListener('click', async () => {
    const mid = btn.dataset.id;
    const sca = parseInt(document.getElementById('sca_' + mid).value) || 0;
    const scb = parseInt(document.getElementById('scb_' + mid).value) || 0;
    if (sca === scb) { toast('Scores cannot be tied.', 'error'); return; }
    const r = await window.apiFetch(`/api/tournaments/${TMT_ID}/report-match`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ match_id: mid, score_a: sca, score_b: scb })
    });
    if (r.ok) { toast('Match reported.', 'success'); loadTournament(); }
    else { const e = await r.json(); toast(e.detail || 'Failed.', 'error'); }
  }));
}

function esc(s) { const d = document.createElement('div'); d.textContent = s || 'TBD'; return d.innerHTML; }

function toast(msg, type) {
  const el = document.createElement('div');
  el.className = 'fixed bottom-6 right-6 z-50 panel px-5 py-3 text-sm';
  el.style.borderColor = type === 'error' ? 'var(--loss)' : type === 'success' ? 'var(--win)' : 'var(--line-strong)';
  el.style.color = type === 'error' ? 'var(--loss)' : type === 'success' ? 'var(--win)' : 'var(--ink)';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .25s'; setTimeout(() => el.remove(), 300); }, 2500);
}

loadTournament();
</script>
{% endblock %}
