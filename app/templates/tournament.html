{% extends "base.html" %}
{% block content %}


<h1 class="text-2xl font-extrabold text-white mb-2" id="tournamentName">Tournament</h1>
<p class="text-xs text-gray-500 uppercase tracking-widest mb-6" id="tournamentMeta"></p>

<div id="tournamentContent">
  <div class="card p-8 animate-pulse"><div class="h-5 bg-white/5 rounded w-3/4 mb-3"></div></div>
</div>

<script>
const IS_ADMIN = {% if request.session.get("user") and (request.session.get("user").get("id") in admin_discord_ids or request.session.get("user").get("is_admin")) %}true{% else %}false{% endif %};
const TMT_ID = '{{ tournament_id }}';

async function loadTournament() {
  const t = await (await fetch(`/api/tournaments/${TMT_ID}`)).json();
  document.getElementById('tournamentName').textContent = t.name;
  document.getElementById('tournamentMeta').textContent = `${t.status.toUpperCase()} · ${t.format} · ${t.participants.length} players`;

  let html = `<div class="grid grid-cols-1 lg:grid-cols-3 gap-4 mb-6">
    <div class="card p-4"><h3 class="text-xs font-bold text-white uppercase tracking-widest mb-3">Participants</h3>`;
  for (const p of t.participants) {
    html += `<div class="flex items-center justify-between py-1.5" style="border-bottom:1px solid rgba(255,255,255,0.04);">
      <span class="text-sm text-white">#${p.seed} ${p.username}</span>
      <span class="text-[10px] font-semibold" style="color:${p.rank_color}">${p.rank_title}</span>
    </div>`;
  }
  html += `</div>`;

  // Bracket
  const maxRound = t.matches.length ? Math.max(...t.matches.map(m => m.round)) : 0;
  const roundNames = ['','Quarter-Finals','Semi-Finals','Final','Champion'];
  html += `<div class="lg:col-span-2 card p-4"><h3 class="text-xs font-bold text-white uppercase tracking-widest mb-3">Bracket</h3>`;
  if (t.status === 'pending') {
    html += `<p class="text-xs text-gray-600">Tournament has not started yet.</p>`;
  } else {
    html += `<div class="flex gap-4 overflow-x-auto pb-4">`;
    for (let r = 1; r <= maxRound; r++) {
      const roundMatches = t.matches.filter(m => m.round === r).sort((a,b) => a.position - b.position);
      const rname = roundNames[r] || `Round ${r}`;
      html += `<div class="bracket-round"><div class="text-[10px] font-bold text-gray-600 uppercase tracking-widest mb-2">${rname}</div>`;
      for (const m of roundMatches) {
        const hasPlayers = m.team_a_name !== 'TBD' && m.team_b_name !== 'TBD';
        const wonA = m.winner_name === m.team_a_name;
        const wonB = m.winner_name === m.team_b_name;
        const played = m.played;
        html += `<div class="bracket-match ${played?(wonA||wonB?'won':'lost'):''}">
          <div class="flex items-center justify-between gap-3">
            <span class="text-xs ${wonA?'font-bold text-white':'text-gray-400'}">${esc(m.team_a_name||'TBD')}</span>
            ${played ? `<span class="text-xs font-bold" style="color:${wonA?'#00e676':'#666'}">${m.score_a}</span>` : ''}
          </div>
          <div class="flex items-center justify-between gap-3">
            <span class="text-xs ${wonB?'font-bold text-white':'text-gray-400'}">${esc(m.team_b_name||'TBD')}</span>
            ${played ? `<span class="text-xs font-bold" style="color:${wonB?'#00e676':'#666'}">${m.score_b}</span>` : ''}
          </div>
          ${IS_ADMIN && hasPlayers && !played && t.status === 'active' ? `
            <div class="flex gap-1 mt-2 pt-2" style="border-top:1px solid rgba(255,255,255,0.04);">
              <input id="sca_${m.id}" type="number" min="0" value="0" class="w-14 sm:w-10 bg-transparent border border-white/10 rounded text-xs text-white text-center py-1.5" placeholder="A">
              <span class="text-[10px] text-gray-600 self-center">-</span>
              <input id="scb_${m.id}" type="number" min="0" value="0" class="w-14 sm:w-10 bg-transparent border border-white/10 rounded text-xs text-white text-center py-1.5" placeholder="B">
              <button class="report-tmt-match btn text-xs px-3 py-1.5" data-id="${m.id}" style="color:#e8197d;border-color:rgba(232,25,125,0.3);">Report</button>
            </div>` : ''}
        </div>`;
      }
      html += `</div>`;
    }
    html += `</div>`;
  }
  html += `</div></div>`;

  document.getElementById('tournamentContent').innerHTML = html;

  // Wire report buttons
  document.querySelectorAll('.report-tmt-match').forEach(btn => btn.addEventListener('click', async () => {
    const mid = btn.dataset.id;
    const sca = parseInt(document.getElementById('sca_'+mid).value) || 0;
    const scb = parseInt(document.getElementById('scb_'+mid).value) || 0;
    if (sca === scb) { toast('Scores cannot be tied.','error'); return; }
    const r = await window.apiFetch(`/api/tournaments/${TMT_ID}/report-match`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({match_id: mid, score_a: sca, score_b: scb})
    });
    if (r.ok) { toast('Match reported!','success'); loadTournament(); }
    else { const e = await r.json(); toast(e.detail||'Failed.','error'); }
  }));
}

function esc(s) { const d=document.createElement('div'); d.textContent=s||'TBD'; return d.innerHTML; }
function toast(msg, type) {
  const el = document.createElement('div');
  el.className = 'fixed bottom-6 right-6 z-50 card px-5 py-3 text-sm shadow-xl border transition-all';
  el.style.cssText = 'border-color:'+(type==='error'?'#ef4444':type==='success'?'#00e676':'rgba(255,255,255,0.1)')+';background:#1c1c1f;color:#fff;';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, 2500);
}

loadTournament();
</script>
{% endblock %}
