{% extends "base.html" %}
{% block title %}Team — {{ site_name }}{% endblock %}
{% block content %}

<div class="page-head">
    <div>
        <p class="eyebrow">Team</p>
        <h1 class="display text-[34px] leading-none sm:text-[40px]" id="teamName">Team</h1>
        <p class="micro mt-2" id="teamMeta">Loading…</p>
    </div>
    <a href="/teams" class="micro hover:text-ink">← Teams</a>
</div>

<div id="teamRoot">
    <div class="panel p-6">
        <div class="skeleton mb-4 h-8 w-56"></div>
        <div class="skeleton h-20"></div>
    </div>
</div>

<script>
const TEAM_ID = '{{ team_id }}';
const root = document.getElementById('teamRoot');

function esc(s) {
    const d = document.createElement('div');
    d.textContent = s == null ? '' : String(s);
    return d.innerHTML;
}

function formTicks(form) {
    return (form || []).map(function (r) {
        var color = r === 'W' ? 'var(--win)' : 'var(--loss)';
        return '<span class="num flex h-4 w-4 items-center justify-center border text-[9px] font-semibold" style="border-color:' + color + ';color:' + color + '">' + r + '</span>';
    }).join('');
}

function trend(history) {
    var values = (history || []).map(function (h) { return h.elo; });
    if (values.length < 2) return '';
    var width = 240, height = 44, pad = 4;
    var min = Math.min.apply(null, values);
    var max = Math.max.apply(null, values);
    var range = max - min || 1;
    var points = values.map(function (v, i) {
        return {
            x: (i / (values.length - 1)) * width,
            y: pad + (1 - (v - min) / range) * (height - pad * 2)
        };
    });
    var path = points.map(function (p, i) {
        return (i === 0 ? 'M' : 'L') + p.x.toFixed(1) + ' ' + p.y.toFixed(1);
    }).join(' ');
    return '<div class="mt-3"><div class="micro mb-1">Rating trend</div>' +
        '<svg viewBox="0 0 ' + width + ' ' + height + '" width="100%" height="' + height + '" preserveAspectRatio="none" aria-hidden="true">' +
        '<path d="' + path + '" fill="none" stroke="var(--signal)" stroke-width="1.5" stroke-linejoin="round"/></svg></div>';
}

async function loadTeam() {
    const res = await fetch('/api/teams/' + TEAM_ID);
    if (!res.ok) {
        root.innerHTML = '<div class="panel p-12 text-center"><p class="mb-4 text-sm text-ink3">Team not found.</p><a href="/leaderboard?tab=teams" class="btn btn-pink">Back to teams</a></div>';
        return;
    }
    const t = await res.json();
    document.getElementById('teamName').textContent = t.name;
    document.getElementById('teamMeta').textContent = `${t.format.toUpperCase()} · ${t.matches_played} ${t.matches_played === 1 ? 'match' : 'matches'} · ${t.wins}W ${t.losses}L${t.captain ? ' · Captain ' + t.captain : ''}`;

    const members = t.members.map(m => `
        <a href="/player/${m.id}" class="flex items-center justify-between gap-3 border-b py-2.5 last:border-b-0" style="border-color:var(--line)">
            <span class="flex min-w-0 items-center gap-3">
                <span class="flex h-8 w-8 shrink-0 items-center justify-center overflow-hidden border text-[10px] font-semibold" style="border-color:var(--line);background:var(--panel-2);color:var(--ink-3)">
                    ${m.avatar_url ? `<img src="${m.avatar_url}" alt="" class="h-full w-full object-cover">` : esc(m.username.charAt(0).toUpperCase())}
                </span>
                <span class="truncate text-[13px] font-semibold">${esc(m.username)}</span>
            </span>
            <span class="flex shrink-0 items-center gap-3">
                <span class="rank-chip" style="--rank-color:${m.rank_color}">${esc(m.rank_title)}</span>
                <span class="num rank-elo text-[13px] font-semibold" style="--rank-color:${m.rank_color}">${m.elo}</span>
            </span>
        </a>`).join('');

    const matches = t.recent_matches.length === 0
        ? '<div class="px-4 py-10 text-center text-xs text-ink3">No matches recorded.</div>'
        : t.recent_matches.map(m => `
            <a href="/match/${m.id}" class="flex items-center justify-between gap-3 border-b py-3 last:border-b-0 hover:bg-panel2" style="border-color:var(--line)">
                <div class="flex min-w-0 items-center gap-3">
                    <span class="badge ${m.result === 'win' ? 'badge-win' : 'badge-loss'}">${m.result === 'win' ? 'W' : 'L'}</span>
                    <span class="truncate text-[13px] font-semibold">${esc(m.opponent)}</span>
                    <span class="micro">${esc(m.format)}</span>
                </div>
                <div class="flex shrink-0 items-center gap-3">
                    <span class="num text-[13px] font-semibold">${m.score_a}–${m.score_b}</span>
                    <span class="num text-[11px]" style="color:${m.result === 'win' ? 'var(--win)' : 'var(--loss)'}">${m.elo_delta > 0 ? '+' : ''}${m.elo_delta}</span>
                </div>
            </a>`).join('');

    const solo = t.format === '1v1' && t.members.length === 1;
    let manage = '';
    let need = 0;
    if (t.can_manage) {
        const all = await (await fetch('/api/players')).json();
        const memberIds = new Set(t.members.map((m) => m.id));
        need = parseInt(t.format.split('v')[0], 10);
        manage = `<section class="section mt-8">
            <div class="section-head"><h2 class="section-title">Manage team</h2><span class="micro">${need} ${need === 1 ? 'player' : 'players'}</span></div>
            <div class="grid gap-3 sm:grid-cols-[1fr_auto]">
                <input id="teamNameInput" class="field" maxlength="128" aria-label="Team name">
                <button id="saveTeamBtn" type="button" class="btn btn-pink">Save team</button>
            </div>
            <div id="rosterPicker" class="mt-4 grid grid-cols-1 gap-1 sm:grid-cols-2">
                ${all.map((p) => `<label class="flex items-center gap-2 border-b py-2" style="border-color:var(--line)"><input type="checkbox" class="checkbox roster-check" value="${p.id}" ${memberIds.has(p.id) ? 'checked' : ''}><span class="text-[13px]">${esc(p.username)}</span></label>`).join('')}
            </div>
            <div class="mt-3 flex flex-wrap items-center justify-between gap-3">
                <span id="rosterCount" class="micro"></span>
                <button id="deactivateTeamBtn" type="button" class="btn btn-danger btn-sm">Deactivate team</button>
            </div>
        </section>`;
    }
    root.innerHTML = `
        <section class="mb-5 border-b pb-5" style="border-color:var(--line)">
            <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
                <div class="flex items-center gap-4">
                    <img src="/static/rank-icons/${t.rank_title.toLowerCase().replace(/ /g, '_')}.svg" alt="" class="h-14 w-14 sm:h-16 sm:w-16">
                    <div>
                    <div class="stat-label">Team rating</div>
                    <div class="num rank-elo mt-1 text-[42px] font-semibold leading-none" style="--rank-color:${t.rank_color}">${t.elo}</div>
                    <div class="mt-2 flex flex-wrap items-center gap-2">
                        <span class="rank-chip" style="--rank-color:${t.rank_color}">${esc(t.rank_title)}</span>
                        ${t.provisional ? '<span class="badge badge-warn" title="Rating is still settling">Provisional</span>' : ''}
                        <span class="micro">${t.wins}W / ${t.losses}L</span>
                        ${t.streak ? `<span class="badge ${t.streak > 0 ? 'badge-win' : 'badge-loss'}">${t.streak > 0 ? '+' : ''}${t.streak}</span>` : ''}
                    </div>
                    </div>
                    <div class="mt-2 flex flex-wrap items-center gap-2">
                        ${t.form && t.form.length ? `<span class="micro">Last 5</span>${formTicks(t.form)}` : ''}
                        ${t.movement_7d ? `<span class="micro">7d <span style="color:${t.movement_7d > 0 ? 'var(--win)' : 'var(--loss)'}">${t.movement_7d > 0 ? '+' : ''}${t.movement_7d}</span></span>` : ''}
                    </div>
                    ${trend(t.history)}
                </div>
                <div class="hidden grid-cols-3 gap-px border sm:grid sm:w-72" style="border-color:var(--line);background:var(--line)">
                    <div class="bg-panel px-4 py-3"><div class="stat-label">Played</div><div class="num mt-1 text-[15px] font-semibold">${t.matches_played}</div></div>
                    <div class="bg-panel px-4 py-3"><div class="stat-label">Wins</div><div class="num mt-1 text-[15px] font-semibold" style="color:var(--win)">${t.wins}</div></div>
                    <div class="bg-panel px-4 py-3"><div class="stat-label">Losses</div><div class="num mt-1 text-[15px] font-semibold" style="color:var(--loss)">${t.losses}</div></div>
                </div>
            </div>
        </section>
        <div class="grid grid-cols-1 gap-6 ${solo ? '' : 'lg:grid-cols-3'}">
            ${solo ? '' : `<div><div class="section-head"><h2 class="section-title">Roster</h2><span class="micro">${t.members.length}</span></div><div>${members}</div></div>`}
            <div class="${solo ? '' : 'lg:col-span-2'}"><div class="section-head"><h2 class="section-title">Recent matches</h2><span class="micro">${t.recent_matches.length}</span></div><div>${matches}</div></div>
        </div>${manage}`;
    if (t.can_manage) wireTeamEditor(t, need);
}

function wireTeamEditor(t, need) {
    const nameInput = document.getElementById('teamNameInput');
    if (nameInput) nameInput.value = t.name;
    const boxes = () => [...document.querySelectorAll('.roster-check')];
    const count = () => {
        const el = document.getElementById('rosterCount');
        if (!el) return;
        const n = boxes().filter((b) => b.checked).length;
        el.textContent = n + ' of ' + need + ' selected';
        el.style.color = n === need ? 'var(--ink-3)' : 'var(--loss)';
    };
    boxes().forEach((b) => b.addEventListener('change', count));
    count();

    const save = document.getElementById('saveTeamBtn');
    if (save) save.addEventListener('click', async () => {
        const ids = boxes().filter((b) => b.checked).map((b) => b.value);
        if (ids.length !== need) { alert('Select exactly ' + need + ' player' + (need === 1 ? '' : 's') + '.'); return; }
        save.disabled = true;
        const res = await window.apiFetch('/api/teams/' + t.id, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: nameInput.value.trim(), player_ids: ids }),
        });
        if (res.ok) location.reload();
        else {
            const err = await res.json().catch(() => ({}));
            save.disabled = false;
            alert(err.detail || 'Could not save the team.');
        }
    });

    const deactivate = document.getElementById('deactivateTeamBtn');
    if (deactivate) deactivate.addEventListener('click', async () => {
        if (!confirm('Deactivate this team? Its history stays, but it will not be reused for new matches.')) return;
        const res = await window.apiFetch('/api/teams/' + t.id, { method: 'DELETE' });
        if (res.ok) window.location.href = '/teams';
        else alert('Could not deactivate the team.');
    });
}

loadTeam();
</script>
{% endblock %}
